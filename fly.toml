# Fly.io config.
app = "wabunifu"
primary_region = "jnb"   # Johannesburg — closest Fly region to East Africa

[build]

[env]
  KAZI_DB_PATH = "/data/kazi_submissions.db"

[[mounts]]
  source = "kazi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep it running — SQLite + a stopped/cold-started
  auto_start_machines = true   # machine is fine, but this avoids cold-start latency
  min_machines_running = 1
