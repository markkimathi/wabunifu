<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company · Path & Pixel</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="pp-primitives.css">
<style>
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{max-width:var(--pp-container);width:100%;margin:0 auto;padding:0 var(--pp-page-margin);box-sizing:border-box}
  a{color:inherit}

  .head{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;padding:28px 0;border-bottom:1px solid var(--c-border)}
  .head .mark{width:96px;height:96px;flex:none;border-radius:var(--pp-radius-xl);background:var(--pp-ink);color:var(--pp-gold);
    display:inline-flex;align-items:center;justify-content:center;font-size:40px;font-weight:800}
  .head h1{margin:0 0 10px;font-size:var(--pp-display-size);line-height:1.0;letter-spacing:-0.04em;font-weight:800}
  .head-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:14.5px;color:var(--c-text-muted)}
  .head-meta span{display:inline-flex;align-items:center;gap:8px}
  .head-meta svg{color:var(--c-text-faint)}
  .head-cta{flex:none}

  .layout{padding:32px 0 64px}
  .roles-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .roles-head h2{margin:0;font-size:26px;line-height:1.12;letter-spacing:-0.024em;font-weight:700}
  .roles-head span{font-size:15px;color:var(--c-text-subtle)}

  .job-row{padding:20px 4px;border-bottom:1px solid var(--c-border);background:var(--c-surface);
    display:grid;grid-template-columns:minmax(0,1fr) 216px 118px 18px;align-items:center;gap:20px;
    cursor:pointer;text-decoration:none;color:inherit}
  .job-row:hover{background:var(--c-bg-sunken)}
  @media(max-width:760px){.job-row{grid-template-columns:1fr auto;grid-template-areas:"main go" "tags tags" "meta meta";row-gap:8px}
    .job-row .jr-go{display:none}}
  .jr-main h4{margin:0 0 2px;font-size:16px;font-weight:700;letter-spacing:-0.015em}
  .jr-main p{margin:0;font-size:13.5px;color:var(--c-text-subtle)}
  .jr-tags{display:flex;flex-wrap:wrap;gap:6px}
  .jr-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  @media(max-width:760px){.jr-meta{align-items:flex-start}}
  .jr-meta .pay{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .jr-meta .posted{font-size:12px;color:var(--c-text-faint)}
  .jr-go{color:var(--c-icon)}

  .state-panel{padding:64px 24px;text-align:center}
  .state-panel h3{margin:0 0 8px;font-size:22px;font-weight:700}
  .state-panel p{margin:0 0 20px;font-size:15px;color:var(--c-text-subtle)}

  .msg-composer{margin-top:14px;padding:16px;border:1px solid var(--c-border);border-radius:var(--pp-radius-md);background:var(--c-surface)}
  .msg-composer textarea{width:100%;border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-md);padding:10px 12px;
    font-family:var(--pp-font);font-size:14.5px;color:var(--c-text);background:var(--c-bg);resize:vertical;margin-bottom:10px}
  .msg-composer textarea:focus{outline:none;border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .msg-note{font-size:13px;color:var(--c-good-text);margin-top:8px}
</style>
</head>
<body>

<div id="pp-nav" data-active="jobs"></div>
<nav id="pp-breadcrumbs"></nav>

<main>
  <div class="wrap" id="content"><div class="state-panel"><p>Loading company…</p></div></div>
</main>

<div id="pp-footer" data-variant="short"></div>

<script src="pp-nav.js"></script>
<script src="pp-footer.js"></script>
<script>
(function(){
  "use strict";

  var ICONS = {
    place: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>',
    roles: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>',
    chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>'
  };

  var ELIG_META = {
    africa: { label: "Open across Africa", positive: true }, kenya: { label: "Open across Africa", positive: true },
    world: { label: "Global remote", positive: true }, check: { label: "Worth checking", positive: false }
  };
  function eligBadge(elig){
    var m = ELIG_META[elig] || ELIG_META.check;
    if (m.positive) return '<span class="pp-elig -positive"><span class="pp-elig-dot"></span>' + m.label + '</span>';
    return '<span class="pp-elig -check">' + m.label + '</span>';
  }
  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function postedLabel(days){
    if (days === 0) return "Today";
    if (days === 1) return "1 day ago";
    return days + " days ago";
  }
  function mostCommon(arr){
    var counts = {};
    var best = null, bestCount = 0;
    arr.forEach(function(v){
      if (!v) return;
      counts[v] = (counts[v] || 0) + 1;
      if (counts[v] > bestCount) { best = v; bestCount = counts[v]; }
    });
    return best;
  }

  var companyName = new URLSearchParams(location.search).get("name");

  // Best-effort client-side mirror of api/db.py's _slugify_company() — good
  // enough to find the common case (a company with no slug collision) on
  // the first try. A miss just falls through to the job-matched view below,
  // same as before a real companies table existed, so this is a pure
  // upgrade path, never a regression.
  function guessSlug(name){
    var base = (name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!base || !/^[a-z]/.test(base)) base = "company" + base;
    base = base.slice(0, 30);
    while (base.length < 3) base += "0";
    return base;
  }

  async function load(){
    var content = document.getElementById("content");
    if (!companyName) { content.innerHTML = notFound("No company specified."); return; }

    var realCompany = null;
    try {
      var cRes = await fetch("/api/companies/" + encodeURIComponent(guessSlug(companyName)), { cache: "no-store" });
      if (cRes.ok) {
        var candidate = await cRes.json();
        if (candidate.name.toLowerCase() === companyName.toLowerCase()) realCompany = candidate;
      }
    } catch (e) { /* fall through to the job-matched view */ }

    if (realCompany) { renderReal(realCompany); return; }

    var jobs;
    try {
      var res = await fetch("/api/jobs", { cache: "no-store" });
      if (!res.ok) throw new Error("bad status");
      var data = await res.json();
      jobs = (data.jobs || []).filter(function(j){ return j.co === companyName; });
    } catch (e) {
      content.innerHTML = notFound("The board didn't load. Try again in a moment."); return;
    }
    if (!jobs.length) { content.innerHTML = notFound("No open roles found for " + companyName + " right now."); return; }
    render(companyName, jobs, null);
  }

  function notFound(msg){
    return '<div class="state-panel"><h3>Company not found</h3><p>' + escapeHtml(msg) + '</p>' +
      '<a class="pp-btn pp-btn-primary" href="/jobs">Browse open roles</a></div>';
  }

  function renderReal(company){
    render(company.name, company.listings || [], company);
    var designerToken = localStorage.getItem("kazi_designer_token");
    if (!designerToken) return;
    var wrap = document.querySelector(".wrap.layout");
    if (!wrap) return;
    var composer = document.createElement("div");
    composer.className = "msg-composer";
    composer.innerHTML = '<label class="pp-field-label" style="display:block;margin-bottom:8px">Message ' + escapeHtml(company.name) + '</label>' +
      '<textarea id="msgBody" rows="3" placeholder="Say hello, ask about a role, whatever\'s useful."></textarea>' +
      '<button type="button" class="pp-btn pp-btn-primary pp-btn-sm" id="msgSendBtn">Send</button>' +
      '<span class="msg-note" id="msgNote" hidden>Sent. Find the reply in your dashboard\'s Messages tab.</span>';
    wrap.insertBefore(composer, wrap.firstChild);
    document.getElementById("msgSendBtn").addEventListener("click", async function(){
      var body = document.getElementById("msgBody").value.trim();
      if (!body) return;
      var btn = document.getElementById("msgSendBtn");
      btn.disabled = true;
      try {
        await fetch("/api/designers/me/conversations", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + designerToken },
          body: JSON.stringify({ company_id: company.id, body: body })
        });
        document.getElementById("msgBody").value = "";
        document.getElementById("msgNote").hidden = false;
      } catch (e) {}
      btn.disabled = false;
    });
  }

  function render(name, jobs, company){
    document.title = name + " · Path & Pixel";
    var crumbs = document.getElementById("pp-breadcrumbs");
    crumbs.setAttribute("data-crumbs", JSON.stringify([{ label: "Jobs", href: "pp-jobs.html" }, { label: name }]));
    PathPixelNav.renderBreadcrumbs(crumbs);

    var city = mostCommon(jobs.map(function(j){ return j.city; }));
    var mark = company && company.logo_path
      ? '<img src="' + escapeHtml(company.logo_path) + '" alt="" style="width:96px;height:96px;flex:none;border-radius:var(--pp-radius-xl);object-fit:cover">'
      : '<span class="mark">' + name[0].toUpperCase() + '</span>';

    document.getElementById("content").innerHTML =
      '<div class="head">' +
        mark +
        '<div style="flex:1;min-width:280px">' +
          '<h1>' + escapeHtml(name) + '</h1>' +
          (company && company.blurb ? '<p style="margin:0 0 12px;font-size:15.5px;line-height:1.55;color:var(--c-text-subtle);max-width:60ch">' + escapeHtml(company.blurb) + '</p>' : "") +
          '<div class="head-meta">' +
            (city ? '<span>' + ICONS.place + escapeHtml(city) + '</span>' : "") +
            '<span>' + ICONS.roles + jobs.length + ' open role' + (jobs.length === 1 ? "" : "s") + ' on Path &amp; Pixel</span>' +
            (company && company.eligibility ? eligBadge(company.eligibility) : "") +
          '</div>' +
        '</div>' +
        '<a class="pp-btn pp-btn-primary head-cta" href="/jobs?q=' + encodeURIComponent(name) + '">See all roles</a>' +
      '</div>' +
      '<div class="wrap layout" style="padding-left:0;padding-right:0">' +
        '<div class="roles-head"><h2>Open roles</h2><span>' + jobs.length + ' live now</span></div>' +
        (jobs.length ? '<div>' + jobs.map(renderJobRow).join("") + '</div>' : '<p style="color:var(--c-text-subtle);font-size:15px">Nothing open right now.</p>') +
      '</div>';
  }

  function renderJobRow(j){
    return '<a class="job-row" href="/jobs/' + encodeURIComponent(j.id) + '">' +
      '<div class="jr-main"><h4>' + escapeHtml(j.t) + '</h4><p>' + escapeHtml(j.city || "Remote") + '</p></div>' +
      '<div class="jr-tags">' + eligBadge(j.elig) + '<span class="pp-chip">' + escapeHtml(j.cat || "Design") + '</span></div>' +
      '<div class="jr-meta"><span class="pay">' + escapeHtml(j.pay || "Not disclosed") + '</span><span class="posted">' + postedLabel(j.days) + '</span></div>' +
      '<span class="jr-go">' + ICONS.chevron + '</span>' +
    '</a>';
  }

  document.addEventListener("DOMContentLoaded", load);
})();
</script>
</body>
</html>
