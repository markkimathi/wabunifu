<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Path & Pixel</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/pp-primitives.css">
<style>
  .sk-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}

  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{max-width:var(--pp-container);width:100%;margin:0 auto;padding:0 var(--pp-page-margin);box-sizing:border-box}
  a{color:inherit}

  .layout{padding:28px 0 72px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start;position:relative}
  @media(max-width:1023px){.layout{grid-template-columns:1fr;gap:0}
    .layout>[style*="grid-column"]{grid-column:1 !important;grid-row:auto !important}}

  .head-row{display:flex;align-items:flex-start;gap:28px;margin-bottom:26px;flex-wrap:wrap}
  .head-row .photo{width:132px;height:132px;border-radius:var(--pp-radius-xl);object-fit:cover;flex:none}
  .head-row h1{margin:0 0 6px;font-size:var(--pp-display-size);line-height:1.05;letter-spacing:-0.036em;font-weight:800}
  .verified-badge{display:inline-flex;vertical-align:middle;margin-left:4px;transform:translateY(-3px)}
  .verified-badge svg{display:block}
  .head-row .meta{margin:0 0 14px;font-size:18px;color:var(--c-text-muted)}
  .head-tags{display:flex;flex-wrap:wrap;gap:8px}
  .bio{margin:0 0 28px;font-size:18px;line-height:1.6;color:var(--c-text);max-width:64ch}

  aside.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--pp-header-height) + 24px)}
  @media(max-width:1023px){aside.side{position:static;padding-top:8px}}
  .side .pp-btn{flex:1}
  .side-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .follow-btn.-following{background:var(--c-surface);border-color:var(--c-accent);color:var(--c-accent-text)}
  .icon-btn{width:44px;height:44px;flex:none;border-radius:var(--pp-radius-lg);border:1px solid var(--c-border-strong);
    background:var(--c-surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--c-text)}
  .icon-btn:hover{background:var(--c-bg-sunken);border-color:var(--c-border-hover)}
  .side-card{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .side-card h4{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-text-faint)}
  .contact-row{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;margin-bottom:9px}
  .contact-row:last-child{margin-bottom:0}
  .contact-row span:first-child{color:var(--c-text-subtle)}
  .contact-row a{font-weight:600;text-decoration:none;color:var(--c-accent-text)}
  .link-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--c-border);border-radius:10px;
    text-decoration:none;color:inherit;margin-bottom:8px}
  .link-item:last-child{margin-bottom:0}
  .link-item:hover{background:var(--c-bg-sunken);border-color:var(--c-border-hover)}
  .link-icon{width:34px;height:34px;flex:none;border-radius:8px;background:var(--c-surface-inset);
    display:inline-flex;align-items:center;justify-content:center;color:var(--c-text-muted)}
  .link-item .label{display:block;font-size:15px;font-weight:600;line-height:1.3}
  .link-item .url{display:block;font-size:12.5px;color:var(--c-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-item svg.ext{flex:none;color:var(--c-border-strong)}

  .tabs-bar{position:sticky;top:56px;z-index:var(--pp-z-sticky);background:var(--c-bg);margin-bottom:32px}
  @media(min-width:1024px){.tabs-bar{top:var(--pp-header-height)}}

  .work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  @media(max-width:639px){.work-grid{grid-template-columns:1fr}}
  .work-card{cursor:pointer;text-decoration:none;color:inherit;border:none;background:none;padding:0;text-align:left;font-family:inherit;display:block;width:100%}
  .work-cover{aspect-ratio:4/3;background:var(--c-surface-inset);overflow:hidden;border-radius:var(--pp-radius-md) var(--pp-radius-md) 0 0;border:1px solid var(--c-border);border-bottom:none}
  .work-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .work-body{padding:20px;border:1px solid var(--c-border);border-top:none;border-radius:0 0 var(--pp-radius-md) var(--pp-radius-md)}
  .work-body h4{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.25}
  .work-body p{margin:0;font-size:14px;line-height:1.55;color:var(--c-text-subtle)}

  .about-block{max-width:820px}
  .about-block h3{margin:0 0 14px;font-size:24px;font-weight:600;letter-spacing:-0.016em}
  .about-skills{display:flex;flex-wrap:wrap;gap:8px}

  .exp-block{max-width:820px}
  .exp-row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--c-border)}
  .exp-row:last-child{border-bottom:none}
  @media(max-width:539px){.exp-row{grid-template-columns:1fr;gap:4px}}
  .exp-row .years{font-size:14px;color:var(--c-text-faint);font-variant-numeric:tabular-nums;padding-top:3px}
  .exp-row h4{margin:0 0 3px;font-size:19px;font-weight:700;letter-spacing:-0.018em}
  .exp-row .company{margin:0 0 10px;font-size:15px;color:var(--c-text-muted)}
  .exp-row .note{margin:0;font-size:15.5px;line-height:1.6;color:var(--c-text-subtle)}

  .activity-block{max-width:820px;display:flex;flex-direction:column;gap:12px}
  .activity-row{display:flex;gap:14px;padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);
    background:var(--c-surface);align-items:flex-start}
  .activity-tag{width:34px;height:34px;border-radius:var(--pp-radius-md);flex:none;display:inline-flex;align-items:center;
    justify-content:center;background:var(--c-surface-inset);color:var(--c-text-muted)}
  .activity-row p{margin:0 0 3px;font-size:15.5px;line-height:1.5;color:var(--c-text)}
  .activity-row span{font-size:13px;color:var(--c-text-faint)}

  .state-panel{padding:64px 24px;text-align:center}
  .state-panel h3{margin:0 0 8px;font-size:22px;font-weight:700}
  .state-panel p{margin:0 0 20px;font-size:15px;color:var(--c-text-subtle)}

  /* Modals: lightbox + message composer share the same backdrop pattern */
  .pp-backdrop{position:fixed;inset:0;z-index:var(--pp-z-modal);background:rgba(10,10,10,.55);
    display:flex;align-items:flex-start;justify-content:center;padding:56px 24px;box-sizing:border-box;
    opacity:0;pointer-events:none;transition:opacity var(--pp-duration) var(--pp-ease);overflow-y:auto}
  .pp-backdrop.-open{opacity:1;pointer-events:auto}
  .pp-modal{background:var(--c-surface);border-radius:var(--pp-radius-xl);box-shadow:0 20px 56px rgba(10,10,10,.28);
    width:100%;box-sizing:border-box;transform:scale(.97) translateY(6px);opacity:0;
    transition:transform var(--pp-duration) var(--pp-ease),opacity var(--pp-duration) var(--pp-ease);flex:none}
  .pp-backdrop.-open .pp-modal{transform:scale(1) translateY(0);opacity:1}

  .lb-modal{max-width:980px;overflow:hidden}
  .lb-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--c-border)}
  .lb-head h3{margin:0 0 2px;font-size:22px;font-weight:700;letter-spacing:-0.02em}
  .lb-head p{margin:0;font-size:14px;color:var(--c-text-faint)}
  .lb-body{max-height:60vh;overflow-y:auto;padding:28px 32px 36px}
  .lb-hero{aspect-ratio:16/9;background:var(--c-surface-inset);border:1px solid var(--c-border);border-radius:var(--pp-radius-md);
    overflow:hidden;margin-bottom:24px}
  .lb-hero img{width:100%;height:100%;object-fit:cover;display:block}
  .lb-copy{max-width:640px;font-size:17px;line-height:1.65;color:var(--c-text-muted)}
  .lb-stats{display:flex;gap:32px;padding:20px 0;border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border);
    margin:24px 0;flex-wrap:wrap}
  .lb-stats .stat-value{font-size:26px;font-weight:800;letter-spacing:-0.028em;font-variant-numeric:tabular-nums}
  .lb-stats .stat-label{font-size:13px;color:var(--c-text-faint)}
  .lb-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:639px){.lb-gallery{grid-template-columns:1fr 1fr}}
  .lb-gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--c-border);border-radius:var(--pp-radius-md);display:block}
  .lb-credits{margin:24px 0 0;font-size:14px;color:var(--c-text-faint)}
  .lb-cta{margin-top:24px}

  .msg-modal{max-width:480px;padding:26px}
  .msg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .msg-head h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.018em}
  .msg-sub{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--c-text-faint)}
  .msg-modal label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .msg-modal textarea{width:100%;padding:12px 14px;border-radius:var(--pp-radius-lg);background:var(--c-bg);
    font-family:inherit;font-size:15px;line-height:1.55;color:var(--c-text);resize:vertical;border:1px solid var(--c-border-strong);
    outline:none;box-sizing:border-box}
  .msg-modal textarea:focus{border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .msg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:7px;margin-bottom:20px}
  .msg-hint{font-size:12.5px;color:var(--c-text-faint)}
  .msg-hint.-warn{color:var(--c-bad-text)}
  .msg-count{font-size:12.5px;color:var(--c-text-faint);font-variant-numeric:tabular-nums}
  .msg-actions{display:flex;gap:10px;justify-content:flex-end}

  .pp-toast{position:fixed;bottom:24px;left:0;right:0;z-index:calc(var(--pp-z-modal) + 2);display:flex;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity var(--pp-duration) var(--pp-ease)}
  .pp-toast.-open{opacity:1}
  .pp-toast-inner{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--pp-radius-lg);
    background:var(--c-text);color:var(--c-bg);box-shadow:0 12px 32px rgba(10,10,10,.24);font-size:14px}
  .follower-count{flex-basis:100%;margin:2px 0 0;font-size:13.5px;color:var(--c-text-subtle);
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="pp-nav" data-active="people"></div>
<nav id="pp-breadcrumbs"></nav>

<main>
  <div class="wrap" id="content"><div class="sk-head" aria-hidden="true">
      <div class="skeleton-block" style="width:72px;height:72px;border-radius:50%;flex:none"></div>
      <div style="flex:1;min-width:0">
        <div class="skeleton-block" style="height:28px;width:min(420px,74%)"></div>
        <div class="skeleton-block" style="height:15px;width:min(280px,52%);margin-top:12px"></div>
      </div>
    </div>
    <div class="skeleton-block" style="height:13px;width:94%;margin-bottom:9px" aria-hidden="true"></div>
    <div class="skeleton-block" style="height:13px;width:88%;margin-bottom:9px" aria-hidden="true"></div>
    <div class="skeleton-block" style="height:13px;width:62%" aria-hidden="true"></div>
    <p class="pp-sr-only" role="status">Loading this profile.</p></div>
</main>

<div id="pp-footer" data-variant="short"></div>

<div id="ppToast" class="pp-toast"><div class="pp-toast-inner" id="ppToastText"></div></div>

<script src="/pp-nav.js"></script>
<script src="/pp-footer.js"></script>

    github: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.27 5.68.42.36.78 1.07.78 2.17v3.21c0 .31.21.67.8.56A10.52 10.52 0 0023.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>'
  };
  function linkIcon(label){
    var key = (label || "").toLowerCase();
    for (var k in PLATFORM_ICON) if (key.indexOf(k) !== -1) return PLATFORM_ICON[k];
    return ICONS.globe;
  }

  // Matches AVAILABILITY_STATUSES in api/main.py exactly.
  var AVAIL_META = {
    "Available": { label: "Available", positive: true },
    "Open to offers": { label: "Open to offers", positive: true },
    "Not available": { label: "Not available", positive: false },
    "": { label: "Availability not set", positive: false }
  };

  var ACTIVITY_META = {
    question: { icon: ICONS.question, verb: "Asked", bg: "var(--c-surface-inset)" },
    reply: { icon: ICONS.reply, verb: "Replied to", bg: "var(--c-surface-inset)" },
    session: { icon: ICONS.session, verb: "Attended", bg: "var(--c-surface-inset)" }
  };

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initialsOf(name){
    return (name || "?").trim().split(/\s+/).map(function(w){ return w[0]; }).slice(0, 2).join("").toUpperCase();
  }
  function fmtDate(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function pathId(){
    var parts = location.pathname.split("/").filter(Boolean);
    return parts[parts.length - 1] || "";
  }
  var identifier = pathId();
  var designer = null;
  var currentUser = null;
  var isOwn = false;
  var following = false;
  var followerCount = 0;
  var activeProject = null;

  function designerToken(){ return localStorage.getItem("kazi_designer_token") || ""; }

  async function loadProfile(){
    var content = document.getElementById("content");
    if (!identifier) { content.innerHTML = notFoundHtml("No profile specified."); return; }
    try {
      var res = await fetch("/api/designers/" + encodeURIComponent(identifier), { cache: "no-store" });
      if (!res.ok) throw new Error("not found");
      designer = await res.json();
      followerCount = designer.followers_count || 0;
    } catch (e) {
      // Before telling anyone their profile doesn't exist, check whether it is
      // their own, still in review. Saying "doesn't exist" to the person who
      // just built it is both wrong and the most discouraging thing we could
      // say at that moment.
      if (await showedOwnPendingProfile(content)) return;
      content.innerHTML = notFoundHtml("This profile isn't public, or doesn't exist.");
      return;
    }
    renderProfile();
    await loadViewerState();
    renderSideActions();
    // Who is looking is only known after loadViewerState(), and the tab panel
    // was painted before that — so the owner's view of their own empty
    // profile always rendered the visitor's copy.
    renderTabPanel();
  }

  async function loadViewerState(){
    var token = designerToken();
    if (!token) return;
    try {
      var res = await fetch("/api/designers/me", { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) return;
      currentUser = await res.json();
      isOwn = currentUser.id === designer.id;
      if (!isOwn) {
        var fRes = await fetch("/api/designers/me/follows", { headers: { Authorization: "Bearer " + token } });
        if (fRes.ok) {
          var data = await fRes.json();
          following = (data.follows || []).some(function(f){ return f.target_type === "designer" && f.target_id === designer.id; });
        }
      }
    } catch (e) { /* stay signed-out */ }
  }

  /* True when the signed-in designer is the owner of the profile that just
     404'd, in which case we explain the review instead of denying it. */
  async function showedOwnPendingProfile(content){
    var token = designerToken();
    if (!token) return false;
    try {
      var res = await fetch("/api/designers/me", { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) return false;
      var mine = await res.json();
      var isMine = String(mine.handle || "") === identifier || String(mine.id) === identifier;
      if (!isMine) return false;
      var pending = (mine.status || "") === "pending";
      content.innerHTML = '<div class="state-panel">' +
        '<h3>' + (pending ? "Your profile is in review" : "Your profile isn\'t public") + '</h3>' +
        '<p>' + (pending
          ? "Someone reads every profile before it joins the directory. This page goes live the moment yours is approved — the link won\'t change, so it\'s safe to keep."
          : "It isn\'t visible in the directory right now. Your dashboard has the details.") + '</p>' +
        '<a class="pp-btn pp-btn-primary" href="/dashboard">Go to your dashboard</a></div>';
      return true;
    } catch (e) { return false; }
  }

  function notFoundHtml(msg){
    return '<div class="state-panel"><h3>Profile not found</h3><p>' + escapeHtml(msg) + '</p>' +
      '<a class="pp-btn pp-btn-primary" href="/people">Browse the directory</a></div>';
  }

  var currentTab = "work";

  function renderProfile(){
    document.title = designer.display_name + " · Path & Pixel";
    var crumbs = document.getElementById("pp-breadcrumbs");
    crumbs.setAttribute("data-crumbs", JSON.stringify([{ label: "People", href: "/people" }, { label: designer.display_name }]));
    PathPixelNav.renderBreadcrumbs(crumbs);

    var avail = AVAIL_META[designer.availability_status || ""] || AVAIL_META[""];
    var discChips = (designer.discipline || []).map(function(d){ return '<span class="pp-chip">' + escapeHtml(d) + '</span>'; }).join("");

    var tabs = [
      { id: "work", label: "Work", count: (designer.projects || []).length }
    ];
    if (designer.skills && designer.skills.length) tabs.push({ id: "about", label: "About" });
    if (designer.role_history && designer.role_history.length) tabs.push({ id: "experience", label: "Experience" });
    tabs.push({ id: "community", label: "Community" });
    if (tabs.every(function(t){ return t.id !== currentTab; })) currentTab = "work";

    document.getElementById("content").innerHTML =
      '<div class="layout">' +
        '<div style="grid-column:1;grid-row:1">' +
          '<div class="head-row">' +
            (designer.photo_path
              ? '<img class="photo" src="' + escapeHtml(designer.photo_path) + '" alt="">'
              : '<span class="pp-avatar -lg" style="border-radius:var(--pp-radius-xl);width:132px;height:132px;font-size:40px">' + initialsOf(designer.display_name) + '</span>') +
            '<div style="flex:1;min-width:min(280px,100%)">' +
              '<h1 class="name-row">' + escapeHtml(designer.display_name) + ' <span class="verified-badge" title="Reviewed and published by Path & Pixel">' + ICONS.verified + '</span></h1>' +
              '<p class="meta">' + [designer.headline, designer.location, designer.years_experience ? designer.years_experience + " years" : ""]
                .filter(Boolean).map(escapeHtml).join(" · ") + '</p>' +
              '<div class="head-tags">' +
                '<span class="pp-status' + (avail.positive ? " -good" : " -neutral") + '">' + avail.label + '</span>' +
                // What kind of work, next to whether they're looking — the two
                // halves an employer needs before deciding to write.
                (designer.open_to || []).map(function(o){
                  return '<span class="pp-chip -outline">' + escapeHtml(o) + '</span>';
                }).join("") +
                discChips +
              '</div>' +
            '</div>' +
          '</div>' +
          (designer.bio ? '<p class="bio">' + escapeHtml(designer.bio) + '</p>' : "") +
        '</div>' +

        '<aside class="side" style="grid-column:2;grid-row:1 / span 2">' +
          '<div class="side-row" id="sideActions"></div>' +
          (designer.phone || designer.contact_email ? contactCardHtml() : "") +
          (linksCardHtml()) +
        '</aside>' +

        '<div style="grid-column:1;grid-row:2">' +
          '<div class="pp-tabs tabs-bar" id="tabsBar">' +
            tabs.map(function(t){
              return '<button type="button" class="pp-tab' + (t.id === currentTab ? " -active" : "") + '" data-tab="' + t.id + '">' +
                escapeHtml(t.label) + (t.count ? '<span class="pp-tab-count">' + t.count + '</span>' : "") + '</button>';
            }).join("") +
          '</div>' +
          '<div id="tabPanel"></div>' +
        '</div>' +
      '</div>' +
      '<div class="pp-backdrop" id="lbBackdrop"></div>' +
      '<div class="pp-backdrop" id="msgBackdrop"></div>';

    wireInteractions();
    renderSideActions();
    renderTabPanel();
  }

  function renderSideActions(){
    var el = document.getElementById("sideActions");
    if (!el) return;
    if (isOwn) {
      el.innerHTML = '<a class="pp-btn pp-btn-secondary" style="flex:1" href="/dashboard">Edit your profile</a>' +
        '<button type="button" class="icon-btn" id="shareBtn" aria-label="Share profile">' + ICONS.share + '</button>';
    } else {
      el.innerHTML =
        '<button type="button" class="pp-btn follow-btn' + (following ? " -following pp-btn-secondary" : " pp-btn-primary") + '" id="followBtn">' +
          (following ? "Following" : "Follow") +
        '</button>' +
        '<button type="button" class="pp-btn pp-btn-secondary" id="messageBtn">Message</button>' +
        '<button type="button" class="icon-btn" id="shareBtn" aria-label="Share profile">' + ICONS.share + '</button>';
    }
    // The count the API has always returned and no page has ever shown. Only
    // above zero: at this size "0 followers" under every profile reads as an
    // empty room, and a number nobody can act on is worse than no number.
    if (followerCount > 0) {
      el.insertAdjacentHTML("beforeend",
        '<p class="follower-count">' + followerCount +
        (followerCount === 1 ? " follower" : " followers") + '</p>');
    }
    var shareBtn = document.getElementById("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", onShare);
    var followBtn = document.getElementById("followBtn");
    if (followBtn) followBtn.addEventListener("click", onToggleFollow);
    var messageBtn = document.getElementById("messageBtn");
    if (messageBtn) messageBtn.addEventListener("click", openMessage);
  }

  function contactCardHtml(){
    return '<div class="side-card"><h4>Contact</h4>' +
      (designer.contact_email ? '<div class="contact-row"><span>Email</span><a href="mailto:' + escapeHtml(designer.contact_email) + '">' + escapeHtml(designer.contact_email) + '</a></div>' : "") +
      (designer.phone ? '<div class="contact-row"><span>Phone</span><a href="tel:' + escapeHtml(designer.phone) + '">' + escapeHtml(designer.phone) + '</a></div>' : "") +
    '</div>';
  }

  function linksCardHtml(){
    var links = designer.links || [];
    var resumeBtn = designer.resume_url
      ? '<button type="button" class="pp-btn pp-btn-dark" style="margin-top:' + (links.length ? "14px" : "0") + ';width:100%" id="resumeBtn">' + ICONS.download + 'Download résumé</button>'
      : "";
    if (!links.length && !resumeBtn) return "";
    return '<div class="side-card"><h4>Elsewhere</h4>' +
      links.map(function(l){
        var host = "";
        try { host = new URL(l.url).host.replace(/^www\./, ""); } catch (e) { host = l.url; }
        return '<a class="link-item" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' +
          '<span class="link-icon">' + linkIcon(l.label) + '</span>' +
          '<span style="flex:1;min-width:0"><span class="label">' + escapeHtml(l.label) + '</span><span class="url">' + escapeHtml(host) + '</span></span>' +
          ICONS.ext +
        '</a>';
      }).join("") +
      resumeBtn +
    '</div>';
  }

  function renderTabPanel(){
    var panel = document.getElementById("tabPanel");
    if (currentTab === "work") {
      var projects = designer.projects || [];
      if (!projects.length) {
        // Your own empty profile used to describe you in the third person —
        // "Blank Person hasn't added any featured work" — and offer no way to
        // change it from the page you were standing on.
        panel.innerHTML = '<div class="pp-empty" style="max-width:420px">' +
          '<div class="pp-empty-icon">' + ICONS.project + '</div>' +
          (isOwn
            ? '<h3>No work on your profile yet</h3>' +
              '<p>This is the part employers actually look at. One project is enough to start.</p>' +
              '<a class="pp-btn pp-btn-primary" href="/dashboard?tab=work">Add a project</a>'
            : '<h3>No projects yet</h3><p>' + escapeHtml(designer.display_name) + ' hasn\'t added any featured work.</p>') +
        '</div>';
        return;
      }
      panel.innerHTML = '<div class="work-grid">' + projects.map(function(p){
        return '<button type="button" class="work-card" data-project="' + p.id + '">' +
          '<div class="work-cover">' + (p.image_path ? '<img src="' + escapeHtml(p.image_path) + '" alt="">' : "") + '</div>' +
          '<div class="work-body"><h4>' + escapeHtml(p.title) + '</h4>' +
            (p.description ? '<p>' + escapeHtml(p.description) + '</p>' : "") + '</div>' +
        '</button>';
      }).join("") + '</div>';
      panel.querySelectorAll("[data-project]").forEach(function(card){
        card.addEventListener("click", function(){ openLightbox(parseInt(card.getAttribute("data-project"), 10)); });
      });
    } else if (currentTab === "about") {
      panel.innerHTML = '<div class="about-block"><h3>Skills</h3><div class="about-skills">' +
        (designer.skills || []).map(function(s){ return '<span class="pp-chip">' + escapeHtml(s) + '</span>'; }).join("") +
      '</div></div>';
    } else if (currentTab === "experience") {
      var roles = (designer.role_history || []).slice().sort(function(a, b){
        if (!!a.is_current !== !!b.is_current) return a.is_current ? -1 : 1;
        return (b.start_date || "").localeCompare(a.start_date || "");
      });
      panel.innerHTML = '<div class="exp-block">' + roles.map(function(r){
        var span = (r.start_date || "") + " – " + (r.is_current ? "Present" : (r.end_date || ""));
        return '<div class="exp-row">' +
          '<span class="years">' + escapeHtml(span) + '</span>' +
          '<div><h4>' + escapeHtml(r.title) + '</h4>' +
            '<p class="company">' + escapeHtml(r.company) + '</p>' +
            (r.description ? '<p class="note">' + escapeHtml(r.description) + '</p>' : "") +
          '</div>' +
        '</div>';
      }).join("") + '</div>';
    } else if (currentTab === "community") {
      panel.innerHTML = '<div class="activity-block"><p style="color:var(--c-text-faint);font-size:14px">Loading activity…</p></div>';
      loadActivity();
    }
  }

  async function loadActivity(){
    var panel = document.getElementById("tabPanel");
    var items = [];
    try {
      var res = await fetch("/api/designers/" + encodeURIComponent(identifier) + "/activity", { cache: "no-store" });
      if (res.ok) items = (await res.json()).activity || [];
    } catch (e) { /* fall through to empty state */ }
    if (currentTab !== "community") return;
    if (!items.length) {
      // Same as the Work tab: your own profile shouldn't talk about you in
      // the third person, and it should offer the way in.
      panel.innerHTML = '<div class="pp-empty" style="max-width:420px">' +
        '<div class="pp-empty-icon">' + ICONS.question + '</div>' +
        (isOwn
          ? '<h3>Nothing from you in the community yet</h3>' +
            '<p>Questions you ask or answer, and sessions you attend, show up here.</p>' +
            '<a class="pp-btn pp-btn-secondary" href="/community">Go to the community</a>'
          : '<h3>No community activity yet</h3><p>' + escapeHtml(designer.display_name) + ' hasn\'t asked, answered or joined a session yet.</p>') +
      '</div>';
      return;
    }
    panel.innerHTML = '<div class="activity-block">' + items.map(function(a){
      var meta = ACTIVITY_META[a.type] || ACTIVITY_META.question;
      return '<div class="activity-row">' +
        '<span class="activity-tag">' + meta.icon + '</span>' +
        '<div style="flex:1;min-width:0"><p>' + meta.verb + ' <strong>' + escapeHtml(a.text) + '</strong></p>' +
          '<span>' + fmtDate(a.when) + '</span></div>' +
      '</div>';
    }).join("") + '</div>';
  }

  function openLightbox(projectId){
    activeProject = (designer.projects || []).find(function(p){ return p.id === projectId; });
    if (!activeProject) return;
    var backdrop = document.getElementById("lbBackdrop");
    var results = activeProject.results || [];
    backdrop.innerHTML = '<div class="pp-modal lb-modal">' +
      '<div class="lb-head"><div><h3>' + escapeHtml(activeProject.title) + '</h3>' +
        (activeProject.category ? '<p>' + escapeHtml(activeProject.category) + '</p>' : '') + '</div>' +
        '<button type="button" class="icon-btn" id="lbClose" aria-label="Close">' + ICONS.close + '</button></div>' +
      '<div class="lb-body">' +
        (activeProject.image_path ? '<div class="lb-hero"><img src="' + escapeHtml(activeProject.image_path) + '" alt=""></div>' : '') +
        '<div class="lb-copy">' +
          (activeProject.problem ? '<p>' + escapeHtml(activeProject.problem) + '</p>' : '') +
          (!activeProject.problem && activeProject.description ? '<p>' + escapeHtml(activeProject.description) + '</p>' : '') +
        '</div>' +
        (results.length ? '<div class="lb-stats">' + results.map(function(s){
          return '<div><div class="stat-value">' + escapeHtml(s.value) + '</div><div class="stat-label">' + escapeHtml(s.label) + '</div></div>';
        }).join("") + '</div>' : '') +
        (activeProject.gallery && activeProject.gallery.length ? '<div class="lb-gallery">' + activeProject.gallery.map(function(g){
          return '<img src="' + escapeHtml(g.image_path) + '" alt="' + escapeHtml(g.caption || "") + '">';
        }).join("") + '</div>' : '') +
        (activeProject.credits ? '<p class="lb-credits">' + escapeHtml(activeProject.credits) + '</p>' : '') +
        '<div class="lb-cta"><a class="pp-btn pp-btn-secondary" href="/designers/' + encodeURIComponent(identifier) + '/' + encodeURIComponent(activeProject.id) + '">View full case study</a></div>' +
      '</div>' +
    '</div>';
    backdrop.querySelector("#lbClose").addEventListener("click", closeLightbox);
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeLightbox(); });
    (window.PPRaf || requestAnimationFrame)(function(){ backdrop.classList.add("-open"); });
    document.addEventListener("keydown", onEscClose);
  }
  function closeLightbox(){
    var backdrop = document.getElementById("lbBackdrop");
    backdrop.classList.remove("-open");
    setTimeout(function(){ backdrop.innerHTML = ""; }, 200);
    document.removeEventListener("keydown", onEscClose);
  }

  function onShare(){
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: designer.display_name, url: url }).catch(function(){});
    } else {
      navigator.clipboard.writeText(url).then(function(){ showToast("Link copied."); });
    }
  }

  async function onToggleFollow(){
    var token = designerToken();
    if (!token) { location.href = "/signin?next=" + encodeURIComponent(location.pathname); return; }
    var wasFollowing = following;
    var wasCount = followerCount;
    following = !following;
    followerCount = Math.max(0, followerCount + (following ? 1 : -1));
    renderSideActions();
    try {
      var res = await fetch("/api/designers/me/follows/designer/" + designer.id, {
        method: "POST", headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) throw new Error("failed");
      // The server counts; the optimistic bump above is only there so the
      // number doesn't sit still while the request is in flight.
      var data = await res.json();
      if (typeof data.followers === "number" && data.followers !== followerCount) {
        followerCount = data.followers;
        renderSideActions();
      }
    } catch (e) {
      following = wasFollowing;
      followerCount = wasCount;
      renderSideActions();
    }
  }

  function openMessage(){
    var backdrop = document.getElementById("msgBackdrop");
    if (!designerToken()) { location.href = "/signin?next=" + encodeURIComponent(location.pathname); return; }
    backdrop.innerHTML = '<div class="pp-modal msg-modal">' +
      '<div class="msg-head"><h3>Message ' + escapeHtml(designer.display_name.split(" ")[0]) + '</h3>' +
        '<button type="button" class="icon-btn" id="msgClose" aria-label="Close" style="width:36px;height:36px">' + ICONS.close + '</button></div>' +
      '<p class="msg-sub">They usually reply within a few days. Say what the work is and whether there’s a budget, it saves everyone a round.</p>' +
      '<label for="msgNote">Your message</label>' +
      '<textarea id="msgNote" rows="5" maxlength="600" placeholder="Hi ' + escapeHtml(designer.display_name.split(" ")[0]) + ', I’d love to talk about…"></textarea>' +
      '<div class="msg-foot"><span class="msg-hint" id="msgHint">A sentence on the work goes furthest.</span><span class="msg-count" id="msgCount">0 / 600</span></div>' +
      '<div class="msg-actions">' +
        '<button type="button" class="pp-btn pp-btn-secondary" id="msgCancel">Cancel</button>' +
        '<button type="button" class="pp-btn pp-btn-primary" id="msgSend" disabled>Send message</button>' +
      '</div>' +
    '</div>';
    var note = backdrop.querySelector("#msgNote");
    var count = backdrop.querySelector("#msgCount");
    var send = backdrop.querySelector("#msgSend");
    var hint = backdrop.querySelector("#msgHint");
    note.addEventListener("input", function(){
      count.textContent = note.value.length + " / 600";
      var valid = note.value.trim().length >= 20;
      send.disabled = !valid;
      hint.textContent = note.value.length === 0 ? "A sentence on the work goes furthest."
        : (valid ? "Ready to send." : "A little more. Twenty characters minimum.");
      hint.classList.toggle("-warn", note.value.length > 0 && !valid);
    });
    backdrop.querySelector("#msgClose").addEventListener("click", closeMessage);
    backdrop.querySelector("#msgCancel").addEventListener("click", closeMessage);
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeMessage(); });
    send.addEventListener("click", function(){ sendMessage(note.value.trim(), send, backdrop.querySelector("#msgHint")); });
    (window.PPRaf || requestAnimationFrame)(function(){ backdrop.classList.add("-open"); note.focus(); });
    document.addEventListener("keydown", onEscClose);
  }
  function closeMessage(){
    var backdrop = document.getElementById("msgBackdrop");
    backdrop.classList.remove("-open");
    setTimeout(function(){ backdrop.innerHTML = ""; }, 200);
    document.removeEventListener("keydown", onEscClose);
  }
  async function sendMessage(body, sendBtn, hintEl){
    if (!body) return;
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    try {
      var res = await fetch("/api/designers/me/conversations", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + designerToken() },
        body: JSON.stringify({ peer_designer_id: designer.id, body: body })
      });
      if (!res.ok) throw new Error("failed");
      closeMessage();
      showToast("Message sent. " + designer.display_name.split(" ")[0] + " usually replies within a few days.");
    } catch (e) {
      hintEl.textContent = "Couldn't send that — try again.";
      sendBtn.disabled = false;
      sendBtn.textContent = "Send message";
    }
  }

  function onEscClose(e){
    if (e.key === "Escape") { closeLightbox(); closeMessage(); }
  }

  var toastTimer = null;
  function showToast(text){
    var el = document.getElementById("ppToast");
    document.getElementById("ppToastText").textContent = text;
    el.classList.add("-open");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("-open"); }, 3200);
  }

  function wireInteractions(){
    document.querySelectorAll("#tabsBar [data-tab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        currentTab = btn.getAttribute("data-tab");
        document.querySelectorAll("#tabsBar [data-tab]").forEach(function(b){ b.classList.toggle("-active", b === btn); });
        renderTabPanel();
      });
    });

    var resumeBtn = document.getElementById("resumeBtn");
    if (resumeBtn) resumeBtn.addEventListener("click", function(){ window.open(designer.resume_url, "_blank"); });
  }

  document.addEventListener("DOMContentLoaded", loadProfile);
})();
</script>
</body>
</html>
