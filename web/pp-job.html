<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job · Path & Pixel</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/pp-primitives.css">
<style>
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{max-width:var(--pp-container);width:100%;margin:0 auto;padding:0 var(--pp-page-margin);box-sizing:border-box}
  a{color:inherit}

  .layout{padding:24px 0 72px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;align-items:start}
  @media(max-width:1023px){.layout{grid-template-columns:1fr;gap:0}}

  /* The company name is the one link out of a role that isn't the apply
     button, so it reads as a link on hover without shouting in the meta line. */
  /* Same skeleton primitives as the list pages. A role page showed the words
     "Loading role…" while every other list on the site showed the shape of
     what was coming — one product, one loading language. */
  .sk-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
  .sk-lines{flex:1;min-width:0}

  /* Same shape as .share-backdrop above — this page styles its own overlays
     rather than relying on a class it doesn't define. */
  .apply-backdrop{position:fixed;inset:0;z-index:var(--pp-z-modal);background:rgba(10,10,10,.48);
    display:none;align-items:center;justify-content:center;padding:16px}
  .apply-backdrop.-open{display:flex}

  .apply-here-note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--c-text-faint)}
  .applied-state{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border-radius:var(--pp-radius-md);
    background:var(--c-good-bg);border:1px solid var(--c-good-border)}
  .applied-state .tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-good);
    color:var(--pp-white);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .applied-state strong{display:block;font-size:15px;font-weight:700;color:var(--c-good-text)}
  .applied-state span{display:block;font-size:13px;line-height:1.5;color:var(--c-text-subtle)}
  .applied-state span.quiet{margin-top:6px;color:var(--c-text-faint)}
  .applied-state a{color:var(--c-good-text)}
  .similar-card.-next{border-color:var(--pp-gold-400)}

  .apply-modal{width:min(560px,calc(100vw - 32px));max-height:88vh;overflow-y:auto;
    background:var(--c-surface);border-radius:var(--pp-radius-xl);padding:26px 28px;box-sizing:border-box}
  @media(max-width:639px){.apply-modal{padding:22px 18px;border-radius:var(--pp-radius-lg)}}
  .apply-modal h3{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-0.022em}
  .apply-sub{margin:0 0 18px;font-size:14.5px;line-height:1.6;color:var(--c-text-subtle)}
  .apply-flag{margin:0 0 18px;padding:10px 12px;border-radius:var(--pp-radius-sm);
    background:var(--c-bg-sunken);font-size:13.5px;line-height:1.5;color:var(--c-text-subtle)}
  /* The fit warning. Neutral by default because "we don't know" and "they
     didn't say" are not failures; red only when the role genuinely can't hire
     from where this person is. */
  .apply-fit{margin:0 0 16px;padding:12px 14px;border-radius:var(--pp-radius-md);
    background:var(--c-bg-sunken);border:1px solid var(--c-border)}
  .apply-fit strong{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
  .apply-fit span{display:block;font-size:13.5px;line-height:1.55;color:var(--c-text-subtle)}
  .apply-fit.-bad{background:var(--c-bad-bg);border-color:var(--c-bad-border)}
  .apply-fit.-bad strong{color:var(--c-bad-text)}

  .apply-you{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:12px 14px;
    border:1px solid var(--c-border);border-radius:var(--pp-radius-md)}
  .apply-you .pp-card-mark{width:38px;height:38px;font-size:15px;overflow:hidden;flex:none}
  .apply-you .pp-card-mark img{width:100%;height:100%;object-fit:cover;display:block}
  .apply-you strong{display:block;font-size:14.5px;font-weight:700}
  .apply-you span{display:block;font-size:13px;line-height:1.5;color:var(--c-text-subtle)}

  .apply-field{margin-bottom:16px}
  .apply-field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
  .apply-field label .opt{font-weight:400;color:var(--c-text-faint)}
  .apply-field textarea{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:var(--pp-radius-md);
    border:1px solid var(--c-border-strong);background:var(--c-bg);color:var(--c-text);
    font-family:inherit;font-size:15px;line-height:1.55;resize:vertical;outline:none}
  .apply-field textarea:focus{border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .apply-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  /* The employer's own words, set apart from our reading of the listing so
     the two are not mistaken for each other. */
  .elig-proof{margin:14px 0;padding:14px 16px;border-left:2px solid var(--c-border-strong);
    background:var(--c-bg-sunken);border-radius:0 var(--pp-radius-sm) var(--pp-radius-sm) 0}
  .elig-proof h5{margin:0 0 6px;font-size:14px;font-weight:700;letter-spacing:-0.01em}
  .elig-proof p{margin:0;font-size:14.5px;line-height:1.6}
  .elig-proof .src{margin-top:7px;font-size:12.5px;color:var(--c-text-faint)}

  .role-head .co-link{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .role-head .co-link:hover{border-bottom-color:currentColor}
  .role-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
  .role-head .pp-card-mark{width:64px;height:64px;font-size:26px;border-radius:var(--pp-radius-lg)}
  .role-head h1{margin:0 0 8px;font-size:var(--pp-h1-size);line-height:1.05;letter-spacing:-0.034em;font-weight:800}
  .role-head .meta{margin:0;font-size:17px;color:var(--c-text-muted)}
  .role-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}

  .desc{max-width:720px;font-size:17px;line-height:1.65;color:var(--c-text-muted)}
  .desc h2,.desc h3{color:var(--c-text);font-weight:600;letter-spacing:-0.016em;margin:24px 0 12px}
  .desc p{margin:0 0 14px}
  .desc ul,.desc ol{margin:0 0 14px;padding-left:20px}
  .desc li{margin-bottom:6px}
  .desc.-clamped{max-height:340px;overflow:hidden;position:relative;mask-image:linear-gradient(to bottom, black 70%, transparent 100%)}
  .expand-btn{align-self:flex-start;margin-top:16px}

  .prep-panel{margin-top:32px;max-width:720px;padding:22px 24px;border-radius:var(--pp-radius-lg);
    background:var(--c-surface);border:1px solid var(--c-border)}
  .prep-panel h4{margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:-0.018em}
  .prep-lead{margin:0 0 8px;font-size:14.5px;color:var(--c-text-subtle)}
  .prep-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .prep-note{margin:0 0 14px;font-size:14.5px;font-weight:600;color:var(--pp-gold-800)}
  .prep-list{margin:0;padding-left:20px;font-size:15.5px;line-height:1.6;color:var(--c-text-muted)}
  .prep-list li{margin-bottom:6px}
  .elig-panel{margin-top:32px;max-width:720px;padding:24px 26px;border-radius:var(--pp-radius-lg);
    background:var(--c-good-bg);border:1px solid var(--c-good-border)}
  .elig-panel h4{margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-0.018em;color:var(--c-good-text)}
  .elig-panel p{margin:0 0 12px;font-size:16.5px;line-height:1.6;color:var(--c-good-text)}
  .elig-panel p:last-child{margin:0;font-size:14.5px;opacity:.8}
  .elig-panel.-check{background:var(--pp-gold-200);border-color:var(--pp-gold-400)}
  .elig-panel.-check h4,.elig-panel.-check p{color:var(--pp-gold-800)}

  aside.apply-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--pp-header-height) + 24px);align-self:start}
  @media(max-width:1023px){aside.apply-rail{position:static;padding-top:32px}}
  .rail-card{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .pay-amount{font-size:26px;font-weight:800;letter-spacing:-0.028em;font-variant-numeric:tabular-nums;margin-bottom:2px}
  .pay-note{font-size:14px;color:var(--c-text-subtle);margin-bottom:20px}
  .rail-card .pp-btn{width:100%;margin-bottom:10px}
  /* Asked only after they've been sent to the company's site — before that
     there's nothing to confirm. */
  .applied-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;
    padding:11px 12px;border-radius:var(--pp-radius-md);background:var(--c-bg-sunken);border:1px solid var(--c-border)}
  .applied-ask .applied-q{font-size:13.5px;font-weight:600;flex:1;min-width:100%}
  .applied-ask button{border:none;background:none;padding:0;cursor:pointer;font-family:var(--pp-font);
    font-size:13.5px;font-weight:600;color:var(--c-text-subtle);text-decoration:underline}
  .applied-ask .applied-yes-btn{color:var(--c-accent-text)}
  .applied-ask .applied-yes{display:inline-flex;align-items:center;gap:7px;flex:1;
    font-size:13.5px;font-weight:600;color:var(--c-good-text)}
  .applied-ask .applied-yes svg{width:15px;height:15px}

  .rail-meta{margin-top:20px;padding-top:18px;border-top:1px solid var(--c-surface-inset);display:flex;flex-direction:column;gap:11px}
  .rail-meta-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
  .rail-closes{color:var(--pp-gold-800);font-weight:650}
  .rail-meta-row span:first-child{color:var(--c-text-subtle)}
  .rail-meta-row span:last-child{font-weight:600}

  .company-card{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .company-card .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .company-card .name{font-size:16px;font-weight:700;letter-spacing:-0.015em}
  .company-card .sub{font-size:13.5px;color:var(--c-text-subtle)}
  .company-card p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--c-text-muted)}
  .company-card a.more{font-size:14px;font-weight:600;color:var(--c-accent-text);text-decoration:none}

  .cv-card{padding:20px;border:1px solid var(--c-good-border);border-radius:var(--pp-radius-lg);background:var(--c-good-bg)}
  .cv-card h4{margin:0 0 6px;font-size:16px;font-weight:700;color:var(--c-good-text)}
  .cv-card p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--c-good-text)}
  .cv-option{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:10px;margin-bottom:8px;
    cursor:pointer;text-align:left;font-family:var(--pp-font);background:var(--c-surface);border:1px solid var(--c-border-strong)}
  .cv-option.-active{border-color:var(--c-good);box-shadow:0 0 0 3px var(--c-good-border)}
  .cv-dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--c-good-border);display:inline-flex;align-items:center;justify-content:center}
  .cv-option.-active .cv-dot{border-color:var(--c-good)}
  .cv-dot span{width:8px;height:8px;border-radius:50%;background:transparent}
  .cv-option.-active .cv-dot span{background:var(--c-good)}
  .cv-option .label{font-size:14px;font-weight:600;color:var(--c-good-text)}
  .cv-option .sub{display:block;font-size:12.5px;color:var(--c-good-text)}
  .cv-drop{border:1.5px dashed var(--c-good-border);border-radius:10px;padding:18px;text-align:center;background:var(--c-surface);margin-bottom:10px}
  .cv-drop p{margin:8px 0 2px;font-size:13.5px;font-weight:600;color:var(--c-good-text)}
  .cv-drop span{font-size:12px;color:var(--c-good-text)}
  .cv-run{height:44px;width:100%;border:none;border-radius:10px;background:var(--c-good-text);color:var(--pp-white);
    font-family:var(--pp-font);font-size:15px;font-weight:600;cursor:pointer}
  .cv-run:disabled{opacity:.5;cursor:not-allowed}
  .cv-score{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .cv-score .pct{font-size:38px;font-weight:800;letter-spacing:-0.03em;color:var(--c-good-text);font-variant-numeric:tabular-nums}
  .cv-score .note{font-size:13.5px;color:var(--c-good-text)}
  .cv-bar{height:8px;border-radius:999px;background:var(--c-good-border);margin-bottom:16px;overflow:hidden}
  .cv-bar span{display:block;height:100%;background:var(--c-good)}
  .cv-missing-label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-good-text);margin-bottom:8px}
  .cv-missing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .cv-missing span{padding:4px 10px;border-radius:7px;background:var(--pp-gold-300);color:var(--pp-gold-800);font-size:12.5px;font-weight:600}
  .cv-summary{margin:0 0 14px;font-size:13.5px;line-height:1.55;color:var(--c-good-text)}
  .cv-reset{height:40px;width:100%;border:1px solid var(--c-good-border);border-radius:10px;background:var(--c-surface);
    color:var(--c-good-text);font-family:var(--pp-font);font-size:14px;font-weight:600;cursor:pointer}

  .similar-card{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .similar-card h4{margin:0 0 14px;font-size:15px;font-weight:700}
  .similar-item{display:block;text-decoration:none;color:inherit;margin-bottom:14px}
  .similar-item:last-child{margin-bottom:0}
  .similar-item .t{font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:2px}
  .similar-item .s{font-size:13px;color:var(--c-text-subtle)}
  .similar-divider{height:1px;background:var(--c-surface-inset);margin:14px 0}

  .share-backdrop{position:fixed;inset:0;z-index:var(--pp-z-modal);background:rgba(10,10,10,.48);
    display:none;align-items:flex-start;justify-content:center;padding:120px 24px 24px}
  .share-backdrop.-open{display:flex}
  .share-panel{width:100%;max-width:440px;background:var(--c-surface);border-radius:var(--pp-radius-xl);box-shadow:var(--pp-shadow-xl);padding:26px}
  .share-panel h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.018em}
  .share-panel .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .share-panel .sub{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--c-text-subtle)}
  .share-link-row{display:flex;gap:8px;margin-bottom:20px}
  .share-link-row .box{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid var(--c-border);border-radius:10px;
    background:var(--c-bg-sunken);display:flex;align-items:center;overflow:hidden}
  .share-link-row .box span{font-family:var(--pp-font-mono);font-size:13px;color:var(--c-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .share-grid a{height:76px;border:1px solid var(--c-border);border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--c-text-muted);text-decoration:none}
  .share-grid a:hover{background:var(--c-bg-sunken);color:var(--c-text)}

  .state-panel{padding:64px 24px;text-align:center}
  .state-panel h3{margin:0 0 8px;font-size:22px;font-weight:700}
  .state-panel p{margin:0 0 20px;font-size:15px;color:var(--c-text-subtle)}
</style>
</head>
<body>

<div id="pp-nav" data-active="jobs"></div>
<nav id="pp-breadcrumbs"></nav>

<main>
  <div class="wrap" id="content">
    <div class="sk-head" aria-hidden="true">
      <div class="skeleton-block" style="width:64px;height:64px;border-radius:var(--pp-radius-lg);flex:none"></div>
      <div class="sk-lines">
        <div class="skeleton-block" style="height:30px;width:min(460px,78%)"></div>
        <div class="skeleton-block" style="height:15px;width:min(300px,55%);margin-top:12px"></div>
      </div>
    </div>
    <div class="skeleton-block" style="height:26px;width:min(420px,70%);border-radius:999px;margin-bottom:22px" aria-hidden="true"></div>
    <div class="skeleton-block" style="height:13px;width:96%;margin-bottom:9px" aria-hidden="true"></div>
    <div class="skeleton-block" style="height:13px;width:90%;margin-bottom:9px" aria-hidden="true"></div>
    <div class="skeleton-block" style="height:13px;width:64%" aria-hidden="true"></div>
    <p class="pp-sr-only" role="status">Loading this role.</p>
  </div>
</main>

<div id="pp-footer" data-variant="short"></div>

<script src="/pp-nav.js"></script>
<script src="/pp-footer.js"></script>
<script src="/pp-elig.js"></script>
<script>
(function(){
  "use strict";

  var ICONS = {
    save: '<svg width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="{{fill}}" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"></path></svg>',
    share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>',
    check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"></path></svg>',
    external: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>',
    chevron: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>',
    close: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
    upload: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"></path></svg>',
    email: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5L12 13l8.5-6.5"></path></svg>'
  };

  // Wording lives in pp-elig.js — a verdict is (elig, scope), so a role posted
  // as "Remote, Nigeria" reads as scoped to Nigeria rather than open Africa-wide.
  function eligGroup(elig){ return (elig === "kenya" || elig === "africa") ? "africa" : elig; }
  function eligBadge(j){ return PPElig.badge(j.elig, j.elig_scope || "", PPElig.getViewerCountry()); }
  function eligNote(j){ return PPElig.note(j.elig, j.elig_scope || "", PPElig.getViewerCountry()); }

  /* Applied is self-reported and signed-in only — it's a record you keep, and
     one that should survive changing device mid-search. */
  var askedApplied = false;
  var isApplied = false;

  function designerTokenOrNull(){ return localStorage.getItem("kazi_designer_token"); }

  async function loadAppliedState(jobId){
    var token = designerTokenOrNull();
    if (!token) return;
    try {
      var res = await fetch("/api/designers/me/applied", { headers: { "Authorization": "Bearer " + token } });
      if (!res.ok) return;
      var data = await res.json();
      isApplied = (data.jobs || []).some(function(j){ return j.job_id === jobId; });
    } catch (e) {}
    paintAppliedAsk();
  }

  function paintAppliedAsk(){
    var host = document.getElementById("appliedAsk");
    if (!host || !job) return;
    if (!designerTokenOrNull()) { host.hidden = true; return; }
    if (isApplied) {
      host.hidden = false;
      host.innerHTML = '<span class="applied-yes">' + ICONS.check + 'Marked as applied</span>' +
        '<button type="button" id="undoApplied">Undo</button>';
      document.getElementById("undoApplied").addEventListener("click", function(){ toggleApplied(false); });
      return;
    }
    if (!askedApplied) { host.hidden = true; return; }
    host.hidden = false;
    host.innerHTML = '<span class="applied-q">Did you apply?</span>' +
      '<button type="button" class="applied-yes-btn" id="yesApplied">Yes, mark it</button>' +
      '<button type="button" id="notYet">Not yet</button>';
    document.getElementById("yesApplied").addEventListener("click", function(){ toggleApplied(true); });
    document.getElementById("notYet").addEventListener("click", function(){
      askedApplied = false; paintAppliedAsk();
    });
  }

  async function toggleApplied(on){
    var token = designerTokenOrNull();
    if (!token || !job) return;
    isApplied = on;
    paintAppliedAsk();
    try {
      if (on) {
        await fetch("/api/designers/me/applied", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ job_id: job.id, title: job.t, company: job.co,
                                 location: job.city || "", url: job.url || "" })
        });
      } else {
        await fetch("/api/designers/me/applied/" + encodeURIComponent(job.id), {
          method: "DELETE", headers: { "Authorization": "Bearer " + token }
        });
      }
    } catch (e) {}
  }

  function savedIds(){
    try { return JSON.parse(localStorage.getItem("pp_saved_jobs") || "[]"); } catch (e) { return []; }
  }
  function isSaved(id){ return savedIds().indexOf(id) !== -1; }
  // See pp-jobs.html's identical note: localStorage is the fast local
  // cache both signed-in and signed-out visitors read from, and a signed-in
  // designer's save/unsave also fires a fire-and-forget call to the real
  // per-account endpoint so it persists across devices.
  function designerToken(){ return localStorage.getItem("kazi_designer_token"); }
  function setSaved(id, on, job){
    var ids = savedIds();
    var idx = ids.indexOf(id);
    if (on && idx === -1) ids.push(id);
    if (!on && idx !== -1) ids.splice(idx, 1);
    localStorage.setItem("pp_saved_jobs", JSON.stringify(ids));
    var token = designerToken();
    if (!token) return;
    if (on && job) {
      fetch("/api/designers/me/saved-jobs", {
        method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ job_id: job.id, title: job.t, company: job.co, location: job.city || "", eligibility: job.elig || "", url: job.url || "" })
      }).catch(function(){});
    } else if (!on) {
      fetch("/api/designers/me/saved-jobs/" + encodeURIComponent(id), {
        method: "DELETE", headers: { "Authorization": "Bearer " + token }
      }).catch(function(){});
    }
  }

  // Same derivation as _company_slug() on the server and guessSlug() on the
  // company page, so one company has one URL wherever it is linked from.
  function coSlug(name){
    var base = String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!base || !/^[a-z]/.test(base)) base = "company" + base;
    base = base.slice(0, 30);
    while (base.length < 3) base += "0";
    return base;
  }

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function postedLabel(days){
    if (days === 0) return "Today";
    if (days === 1) return "1 day ago";
    return days + " days ago";
  }
  function plainTextLength(html){
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").length;
  }

  function pathId(){
    var parts = location.pathname.split("/").filter(Boolean);
    return parts[parts.length - 1] || "";
  }
  var jobId = pathId();
  var job = null;
  var allJobs = [];

  async function loadJob(){
    var content = document.getElementById("content");
    if (!jobId) {
      content.innerHTML = notFoundHtml("No role specified.");
      return;
    }
    // Before the render, so the first paint is already personal rather than
    // correcting itself a moment later.
    if (window.PPElig) await PPElig.resolveViewer();
    try {
      var res = await fetch("/api/jobs/" + encodeURIComponent(jobId), { cache: "no-store" });
      if (!res.ok) throw new Error("not found");
      job = await res.json();
    } catch (e) {
      content.innerHTML = notFoundHtml("This role isn't here anymore. It may have closed or been removed.");
      return;
    }
    renderJob();
    loadSimilarAndCompany();
    loadAppliedState(job.id);
  }

  function notFoundHtml(msg){
    return '<div class="state-panel"><h3>Role not found</h3><p>' + escapeHtml(msg) + '</p>' +
      '<a class="pp-btn pp-btn-primary" href="/jobs">Browse open roles</a></div>';
  }

  /* Employer-posted roles can say what to bring. Shown as preparation, not a
     form: the application happens on the company's own site and we never
     collect answers, so presenting these as fields would imply otherwise.
     Scraped roles carry none of this and the block simply doesn't render. */
  function prepPanelHtml(job){
    var qs = job.screening || [];
    var skills = job.skills || [];
    if (!qs.length && !skills.length && !job.portfolio_required) return "";
    return '<div class="prep-panel">' +
      '<h4>Before you apply</h4>' +
      (skills.length
        ? '<p class="prep-lead">They named these as what matters:</p><div class="prep-chips">' +
          skills.map(function(sk){ return '<span class="pp-chip">' + escapeHtml(sk) + '</span>'; }).join("") + '</div>'
        : "") +
      (job.portfolio_required
        ? '<p class="prep-note">A portfolio or case study is required for this role.</p>' : "") +
      (qs.length
        ? '<p class="prep-lead">Be ready to answer:</p><ul class="prep-list">' +
          qs.map(function(q){ return '<li>' + escapeHtml(q) + '</li>'; }).join("") + '</ul>'
        : "") +
    '</div>';
  }

  function wireInteractions(hasLongDesc){
    var saveBtn = document.getElementById("saveBtn");
    function paintSave(){
      var saved = isSaved(job.id);
      saveBtn.classList.toggle("pp-btn-secondary", true);
      saveBtn.innerHTML = ICONS.save.replace("{{fill}}", saved ? "currentColor" : "none") + (saved ? "Saved" : "Save role");
    }
    paintSave();
    saveBtn.addEventListener("click", function(){
      // Same as the board: a save made signed out is discarded the moment the
      // account syncs, so ask for the sign-in instead of losing it later.
      if (!designerToken()) {
        location.href = "/signin?next=" + encodeURIComponent(location.pathname + location.search);
        return;
      }
      setSaved(job.id, !isSaved(job.id), job);
      paintSave();
    });

    // Only present when the role sends people to the employer's own site. A
    // role that takes applications here has no outbound click to track, and no
    // "did you apply?" to ask on return — we already know.
    var applyOut = document.getElementById("applyBtn");
    if (applyOut) applyOut.addEventListener("click", function(){
      fetch("/api/track/apply", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ job_id: job.id, job_title: job.t, company: job.co })
      }).catch(function(){});
      // The application happens on their site, in another tab, and we never
      // learn how it went. Asking on return is the only honest way to keep a
      // record — so ask once they're actually back, not before they've gone.
      askedApplied = true;
      setTimeout(paintAppliedAsk, 400);
    });
    paintAppliedAsk();

    if (hasLongDesc) {
      var expandBtn = document.getElementById("expandBtn");

      expandBtn.addEventListener("click", function(){
        var open = !descBox.classList.contains("-clamped");
        descBox.classList.toggle("-clamped", open);
        expandBtn.innerHTML = (open ? "Read the full description" : "Show less") + ICONS.chevron;
        expandBtn.querySelector("svg").style.transform = open ? "none" : "rotate(180deg)";
      });
    }

    wireApplyHere();

    var shareBackdrop = document.getElementById("shareBackdrop");
    var shareUrl = location.origin + "/jobs/" + encodeURIComponent(job.id);
    document.getElementById("shareUrlText").textContent = shareUrl.replace(/^https?:\/\//, "");
    // Modal at every width, unlike the filter panel — hence alwaysModal.
    // Escape was already handled; focus was not, so opening Share left you

    });

    var copyBtn = document.getElementById("copyLinkBtn");

    document.getElementById("shareGrid").innerHTML =

      '<a href="https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodedUrl + '" target="_blank" rel="noopener"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="color:var(--c-text)"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.83L0 1.15h7.59l5.24 6.93zM17.61 20.64h2.04L6.49 3.24H4.3z"></path></svg>X</a>' +
      '<a href="https://wa.me/?text=' + shareText + '%20' + encodedUrl + '" target="_blank" rel="noopener"><svg width="19" height="19" viewBox="0 0 24 24" fill="#25D366"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.04 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.64-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88zM20.52 3.45A11.8 11.8 0 0 0 12.04 0C5.5 0 .18 5.32.18 11.86c0 2.09.55 4.13 1.59 5.93L.08 24l6.36-1.67a11.85 11.85 0 0 0 5.6 1.43h.01c6.54 0 11.86-5.32 11.86-11.86 0-3.17-1.23-6.15-3.47-8.39z"></path></svg>WhatsApp</a>' +

  // ---- résumé check widget: wired to the real endpoints. Anonymous
  // upload goes through /api/ats/check; a signed-in designer with a saved
  // résumé can reuse it through /api/designers/me/ats-check instead. ----
  /* Applying, for the listings whose employer takes applications here. The
     form is deliberately short: they already have the profile, and a cover
     letter box mostly produces a worse version of what is on that page. */
  /* Borrowed from how Wellfound handles this: the fit warning belongs inside
     the apply panel, not only on the listing behind it. Someone who has
     scrolled past the badge and committed to applying is exactly the person
     who should be told the role can't hire them — before they write anything,
     and without stopping them if they want to try anyway. */
  function applyFitWarningHtml(){
    var country = PPElig.getViewerCountry();
    if (!country) {
      return '<div class="apply-fit"><strong>We don\'t know where you work from</strong>' +
        '<span>Set your country and the board can tell you which roles can actually hire you. ' +
        '<a href="/dashboard">Add it to your profile</a>.</span></div>';
    }
    var verdict = PPElig.openTo(job.elig, job.elig_scope || "", country);
    if (verdict === false) {
      return '<div class="apply-fit -bad"><strong>This role isn\'t open to ' + escapeHtml(country) + '</strong>' +
        '<span>' + escapeHtml(PPElig.note(job.elig, job.elig_scope || "", country)) +
        ' You can still apply, but say why you\'d work out anyway — it\'s the question they\'ll have.</span></div>';
    }
    if (verdict === null) {
      return '<div class="apply-fit"><strong>This posting doesn\'t say where it can hire</strong>' +
        '<span>Worth asking before you invest much in it. Applying is a fine way to ask.</span></div>';
    }
    return "";
  }

  var applySheet = null;

  function wireApplyHere(){
    var open = document.getElementById("applyHereBtn");
    if (!open) return;

    open.addEventListener("click", async function(){
      var token = designerToken();
      if (!token) {
        location.href = "/signin?next=" + encodeURIComponent(location.pathname);
        return;
      }
      if (applySheet) { applySheet.open(); return; }
      document.body.insertAdjacentHTML("beforeend", applyModalHtml());
      var backdrop = document.getElementById("applyBackdrop");
      var sheet = window.PPSheet && PPSheet({
        panel: backdrop, alwaysModal: true, toggle: open,
        closeBtn: document.getElementById("applyCancel")
      });
      applySheet = sheet;
      // Fill in who the employer will see. Fetched rather than assumed, so it
      // shows the profile as it actually stands right now.
      (async function(){
        try {
          var meRes = await fetch("/api/designers/me", { headers: { Authorization: "Bearer " + token } });
          if (!meRes.ok) return;
          var me = await meRes.json();
          var handle = me.handle || me.id;
          var nameEl = document.getElementById("applyName");
          var avEl = document.getElementById("applyAv");
          var link = document.getElementById("applyPreview");
          if (nameEl) nameEl.textContent = me.display_name || "Your profile";
          if (link) link.setAttribute("href", "/designers/" + encodeURIComponent(handle));
          if (avEl) {
            avEl.innerHTML = me.photo_path
              ? '<img src="' + escapeHtml(me.photo_path) + '" alt="">'
              : escapeHtml((me.display_name || "?").trim().charAt(0).toUpperCase());
          }
        } catch (e) { /* the block still says "Your profile" */ }
      })();

      if (window.PPCount) {
        PPCount(document.getElementById("applyNote"));
        (job.screening || []).forEach(function(_, i){ PPCount(document.getElementById("applyA" + i)); });
      }
      // Through the sheet rather than by adding the class directly, so focus
      // moves in, Escape closes, and focus returns — the first version set the
      // class itself and got an open modal nobody's keyboard could reach.
      if (sheet) sheet.open();
      else backdrop.classList.add("-open");

      document.getElementById("applySend").addEventListener("click", async function(e){
        var btn = e.currentTarget;
        var err = document.getElementById("applyErr");
        err.hidden = true;
        btn.disabled = true;
        btn.textContent = "Sending…";
        try {
          var res = await fetch("/api/designers/me/applications/" + job.submission_id, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({
              note: document.getElementById("applyNote").value.trim(),
              answers: (job.screening || []).map(function(_, i){
                return document.getElementById("applyA" + i).value.trim();
              })
            })
          });
          if (!res.ok) {
            var body = await res.json().catch(function(){ return {}; });
            throw new Error(body.detail || "That didn't send.");
          }
          if (sheet) sheet.close();
          applySheet = null;
          markApplied();
        } catch (e2) {
          err.textContent = e2.message;
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = "Send application";
        }
      });
    });
  }

  /* Replaces the button once it has been sent. The state lives on the page
     rather than only in a toast, because "did that go through?" is the whole
     anxiety of applying. */
  /* Mercor's confirmation is the reference here: it says what happens next
     and how long it takes, then offers somewhere to go. Landing on "Applied"
     and nothing else leaves the one question applying creates — now what? —
     unanswered, and the honest answer for this board is that we can't make an
     employer reply, so the useful move is the next role. */
  function markApplied(){
    var btn = document.getElementById("applyHereBtn");
    if (!btn) return;
    var note = btn.parentNode.querySelector(".apply-here-note");
    btn.outerHTML = '<div class="applied-state"><span class="tick">✓</span>' +
      '<div><strong>Applied</strong>' +
      '<span>It\'s with ' + escapeHtml(job.co) + '. They see it next to your profile, and ' +
      'the stage they put you at shows on your <a href="/dashboard">dashboard</a>, where you can ' +
      'also withdraw it.</span>' +
      '<span class="quiet">We can\'t make anyone reply, and plenty never do. Keep going.</span>' +
      '</div></div>';
    if (note) note.remove();
    highlightSimilar();
  }

  /* The similar-roles card already exists in the rail; after applying it stops
     being a footnote and becomes the next thing to do. */
  function highlightSimilar(){
    var card = document.getElementById("similarCard");
    if (!card) return;
    card.classList.add("-next");
    var h = card.querySelector("h4");
    if (h) h.textContent = "Worth applying to next";
    card.scrollIntoView({ block: "nearest" });
  }

  function initCvWidget(){
    var body = document.getElementById("cvBody");
    var token = localStorage.getItem("kazi_designer_token");
    var jobDescText = plainTextFrom(job.desc) || job.desc_text || job.t;
    var mode = "upload"; // "saved" | "upload"
    var pickedFile = null;
    var designer = null;

    function idleHtml(){
      var savedOption = designer && designer.resume_path
        ? '<button type="button" class="cv-option' + (mode === "saved" ? " -active" : "") + '" id="cvPickSaved">' +
            '<span class="cv-dot"><span></span></span>' +
            '<span><span class="label">Use the résumé on your profile</span>' +
            '<span class="sub">' + escapeHtml(designer.resume_filename || "your saved résumé") + '</span></span></button>'
        : "";
      return savedOption +
        '<button type="button" class="cv-option' + (mode === "upload" ? " -active" : "") + '" id="cvPickUpload">' +
          '<span class="cv-dot"><span></span></span><span class="label">' + (savedOption ? "Upload a different one" : "Upload your résumé") + '</span></button>' +
        (mode === "upload"
          ? '<div class="cv-drop" id="cvDrop">' + ICONS.upload +
              '<p>' + (pickedFile ? escapeHtml(pickedFile.name) : "Drop your résumé, or click to choose") + '</p>' +
              '<span>PDF or DOCX, under 5 MB</span>' +
              '<input type="file" id="cvFileInput" accept=".pdf,.docx" style="display:none">' +
            '</div>'
          : "") +
        '<button type="button" class="cv-run" id="cvRunBtn"' + ((mode === "upload" && !pickedFile) ? " disabled" : "") + '>Check my résumé</button>';
    }

    function doneHtml(result){
      var km = result.keyword_match;
      var missing = km ? km.missing.slice(0, 6) : [];
      return '<div class="cv-score"><span class="pct">' + (km ? km.score : result.score) + '%</span>' +
          '<span class="note">' + (km ? "keyword match" : "résumé score") + '</span></div>' +
        '<div class="cv-bar"><span style="width:' + (km ? km.score : result.score) + '%"></span></div>' +
        (missing.length
          ? '<span class="cv-missing-label">Missing from your résumé</span>' +
            '<div class="cv-missing">' + missing.map(function(w){ return "<span>" + escapeHtml(w) + "</span>"; }).join("") + '</div>'
          : "") +
        '<p class="cv-summary">' + (km
          ? "You already cover " + (km.matched.slice(0, 3).join(", ") || "some of what they're asking for") + ". Add the missing terms above in your own words if they genuinely apply to you."
          : "Word count: " + result.word_count + ". Full formatting checks are in your dashboard.") + '</p>' +
        '<button type="button" class="cv-reset" id="cvResetBtn">Check a different résumé</button>';
    }

    function render(){ body.innerHTML = idleHtml(); wireIdle(); }

    function wireIdle(){
      var savedBtn = document.getElementById("cvPickSaved");
      if (savedBtn) savedBtn.addEventListener("click", function(){ mode = "saved"; render(); });
      document.getElementById("cvPickUpload").addEventListener("click", function(){ mode = "upload"; render(); });
      if (mode === "upload") {
        var drop = document.getElementById("cvDrop");
        var input = document.getElementById("cvFileInput");
        drop.addEventListener("click", function(){ input.click(); });
        input.addEventListener("change", function(){
          pickedFile = input.files[0] || null;
          render();
        });
      }
      document.getElementById("cvRunBtn").addEventListener("click", runCheck);
    }

    async function runCheck(){
      var runBtn = document.getElementById("cvRunBtn");
      runBtn.disabled = true;
      runBtn.textContent = "Checking…";
      try {
        var result;
        if (mode === "saved" && token) {
          var res = await fetch("/api/designers/me/ats-check", {
            method: "POST",
            headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
            body: JSON.stringify({ job_description: jobDescText })
          });
          if (!res.ok) throw new Error(await res.text());
          result = await res.json();
        } else if (pickedFile) {
          var fd = new FormData();
          fd.append("file", pickedFile);
          fd.append("job_description", jobDescText);
          var res2 = await fetch("/api/ats/check", { method: "POST", body: fd });
          if (!res2.ok) throw new Error(await res2.text());
          result = await res2.json();
        } else {
          throw new Error("Choose a résumé first.");
        }
        body.innerHTML = doneHtml(result);
        document.getElementById("cvResetBtn").addEventListener("click", function(){ pickedFile = null; mode = "upload"; render(); });
      } catch (e) {
        runBtn.disabled = false;
        runBtn.textContent = "Check my résumé";
        alertInline(typeof e.message === "string" && e.message ? e.message : "Couldn't run that check, try again.");
      }
    }

    function alertInline(msg){
      var note = document.createElement("p");
      note.style.cssText = "margin:8px 0 0;font-size:12.5px;color:var(--c-bad-text)";
      note.textContent = msg;
      body.appendChild(note);
    }

    if (token) {
      fetch("/api/designers/me", { headers: { "Authorization": "Bearer " + token } })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ designer = d; if (d && d.resume_path) mode = "saved"; render(); })
        .catch(function(){ render(); });
    } else {
      render();
    }
  }

  function plainTextFrom(html){
    if (!html) return "";
    var d = document.createElement("div");
    d.innerHTML = html;
    return (d.textContent || "").trim();
  }

  async function loadSimilarAndCompany(){
    try {
      var res = await fetch("/api/jobs", { cache: "no-store" });
      var data = await res.json();
      allJobs = data.jobs || [];
    } catch (e) {
      document.getElementById("similarCard").innerHTML =
        '<h4>Similar and still open</h4><p style="font-size:14px;color:var(--c-text-subtle);margin:0 0 10px">These didn\'t load. The role above is unaffected.</p>' +
        '<button type="button" class="pp-btn pp-btn-secondary pp-btn-sm" id="retrySimilar">Try again</button>';
      var btn = document.getElementById("retrySimilar");
      if (btn) btn.addEventListener("click", loadSimilarAndCompany);
      return;
    }

    var companyCount = allJobs.filter(function(j){ return j.co === job.co && j.id !== job.id; }).length;
    var moreLink = document.getElementById("moreRolesLink");
    if (moreLink) moreLink.textContent = companyCount ? "More roles at " + job.co + " →" : "See all roles →";
    var companyCard = document.getElementById("companyCard");
    if (companyCard && companyCount === 0) {
      var p = companyCard.querySelector("p");
      if (p && !job.accepts_applications) p.textContent = "Applications go to their own careers page, Path & Pixel never hosts the application itself.";
    }

    var similar = allJobs.filter(function(j){ return j.id !== job.id && j.cat === job.cat; }).slice(0, 3);
    if (!similar.length) similar = allJobs.filter(function(j){ return j.id !== job.id; }).slice(0, 3);

    var similarCard = document.getElementById("similarCard");
    if (!similar.length) {
      similarCard.innerHTML = '<h4>Similar and still open</h4><p style="font-size:14px;color:var(--c-text-subtle);margin:0">Nothing else matches right now.</p>';
      return;
    }
    similarCard.innerHTML = '<h4>Similar and still open</h4>' +
      similar.map(function(j, i){
        return (i ? '<div class="similar-divider"></div>' : "") +
          '<a class="similar-item" href="/jobs/' + encodeURIComponent(j.id) + '">' +
            '<div class="t">' + escapeHtml(j.t) + '</div>' +
            '<div class="s">' + escapeHtml(j.co) + ' · ' + PPElig.label(j.elig, j.elig_scope || '', PPElig.getViewerCountry()).text + '</div></a>';
      }).join("");
  }

  document.addEventListener("DOMContentLoaded", loadJob);
})();
</script>
</body>
</html>
