<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Path & Pixel</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="pp-primitives.css">
<style>
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{max-width:var(--pp-container-wide);width:100%;margin:0 auto;padding:28px var(--pp-page-margin) 64px;box-sizing:border-box}
  a{color:inherit}

  /* Dashboard rail: full 248px labelled rail at desktop, 68px icon-only
     between 1024-1279px, replaced entirely by a horizontal chip row below
     1024px — three patterns on one markup, per the design's "Dashboard at
     1180" tablet-landscape spec (rail collapses, not a drawer). */
  .dash-layout{display:flex;align-items:flex-start;gap:32px}
  .dash-rail{display:none;flex:none;width:var(--pp-sidebar);flex-direction:column;gap:2px;
    position:sticky;top:24px}
  @media(min-width:1024px){.dash-rail{display:flex}}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail{width:var(--pp-sidebar-collapsed)}}
  .dash-rail-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:none;
    border-radius:var(--pp-radius-md);background:transparent;color:var(--c-text-muted);cursor:pointer;
    font-family:var(--pp-font);font-size:14.5px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden}
  .dash-rail-item svg{flex:none}
  .dash-rail-item:hover{background:var(--c-bg-sunken);color:var(--c-text)}
  .dash-rail-item.-active{background:var(--pp-gold-200);color:var(--pp-gold-800);font-weight:600}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail-item{width:44px;padding:0;justify-content:center}}
  .dash-rail-label{overflow:hidden;text-overflow:ellipsis}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail-label{display:none}}
  .dash-rail-spacer{flex:1;min-height:16px}
  .dash-rail-signout{color:var(--c-text)}
  .dash-main{flex:1;min-width:0}
  .dash-chips-mobile{margin-bottom:22px}
  @media(min-width:1024px){.dash-chips-mobile{display:none}}

  .dash-head h1{margin:0 0 4px;font-size:30px;line-height:1.1;letter-spacing:-0.026em;font-weight:800}
  .dash-head p{margin:0 0 20px;font-size:14.5px;color:var(--c-text-subtle)}

  /* Completion, framed as what it unlocks. Gold carries the progress; the rows
     are plain buttons so the whole line is the target, not just a link. */
  .strength-panel{padding:20px;border:1px solid var(--pp-gold-400);border-radius:var(--pp-radius-lg);
    background:var(--pp-gold-200);margin-bottom:20px}
  .strength-panel.-done{border-color:var(--c-good-border);background:var(--c-good-bg)}
  .sp-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px}
  .sp-head h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.015em;color:var(--pp-gold-800)}
  .strength-panel.-done .sp-head h3{color:var(--c-good-text)}
  .sp-pct{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pp-gold-800);flex:none}
  .strength-panel.-done .sp-pct{color:var(--c-good-text)}
  .sp-bar{height:6px;border-radius:999px;background:var(--pp-gold-400);overflow:hidden;margin-bottom:14px}
  .sp-bar span{display:block;height:100%;background:var(--pp-gold-800);transition:width var(--pp-duration) var(--pp-ease)}
  .strength-panel.-done .sp-bar{background:var(--c-good-border)}
  .strength-panel.-done .sp-bar span{background:var(--c-good-text)}
  .sp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .sp-item{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;cursor:pointer;
    padding:10px 12px;border-radius:var(--pp-radius-md);border:1px solid transparent;
    background:var(--c-surface);font-family:var(--pp-font)}
  .sp-item:hover{border-color:var(--pp-gold-400)}
  .sp-mark{width:15px;height:15px;flex:none;margin-top:2px;border-radius:50%;border:2px solid var(--pp-gold-400)}
  .sp-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .sp-label{font-size:14.5px;font-weight:600;color:var(--c-text)}
  .sp-why{font-size:13px;line-height:1.45;color:var(--c-text-subtle)}
  .sp-chev{flex:none;color:var(--c-text-faint);font-size:15px;margin-top:1px}
  .sp-note{margin:12px 0 0;font-size:13px;color:var(--pp-gold-800)}
  .strength-panel.-done .sp-note{margin-top:0;color:var(--c-good-text)}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
  .stat-card{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-md);background:var(--c-surface)}
  .stat-card .n{font-size:26px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  .stat-card .l{font-size:13px;color:var(--c-text-subtle)}

  .section{margin-top:26px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .section-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.015em}

  .job-row{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-md);background:var(--c-surface);margin-bottom:10px;flex-wrap:wrap}
  .job-row .main{flex:1;min-width:200px}
  .job-row h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-0.012em}
  .job-row .meta{font-size:13.5px;color:var(--c-text-subtle)}

  .form-panel{padding:22px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface);margin-bottom:20px}
  .form-panel h3{margin:0 0 16px;font-size:17px;font-weight:700}
  .field-block{margin-bottom:16px}
  .field-block .pp-field-label{display:block;margin-bottom:7px}
  .field-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.field-row2{grid-template-columns:1fr}}
  .form-actions{display:flex;align-items:center;gap:12px;margin-top:16px}
  .fielderr{font-size:13px;color:var(--c-bad-text);margin-top:6px}
  .field-hint{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--c-text-subtle)}
  .save-note{font-size:13px;color:var(--c-good-text)}

  .photo-block{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .photo-block img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--c-border)}
  .divider-or{display:flex;align-items:center;gap:14px;margin:20px 0 14px}
  .divider-or span:not(.txt){flex:1;height:1px;background:var(--c-border)}
  .divider-or .txt{font-size:13px;color:var(--c-text-faint)}
  .avatar-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
  .avatar-option{position:relative;border:none;background:none;padding:0;cursor:pointer;border-radius:50%;overflow:hidden}
  .avatar-option img{width:100%;aspect-ratio:1;display:block;border-radius:50%;border:2px solid transparent}
  .avatar-option.-selected img{border-color:var(--pp-gold)}

  .chip-select{display:flex;flex-wrap:wrap;gap:7px}
  .pick-chip{padding:7px 13px;border-radius:999px;font-family:var(--pp-font);font-size:13.5px;font-weight:500;
    cursor:pointer;background:var(--c-surface-inset);color:var(--c-text-muted);border:1px solid transparent}
  .pick-chip.-active{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text)}

  .tag-box{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:50px;padding:8px 10px;
    border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .tag-box:focus-within{border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .tag-box input{border:none;outline:none;background:transparent;font-family:var(--pp-font);
    font-size:14.5px;flex:1;min-width:120px;color:var(--c-text)}
  .skill-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    background:var(--c-surface-inset);color:var(--c-text-muted);font-size:13px;font-weight:500}
  .skill-chip button{border:none;background:none;color:inherit;cursor:pointer;padding:0;display:inline-flex;opacity:.7}

  .avail-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--c-border-strong);
    border-radius:var(--pp-radius-md);cursor:pointer;margin-bottom:8px;background:var(--c-surface)}
  .avail-opt.-active{border-color:var(--pp-gold);background:var(--c-bg-sunken)}
  .avail-opt input{position:absolute;opacity:0;width:1px;height:1px}
  .avail-opt:focus-within{outline:var(--pp-focus-outline);outline-offset:var(--pp-focus-offset)}
  .avail-opt .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--c-border-strong)}
  .avail-opt.-active .dot{border-color:var(--pp-gold);background:var(--pp-gold)}

  .thread-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-lg);overflow:hidden;min-height:420px}
  @media(max-width:760px){.thread-layout{grid-template-columns:1fr}}
  .thread-list{border-right:1px solid var(--c-border);overflow-y:auto;max-height:560px}
  @media(max-width:760px){.thread-list{border-right:none;border-bottom:1px solid var(--c-border);max-height:220px}}
  .thread-item{display:block;width:100%;text-align:left;padding:14px 16px;border:none;border-bottom:1px solid var(--c-border);
    background:var(--c-surface);cursor:pointer;font-family:var(--pp-font);color:var(--c-text)}
  .thread-item.-active{background:var(--c-bg-sunken)}
  .thread-item .name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .thread-item .preview{font-size:13px;color:var(--c-text-subtle);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pp-gold);flex:none}
  .thread-body{display:flex;flex-direction:column;background:var(--c-bg)}
  .thread-messages{flex:1;padding:18px;overflow-y:auto;max-height:460px;display:flex;flex-direction:column;gap:10px}
  .msg-row{display:flex;flex-direction:column;max-width:70%}
  .msg-row.-me{align-self:flex-end;align-items:flex-end}
  .msg-row.-them{align-self:flex-start;align-items:flex-start}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5}
  .msg-row.-me .msg-bubble{background:var(--c-text);color:var(--c-bg);border-bottom-right-radius:4px}
  .msg-row.-them .msg-bubble{background:var(--c-surface-inset);color:var(--c-text);border-bottom-left-radius:4px}
  .msg-report-btn{margin-top:3px;border:none;background:transparent;font-family:var(--pp-font);
    font-size:11.5px;color:var(--c-text-faint);cursor:pointer;padding:2px 4px}
  .msg-report-btn:hover{color:var(--c-bad-text)}
  .msg-report-box{margin-top:6px;padding:10px;border-radius:var(--pp-radius-md);background:var(--c-bg-sunken);
    border:1px solid var(--c-border);display:flex;flex-direction:column;gap:8px;width:220px}
  .msg-report-box textarea{width:100%;box-sizing:border-box;font-family:var(--pp-font);font-size:13px;
    border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-sm);padding:6px 8px;background:var(--c-surface);color:var(--c-text)}
  .msg-report-box .row{display:flex;gap:6px;justify-content:flex-end}
  .thread-composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--c-border)}
  .thread-composer input{flex:1;height:44px;padding:0 14px;border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-md);
    background:var(--c-surface);font-family:var(--pp-font);font-size:14.5px;color:var(--c-text)}
  .thread-composer input:focus{outline:none;border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}

  .state-panel{padding:48px 16px;text-align:center;color:var(--c-text-subtle);font-size:14.5px}
  .danger-block{padding:20px;border:1px solid var(--c-bad-border);border-radius:var(--pp-radius-md);background:var(--c-bad-bg)}
  .danger-block h3{margin:0 0 6px;font-size:15.5px;color:var(--c-bad-text)}
  .danger-block p{margin:0 0 14px;font-size:13.5px;color:var(--c-bad-text)}
</style>
</head>
<body>

<div id="pp-nav" data-shell="focused"></div>

<main>
  <div class="wrap dash-layout">
    <aside class="dash-rail" id="dashRail"></aside>
    <div class="dash-main">
      <div class="dash-chips-mobile" id="dashChipsMobile"></div>
      <div id="content"><div class="state-panel">Loading…</div></div>
    </div>
  </div>
</main>

<div id="pp-footer" data-variant="legal"></div>

<script src="pp-nav.js"></script>
<script src="pp-footer.js"></script>
<script src="pp-elig.js"></script>
<script src="pp-confirm.js"></script>
<script>
(function(){
  "use strict";

  var token = localStorage.getItem("kazi_designer_token");
  if (!token) { location.href = "/signin?view=signin"; return; }

  var DISCIPLINES = ["Product Design","UX Design","UI Design","Brand Design","Motion Design","Design Systems","UX Research","Graphic Design","Game Design","Sound Design","Instructional Design","Fashion Design","Interior Design"];
  var MAX_DISCIPLINES = 5;
  var MAX_SKILLS = 7;
  var AVATAR_COUNT = 28;
  var DEFAULT_AVATAR = "/avatars/avatar-1.png";
  var AVAILABILITY = ["Available", "Open to offers", "Not available"];
  var RAIL_ICONS = {
    overview: '<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/>',
    saved: '<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
    messages: '<path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/>',
    analytics: '<rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/>',
    profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
    availability: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    account: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>'
  };
  var SECTIONS = [
    { key: "overview", label: "Overview" }, { key: "saved", label: "Saved roles" },
    { key: "messages", label: "Messages" }, { key: "analytics", label: "Analytics" },
    { key: "profile", label: "Profile" }, { key: "availability", label: "Availability" },
    { key: "account", label: "Account" }
  ];

  var me = null;
  var section = "overview";
  var selectedDisciplines = [], selectedSkills = [];
  var activeThreadId = null;
  var cache = { saved: [], matches: [], stats: null, conversations: [], messages: [] };

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "Authorization": "Bearer " + token });
    var res = await fetch(path, opts);
    if (res.status === 401) { localStorage.removeItem("kazi_designer_token"); location.href = "/signin?view=signin"; throw new Error("signed out"); }
    if (!res.ok) {
      var body = await res.json().catch(function(){ return {}; });
      throw new Error((body.detail && typeof body.detail === "string") ? body.detail : "Request failed (" + res.status + ")");
    }
    return res.json();
  }

  function toast(msg){
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;background:var(--c-text);color:var(--c-bg);font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.2)";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2600);
  }

  function railIcon(key){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + RAIL_ICONS[key] + '</svg>';
  }

  // 248px labelled rail (desktop) / 68px icon-only rail (tablet landscape,
  // both via CSS on the same markup) — the primary nav at >=1024px, with
  // Sign out pinned at the bottom per the design's dashboard rail spec.
  function railHtml(){
    return SECTIONS.map(function(s){
      return '<button type="button" class="dash-rail-item' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '" title="' + s.label + '">' +
        railIcon(s.key) + '<span class="dash-rail-label">' + s.label + '</span></button>';
    }).join("") +
    '<div class="dash-rail-spacer"></div>' +
    '<button type="button" class="dash-rail-item dash-rail-signout" data-rail-signout title="Sign out">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' +
      '<span class="dash-rail-label">Sign out</span></button>';
  }

  // Same section switch as a horizontally scrolling chip row, replacing
  // the rail below 1024px per the design's tablet-portrait/mobile pattern.
  function chipsMobileHtml(){
    return '<div class="pp-tabs-scroll">' +
      SECTIONS.map(function(s){
        return '<button type="button" class="pp-tab-chip' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '">' + s.label + '</button>';
      }).join("") +
      '<button type="button" class="pp-tab-chip" data-rail-signout>Sign out</button>' +
    '</div>';
  }

  // Wording lives in pp-elig.js, shared with the board and job pages.
  function eligBadge(elig, scope){ return PPElig.badge(elig, scope || "", PPElig.getViewerCountry()); }

  // ---------------- Overview ----------------

  /* What a complete profile actually buys you, in the order it pays off.
     Onboarding has a percentage meter but it disappears the moment setup ends,
     which is exactly backwards: the people most likely to have a thin profile
     are the ones who skipped ahead. This one lives where they come back to,
     and names the consequence rather than a score — "employers filter by
     discipline" is a reason to act; "60%" is a number. */
  function profileChecklist(){
    var projects = (cache.projects || me.projects || []).length;
    return [
      { done: !!(me.discipline || []).length, label: "Add your discipline",
        why: "Employers filter the directory by discipline. Without one you aren't in those results.",
        to: "profile" },
      { done: !!me.country, label: "Set the country you work from",
        why: "Lets the board hide roles that would turn you down before you read them.",
        to: "profile" },
      { done: !!(me.headline || "").trim(), label: "Write a headline",
        why: "It's the line under your name everywhere you appear.",
        to: "profile" },
      { done: projects > 0, label: "Publish a project",
        why: "Your work shows on your profile, and recent work reaches the homepage.",
        to: "profile" },
      { done: !!(me.bio || "").trim(), label: "Add a short bio",
        why: "Two sentences is plenty. It's what makes a card worth clicking.",
        to: "profile" },
      { done: !!(me.skills || []).length, label: "List a few skills",
        why: "Employers search on these when they know what they need.",
        to: "profile" }
    ];
  }

  function strengthPanelHtml(){
    var items = profileChecklist();
    var done = items.filter(function(i){ return i.done; }).length;
    var pct = Math.round((done / items.length) * 100);
    if (done === items.length) {
      return '<div class="strength-panel -done">' +
        '<div class="sp-head"><h3>Your profile is complete</h3><span class="sp-pct">100%</span></div>' +
        '<div class="sp-bar"><span style="width:100%"></span></div>' +
        '<p class="sp-note">You show up everywhere employers look. Keep your work current and it stays that way.</p>' +
      '</div>';
    }
    var next = items.filter(function(i){ return !i.done; });
    return '<div class="strength-panel">' +
      '<div class="sp-head"><h3>Finish your profile so employers can find you</h3><span class="sp-pct">' + pct + '%</span></div>' +
      '<div class="sp-bar"><span style="width:' + pct + '%"></span></div>' +
      '<ul class="sp-list">' + next.map(function(i){
        return '<li><button type="button" class="sp-item" data-goto="' + i.to + '">' +
          '<span class="sp-mark" aria-hidden="true"></span>' +
          '<span class="sp-text"><span class="sp-label">' + i.label + '</span>' +
          '<span class="sp-why">' + i.why + '</span></span>' +
          '<span class="sp-chev" aria-hidden="true">→</span></button></li>';
      }).join("") + '</ul>' +
      (done ? '<p class="sp-note">' + done + ' of ' + items.length + ' done.</p>' : "") +
    '</div>';
  }

  function renderOverview(){
    // The API matches on discipline alone. Recommending a role that would turn
    // you down is the same failure the board just stopped making, so anything
    // closed to your country is dropped here too — including from the count,
    // which would otherwise promise more than the list below delivers.
    var country = PPElig.getViewerCountry();
    var all = cache.matches || [];
    var open = country
      ? all.filter(function(j){ return PPElig.openTo(j.elig, j.elig_scope || "", country) !== false; })
      : all;

    var body = strengthPanelHtml() +
      '<div class="stat-row">' +
        '<div class="stat-card"><div class="n">' + (cache.stats ? cache.stats.profile_views : "—") + '</div><div class="l">Profile views, last 90 days</div></div>' +
        '<div class="stat-card"><div class="n">' + cache.saved.length + '</div><div class="l">Saved roles</div></div>' +
        '<div class="stat-card"><div class="n">' + open.length + '</div><div class="l">' +
          (country ? "Matching roles open to you" : "Roles matching your disciplines") + '</div></div>' +
      '</div>';
    // Only for people who never reached the end of setup — anyone who did gets
    // the checklist above instead, which says the same thing more usefully.
    if (!me.onboarding_completed) {
      body += '<div class="form-panel"><h3>Finish setting up</h3><p style="margin:0 0 14px;font-size:14px;color:var(--c-text-subtle)">You stopped partway through. Picking up where you left off takes a couple of minutes.</p><a href="/onboarding" class="pp-btn pp-btn-primary">Continue setup</a></div>';
    }

    body += '<div class="section"><div class="section-head"><h2>Roles that match you</h2><a href="/jobs" style="font-size:13.5px;font-weight:600;color:var(--c-accent-text);text-decoration:none">See all roles</a></div>';
    if (!all.length) {
      body += '<div class="pp-empty"><h3>No matches yet</h3><p>Add a discipline in Profile and roles that fit will show up here.</p></div>';
    } else if (!open.length) {
      body += '<div class="pp-empty"><h3>Nothing open to you this week</h3><p>' + all.length +
        ' role' + (all.length === 1 ? "" : "s") + ' matched your disciplines, but none can hire from ' +
        escapeHtml(country) + ' right now. We\'ll keep looking.</p>' +
        '<a class="pp-btn pp-btn-secondary" href="/jobs">Browse the whole board</a></div>';
    } else {
      open.slice(0, 5).forEach(function(j){
        body += '<a class="job-row" href="/jobs/' + encodeURIComponent(j.id) + '" style="text-decoration:none;color:inherit">' +
          '<div class="main"><h3>' + escapeHtml(j.t) + '</h3><div class="meta">' + escapeHtml(j.co) + ' · ' + escapeHtml(j.city || "Remote") + '</div></div>' +
          eligBadge(j.elig, j.elig_scope) +
        '</a>';
      });
    }
    body += '</div>';
    return body;
  }

          (j.url ? '<a class="pp-btn pp-btn-tertiary pp-btn-sm" href="/jobs/' + encodeURIComponent(j.job_id) + '">View</a>' : "") +

  // ---------------- Messages ----------------

  function renderMessages(){
    var body = '<div class="section-head"><h2>Messages</h2></div>';
    if (!cache.conversations.length) {
      body += '<div class="pp-empty"><h3>No conversations yet</h3><p>Message a company from their page and the thread shows up here.</p></div>';
      return body;
    }
    if (!activeThreadId) activeThreadId = cache.conversations[0].id;
    var active = cache.conversations.filter(function(c){ return c.id === activeThreadId; })[0] || cache.conversations[0];
    body += '<div class="thread-layout">' +
      '<div class="thread-list">' + cache.conversations.map(function(c){
        return '<button type="button" class="thread-item' + (c.id === active.id ? " -active" : "") + '" data-thread="' + c.id + '">' +
          '<span class="name">' + (c.unread_count ? '<span class="unread-dot"></span>' : "") + escapeHtml(c.company_name) + '</span>' +
          '<span class="preview">' + escapeHtml(c.last_message ? c.last_message.body : "") + '</span>' +
        '</button>';
      }).join("") + '</div>' +
      '<div class="thread-body">' +
        '<div class="thread-messages" id="threadMessages"><p style="color:var(--c-text-faint);font-size:13.5px">Loading…</p></div>' +
        '<form class="thread-composer" id="composerForm"><input id="composerInput" placeholder="Write a reply…" autocomplete="off"><button type="submit" class="pp-btn pp-btn-primary">Send</button></form>' +

  function renderThreadMessages(){
    var el = document.getElementById("threadMessages");
    if (!el) return;
    if (!cache.messages.length) { el.innerHTML = '<p style="color:var(--c-text-faint);font-size:13.5px">Say hello.</p>'; return; }
    el.innerHTML = cache.messages.map(function(m){
      var mine = m.sender_type === "designer";
      return '<div class="msg-row ' + (mine ? "-me" : "-them") + '">' +
        '<div class="msg-bubble">' + escapeHtml(m.body) + '</div>' +
        (mine ? "" : '<button type="button" class="msg-report-btn" data-report-msg="' + m.id + '">Report</button>' +
          '<div class="msg-report-box" data-report-box-msg="' + m.id + '" style="display:none"></div>') +
      '</div>';
    }).join("");
    el.scrollTop = el.scrollHeight;
    wireMessageReportButtons();
  }

  var MSG_REPORT_BOX_HTML =
    '<textarea rows="2" placeholder="Why report this? (optional)"></textarea>' +
    '<div class="row"><button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm report-cancel">Cancel</button>' +
    '<button type="button" class="pp-btn pp-btn-danger pp-btn-sm report-send">Send</button></div>';

  function wireMessageReportButtons(){
    document.querySelectorAll("[data-report-msg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-report-msg");
        var box = document.querySelector('[data-report-box-msg="' + id + '"]');
        if (box.style.display !== "none") { box.style.display = "none"; return; }
        box.innerHTML = MSG_REPORT_BOX_HTML;
        box.style.display = "flex";
        box.querySelector(".report-cancel").addEventListener("click", function(){ box.style.display = "none"; });
        box.querySelector(".report-send").addEventListener("click", async function(){
          var sendBtn = box.querySelector(".report-send");
          sendBtn.disabled = true;
          try {
            await api("/api/designers/me/conversations/" + activeThreadId + "/messages/" + id + "/report", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ summary: box.querySelector("textarea").value.trim() })
            });
            box.style.display = "none";
            toast("Report sent — a person will review it.");
          } catch (e) {}
          sendBtn.disabled = false;
        });
      });
    });
  }

  async function loadThread(id){
    activeThreadId = id;
    var data = await api("/api/designers/me/conversations/" + id + "/messages");
    cache.messages = data.messages;
    renderThreadMessages();
    var convData = await api("/api/designers/me/conversations");
    cache.conversations = convData.conversations;
  }

  // ---------------- Analytics ----------------

  function renderAnalytics(){
    return '<div class="section-head"><h2>Analytics</h2></div>' +
      '<div class="stat-row"><div class="stat-card"><div class="n">' + (cache.stats ? cache.stats.profile_views : "—") + '</div><div class="l">Profile views, last 90 days</div></div></div>' +
      '<p style="font-size:13.5px;color:var(--c-text-subtle);max-width:60ch">This counts visits to your public profile page. We don\'t track or show who looked — just how many.</p>';
  }

  // ---------------- Profile ----------------

  function renderProfile(){
    var current = me.photo_path || DEFAULT_AVATAR;
    var avatarOpts = "";
    for (var n = 1; n <= AVATAR_COUNT; n++) {
      var path = "/avatars/avatar-" + n + ".png";
      avatarOpts += '<button type="button" class="avatar-option' + (path === current ? " -selected" : "") + '" data-avatar="' + path + '"><img src="' + path + '" alt=""></button>';

        '<div><button type="button" class="pp-btn pp-btn-secondary pp-btn-sm" id="photoUploadBtn">Upload a photo</button>' +
        '<input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.webp" style="display:none"></div></div>' +
      '<div class="divider-or"><span></span><span class="txt">or pick an avatar</span><span></span></div>' +
      '<div class="avatar-grid" style="margin-bottom:20px">' + avatarOpts + '</div>' +
      '<div class="field-block"><label class="pp-field-label">Name</label><div class="pp-field-input"><input id="pName" value="' + escapeHtml(me.display_name || "") + '"></div></div>' +
      '<div class="field-block"><label class="pp-field-label">Headline</label><div class="pp-field-input"><input id="pHeadline" value="' + escapeHtml(me.headline || "") + '" placeholder="e.g. Product Designer"></div></div>' +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Location</label><div class="pp-field-input"><input id="pLocation" value="' + escapeHtml(me.location || "") + '" placeholder="e.g. Nairobi"></div></div>' +
        '<div class="field-block"><label class="pp-field-label" for="pCountry">Country you can work from</label>' +
          '<div class="pp-field-input"><select id="pCountry"></select></div>' +
          '<p class="field-hint">What we check listings against, so the board can hide roles that would turn you down.</p></div>' +
      '</div>' +
      '<div class="field-block"><label class="pp-field-label">Years of experience</label><div class="pp-field-input"><input id="pYears" value="' + escapeHtml(me.years_experience || "") + '"></div></div>' +
      '<div class="field-block"><label class="pp-field-label">Bio</label><textarea id="pBio" class="pp-textarea" rows="3">' + escapeHtml(me.bio || "") + '</textarea></div>' +
      '<div class="field-block"><label class="pp-field-label">Discipline (up to ' + MAX_DISCIPLINES + ')</label><div class="chip-select" id="disciplineChips"></div></div>' +
      '<div class="field-block"><label class="pp-field-label">Skills (up to ' + MAX_SKILLS + ')</label><div class="tag-box" id="skillBox"><input id="skillInput" placeholder="Type a skill and press Enter"></div></div>' +
      '<div class="fielderr" id="profileErr" hidden></div>' +
      '<div class="form-actions"><button type="submit" class="pp-btn pp-btn-primary" id="profileSubmitBtn">Save changes</button><span class="save-note" id="profileSaveNote" hidden>Saved.</span></div>' +
    '</form></div>';
    return body;
  }

  // Options come from /api/countries rather than being duplicated here, so the
  // list can't drift from what the profile endpoint will accept. Africa is
  // grouped first because that's who the board is for.
  async function fillCountrySelect(current){
    var sel = document.getElementById("pCountry");
    if (!sel) return;
    sel.innerHTML = '<option value="">Select a country</option>';
    try {
      var res = await fetch("/api/countries");
      if (!res.ok) return;
      var data = await res.json();
      [["Africa", data.african], ["Elsewhere", data.other]].forEach(function(pair){
        var g = document.createElement("optgroup");
        g.label = pair[0];
        pair[1].forEach(function(c){
          var o = document.createElement("option");
          o.value = c; o.textContent = c;
          if (c === current) o.selected = true;
          g.appendChild(o);
        });
        sel.appendChild(g);
      });
    } catch (e) {}
  }

  function renderDisciplineChips(){
    var box = document.getElementById("disciplineChips");
    if (!box) return;
    var atCap = selectedDisciplines.length >= MAX_DISCIPLINES;
    box.innerHTML = DISCIPLINES.map(function(d){
      var active = selectedDisciplines.indexOf(d) !== -1;
      return '<button type="button" class="pick-chip' + (active ? " -active" : "") + '"' + (!active && atCap ? " disabled" : "") + ' data-d="' + escapeHtml(d) + '">' + escapeHtml(d) + '</button>';
    }).join("");
    box.querySelectorAll("[data-d]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d = btn.getAttribute("data-d");
        var idx = selectedDisciplines.indexOf(d);
        if (idx !== -1) selectedDisciplines.splice(idx, 1);
        else if (selectedDisciplines.length < MAX_DISCIPLINES) selectedDisciplines.push(d);
        renderDisciplineChips();
      });
    });
  }

  function renderSkillChips(){
    var box = document.getElementById("skillBox");
    if (!box) return;
    var input = document.getElementById("skillInput");
    box.querySelectorAll(".skill-chip").forEach(function(el){ el.remove(); });
    selectedSkills.forEach(function(s){
      var chip = document.createElement("span");
      chip.className = "skill-chip";
      chip.innerHTML = escapeHtml(s) + '<button type="button" data-s="' + escapeHtml(s) + '">&times;</button>';
      box.insertBefore(chip, input);
    });
    box.querySelectorAll(".skill-chip button").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedSkills = selectedSkills.filter(function(s){ return s !== btn.getAttribute("data-s"); });
        renderSkillChips();
      });
    });
  }

  // ---------------- Availability ----------------

  function renderAvailability(){
    var current = me.availability_status || "";
    var openTo = me.open_to || [];
    var body = '<div class="section-head"><h2>Availability</h2></div>';
    body += '<div class="form-panel"><form id="availForm">' +
      '<h3>Are you looking?</h3>' +
      AVAILABILITY.map(function(a){
        return '<label class="avail-opt' + (current === a ? " -active" : "") + '"><span class="dot"></span><input type="radio" name="avail" value="' + a + '"' + (current === a ? " checked" : "") + '><span>' + a + '</span></label>';
      }).join("") +
      // Separate question: an employer needs to tell a staff hire from a
      // freelancer, and "Available" alone never said which.
      '<h3 style="margin-top:22px">What kind of work?</h3>' +
      '<p class="field-hint" style="margin:0 0 10px">Shown on your profile and used when employers filter the directory. Pick as many as fit.</p>' +
      '<div class="chip-select" id="openToChips"></div>' +
      '<div class="form-actions" style="margin-top:16px"><button type="submit" class="pp-btn pp-btn-primary" id="availSubmitBtn">Save</button><span class="save-note" id="availSaveNote" hidden>Saved.</span></div>' +
    '</form></div>';
    return body;
  }

  var OPEN_TO = ["Full-time", "Contract", "Freelance", "Internship"];
  var selectedOpenTo = [];
  function renderOpenToChips(){
    var box = document.getElementById("openToChips");
    if (!box) return;
    box.innerHTML = OPEN_TO.map(function(o){
      var on = selectedOpenTo.indexOf(o) !== -1;
      return '<button type="button" class="pick-chip' + (on ? " -active" : "") + '" data-open="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>';
    }).join("");
    box.querySelectorAll("[data-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var o = btn.getAttribute("data-open");
        var i = selectedOpenTo.indexOf(o);
        if (i !== -1) selectedOpenTo.splice(i, 1); else selectedOpenTo.push(o);
        renderOpenToChips();
      });
    });
  }

  // ---------------- Account ----------------

  function renderAccount(){
    var body = '<div class="section-head"><h2>Account</h2></div>';
    body += '<div class="form-panel"><h3>Sign-in email</h3><p style="margin:0 0 4px;font-size:14.5px">' + escapeHtml(me.email) + '</p>' +
      '<p style="margin:0;font-size:13px;color:var(--c-text-subtle)">' + (me.email_verified ? "Verified." : "Not verified yet.") + '</p></div>';
    body += '<div class="form-panel"><h3>Password</h3><a class="pp-btn pp-btn-secondary" href="/signin?view=reset">Reset your password</a></div>';
    body += '<div class="form-panel"><h3>Résumé</h3>' +
      (me.resume_filename ? '<p style="margin:0 0 10px;font-size:14.5px">' + escapeHtml(me.resume_filename) + '</p>' : '<p style="margin:0 0 10px;font-size:14.5px;color:var(--c-text-subtle)">No résumé uploaded.</p>') +
      '<button type="button" class="pp-btn pp-btn-secondary pp-btn-sm" id="resumeUploadBtn">Upload résumé</button>' +
      '<input type="file" id="resumeInput" accept=".pdf,.doc,.docx" style="display:none"></div>';
    body += '<div class="danger-block"><h3>Close your account</h3><p>Removes your profile, projects, saved roles and messages. This can\'t be undone.</p>' +
      '<button type="button" class="pp-btn pp-btn-danger" id="deleteAccountBtn">Close account</button></div>';
    return body;
  }

  // ---------------- Render + wire ----------------

  function render(){
    var content = document.getElementById("content");
    var head = '<div class="dash-head"><h1>' + escapeHtml(me.display_name) + '</h1><p>Your designer dashboard</p></div>';
    var body = "";
    if (section === "overview") body = renderOverview();
    else if (section === "saved") body = renderSaved();
    else if (section === "messages") body = renderMessages();
    else if (section === "analytics") body = renderAnalytics();
    else if (section === "profile") body = renderProfile();
    else if (section === "availability") body = renderAvailability();
    else body = renderAccount();
    content.innerHTML = head + body;
    document.getElementById("dashRail").innerHTML = railHtml();
    document.getElementById("dashChipsMobile").innerHTML = chipsMobileHtml();
    if (section === "availability") { selectedOpenTo = (me.open_to || []).slice(); renderOpenToChips(); }
    if (section === "profile") { selectedDisciplines = (me.discipline || []).slice(); selectedSkills = (me.skills || []).slice(); renderDisciplineChips(); renderSkillChips(); fillCountrySelect(me.country || ""); }
    wire();
    if (section === "messages" && cache.conversations.length) loadThread(activeThreadId || cache.conversations[0].id);
  }

  function setSection(s){ section = s; loadSection(); }

  async function loadSection(){
    if (section === "overview" || section === "saved") {
      var savedData = await api("/api/designers/me/saved-jobs");
      cache.saved = savedData.jobs;
    }
    if (section === "overview") {
      var matchData = await api("/api/designers/me/matches");
      cache.matches = matchData.jobs;
      cache.stats = await api("/api/designers/me/stats");
    }
    if (section === "analytics") cache.stats = await api("/api/designers/me/stats");
    if (section === "messages") {
      var convData = await api("/api/designers/me/conversations");
      cache.conversations = convData.conversations;
    }
    render();
  }

  function showErr(id, msg){
    var el = document.getElementById(id);
    if (!el) return;
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function wire(){
    document.querySelectorAll("[data-section]").forEach(function(btn){
      btn.addEventListener("click", function(){ setSection(btn.getAttribute("data-section")); });
    });
    document.querySelectorAll("[data-rail-signout]").forEach(function(btn){
      btn.addEventListener("click", function(){ window.PathPixelNav.signOut("designer"); });
    });
    document.querySelectorAll("[data-goto]").forEach(function(btn){
      btn.addEventListener("click", function(){ setSection(btn.getAttribute("data-goto")); });
    });

    // Saved
    document.querySelectorAll("[data-unsave]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        await api("/api/designers/me/saved-jobs/" + encodeURIComponent(btn.getAttribute("data-unsave")), { method: "DELETE" });
        loadSection();
      });
    });

    // Messages
    document.querySelectorAll("[data-thread]").forEach(function(btn){
      btn.addEventListener("click", function(){ loadThread(parseInt(btn.getAttribute("data-thread"), 10)).then(render); });
    });
    var composerForm = document.getElementById("composerForm");
    if (composerForm) composerForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var input = document.getElementById("composerInput");
      var body = input.value.trim();
      if (!body) return;
      input.value = "";
      await api("/api/designers/me/conversations/" + activeThreadId + "/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body: body }) });
      // Full render, not just the message pane — the thread list's preview
      // text and unread dot need the refreshed cache.conversations too.
      await loadThread(activeThreadId);
      render();
    });

    // Profile
    var skillInput = document.getElementById("skillInput");
    if (skillInput) skillInput.addEventListener("keydown", function(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      var v = skillInput.value.trim();
      if (v && selectedSkills.length < MAX_SKILLS && selectedSkills.indexOf(v) === -1) { selectedSkills.push(v); skillInput.value = ""; renderSkillChips(); }
    });
    var photoUploadBtn = document.getElementById("photoUploadBtn");
    var photoInput = document.getElementById("photoInput");
    if (photoUploadBtn) photoUploadBtn.addEventListener("click", function(){ photoInput.click(); });
    if (photoInput) photoInput.addEventListener("change", async function(){
      if (!photoInput.files[0]) return;
      var fd = new FormData();
      fd.append("file", photoInput.files[0]);
      try {
        var data = await api("/api/designers/me/photo", { method: "POST", body: fd });
        document.getElementById("photoPreview").src = data.photo_path;
        me.photo_path = data.photo_path;
      } catch (err) { toast(err.message); }
    });
    document.querySelectorAll("[data-avatar]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var path = btn.getAttribute("data-avatar");
        await api("/api/designers/me/avatar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ photo_path: path }) });
        me.photo_path = path;
        // Update in place rather than a full render() — this tab may have
        // unsaved discipline/skill picks sitting in selectedDisciplines/
        // selectedSkills, and a render() re-seeds those from me.discipline/
        // me.skills (still the pre-save values), silently discarding
        // whatever the person had just clicked before saving.
        document.getElementById("photoPreview").src = path;
        document.querySelectorAll("[data-avatar]").forEach(function(b){ b.classList.toggle("-selected", b === btn); });
      });
    });
    var profileForm = document.getElementById("profileForm");
    if (profileForm) profileForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("profileErr", "");
      var payload = {
        display_name: document.getElementById("pName").value.trim(),
        headline: document.getElementById("pHeadline").value.trim(),
        location: document.getElementById("pLocation").value.trim(),
        country: document.getElementById("pCountry").value,
        open_to: me.open_to || [],
        years_experience: document.getElementById("pYears").value.trim(),
        bio: document.getElementById("pBio").value.trim(),
        discipline: selectedDisciplines, skills: selectedSkills,
        availability_status: me.availability_status || "", phone: me.phone || "", contact_email: me.contact_email || ""
      };
      var btn = document.getElementById("profileSubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/designers/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        me = await api("/api/designers/me");
        document.getElementById("profileSaveNote").hidden = false;
        setTimeout(function(){ var n = document.getElementById("profileSaveNote"); if (n) n.hidden = true; }, 2000);
      } catch (err) { showErr("profileErr", err.message); }
      btn.disabled = false;
    });

    // Availability
    document.querySelectorAll(".avail-opt").forEach(function(label){
      label.addEventListener("click", function(){
        document.querySelectorAll(".avail-opt").forEach(function(l){ l.classList.remove("-active"); });
        label.classList.add("-active");
        label.querySelector("input").checked = true;
      });
    });
    var availForm = document.getElementById("availForm");
    if (availForm) availForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var picked = availForm.querySelector('input[name="avail"]:checked');
      var payload = {
        display_name: me.display_name, bio: me.bio || "", discipline: me.discipline || [], skills: me.skills || [],
        location: me.location || "", country: me.country || "",
        phone: me.phone || "", contact_email: me.contact_email || "",
        headline: me.headline || "", years_experience: me.years_experience || "",
        open_to: selectedOpenTo.slice(),
        availability_status: picked ? picked.value : ""
      };
      await api("/api/designers/me", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      me = await api("/api/designers/me");
      document.getElementById("availSaveNote").hidden = false;
      setTimeout(function(){ var n = document.getElementById("availSaveNote"); if (n) n.hidden = true; }, 2000);
    });

    // Account
    var resumeUploadBtn = document.getElementById("resumeUploadBtn");
    var resumeInput = document.getElementById("resumeInput");
    if (resumeUploadBtn) resumeUploadBtn.addEventListener("click", function(){ resumeInput.click(); });
    if (resumeInput) resumeInput.addEventListener("change", async function(){
      if (!resumeInput.files[0]) return;
      var fd = new FormData();
      fd.append("file", resumeInput.files[0]);
      try {
        await api("/api/designers/me/resume", { method: "POST", body: fd });
        me = await api("/api/designers/me");
        toast("Résumé uploaded.");
        render();
      } catch (err) { toast(err.message); }
    });
    var deleteAccountBtn = document.getElementById("deleteAccountBtn");
    if (deleteAccountBtn) deleteAccountBtn.addEventListener("click", async function(){
      var ok = await window.showPPConfirm({
        title: "Close your account?", description: "Your profile, projects, saved roles and messages are all removed. This can't be undone.",
        confirmLabel: "Close account", safeLabel: "Keep my account", danger: true
      });
      if (!ok) return;
      await api("/api/designers/me", { method: "DELETE" });
      localStorage.removeItem("kazi_designer_token");
      location.href = "/";
    });
  }

  async function init(){
    try { me = await api("/api/designers/me"); } catch (e) { return; }
    // Same reading of eligibility as the board — a matched role shouldn't say
    // "Open in Nigeria" here and "Open to you" two clicks away.
    if (me && me.country) PPElig.setViewerCountry(me.country);
    await loadSection();
  }

  init();
})();
</script>
</body>
</html>
