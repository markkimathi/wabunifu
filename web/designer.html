<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designer profile · Kazi</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/theme.js?v=6"></script>
<script src="/nav.js?v=10"></script>
<script src="/confirm-dialog.js?v=1"></script>
<style>
  @font-face{font-family:Grift;src:url("fonts/grift/Grift-Regular.woff2") format("woff2"),url("fonts/grift/Grift-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("fonts/grift/Grift-Medium.woff2") format("woff2"),url("fonts/grift/Grift-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("fonts/grift/Grift-SemiBold.woff2") format("woff2"),url("fonts/grift/Grift-SemiBold.woff") format("woff");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("fonts/grift/Grift-Bold.woff2") format("woff2"),url("fonts/grift/Grift-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("fonts/grift/Grift-ExtraBold.woff2") format("woff2"),url("fonts/grift/Grift-ExtraBold.woff") format("woff");font-weight:800;font-style:normal;font-display:swap}

  :root{
    --canvas:#FFFFFF; --surface:#FFFFFF; --ink:#0B1623; --muted:#828282; --faint:#82828299;
    --hairline:#EEEEEE; --hairline-strong:#D2D0D0; --brand:#6D28A1; --brand-light:#AA52ED; --brand-soft:#F1E7FA;
    --green:#089111; --green-soft:#E1F5E3; --green-ink:#076C0D;
    --amber:#F25C05; --amber-soft:#FDE6D8;
    --shadow:0 1px 2px rgba(11,22,35,.04), 0 8px 24px -12px rgba(11,22,35,.10);
    --radius:16px; --ease-expo:cubic-bezier(.19,1,.22,1); --ease-io:cubic-bezier(.65,0,.35,1);
  }
  :root[data-theme="dark"]{
    --canvas:#0B1420; --surface:#121B29; --ink:#EDEFF2; --muted:#94A0AC; --faint:#94A0AC99;
    --hairline:#1E2937; --hairline-strong:#2B3947; --brand:#A868E8; --brand-light:#C79AF2; --brand-soft:#251A38;
    --green:#22B368; --green-soft:#12301D; --green-ink:#5FE3A0;
    --amber:#FF9B57; --amber-soft:#3A2412;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  #pageLoader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:var(--canvas);transition:opacity .35s var(--ease-io),visibility .35s var(--ease-io)}
  #pageLoader.-hide{opacity:0;visibility:hidden;pointer-events:none}
  #pageLoader .pl-spinner{width:32px;height:32px;border-radius:50%;
    border:3px solid var(--hairline-strong);border-top-color:var(--brand);
    animation:pl-spin .7s linear infinite}
  @keyframes pl-spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){#pageLoader .pl-spinner{animation:none}}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--canvas);color:var(--ink);font-family:"Grift",system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body > .wrap{flex:1}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hairline)}
  [data-theme="dark"] header.bar{background:rgba(11,20,32,.82)}
  .bar-inner{position:relative;display:flex;align-items:center;gap:20px;height:64px;max-width:1200px;margin:0 auto;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
  .logomark{height:20px;width:auto;flex:none;display:block}
  .bar-stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:7px 14px;
    font-variant-numeric:tabular-nums;box-shadow:var(--shadow);flex:none}
  .bar-stat b{color:var(--ink);font-weight:700}
  .bar-stat .livedot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:dotblink 2.6s ease-in-out infinite}
  @keyframes dotblink{0%,100%{opacity:1}50%{opacity:.25}}
  @media(max-width:1500px){
    .bar-stat .stattext{display:none}
    .bar-stat{padding:7px 10px}
  }
  .header-center{flex:1;min-width:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:18px}
  .bar-right{display:flex;align-items:center;gap:16px;flex:none;margin-left:auto}
  .nav-links{display:flex;align-items:center;gap:24px;white-space:nowrap}
  .nav-links a{font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;
    transition:color .3s var(--ease-expo)}
  .nav-links a:hover{color:var(--ink)}

  footer.foot{border-top:1px solid var(--hairline);padding:26px 0;color:var(--muted);font-size:13px;margin-top:auto}
  footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .foot-links{display:flex;gap:16px;flex-wrap:wrap}
  .foot-links a{color:var(--muted);text-decoration:none}
  .foot-links a:hover{color:var(--ink)}

  .menu-toggle{display:none;position:relative;flex:none;width:38px;height:38px;padding:0;
    border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
    cursor:pointer;color:var(--ink);
    transition:border-color .3s var(--ease-expo),color .3s var(--ease-expo)}
  .menu-toggle:hover{border-color:var(--brand);color:var(--brand)}
  .menu-toggle span{display:block;position:absolute;left:50%;top:50%;width:16px;height:2px;
    border-radius:2px;background:currentColor;transition:transform .4s var(--ease-io)}
  .menu-toggle span:first-child{transform:translate(-50%,-50%) translateY(-3px)}
  .menu-toggle span:last-child{transform:translate(-50%,-50%) translateY(3px)}
  .menu-toggle.-active span:first-child{transform:translate(-50%,-50%) rotate(45deg)}
  .menu-toggle.-active span:last-child{transform:translate(-50%,-50%) rotate(-45deg)}

  html.menu-open{overflow:hidden}
  .mobile-menu{position:fixed;inset:0;z-index:300;background:var(--canvas);
    padding:20px 22px 40px;overflow:auto;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease}
  .mobile-menu.-open{transform:translateX(0)}
  .mm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .mm-top h2{margin:0;font-size:16.5px;font-weight:800;color:var(--ink)}
  .mm-close{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;
    border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
    font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .mm-nav{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid var(--hairline);padding-top:6px}
  .mm-nav a{display:block;padding:14px 8px;margin:0 -8px;border-radius:8px;
    font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;
    transition:background .25s var(--ease-expo),color .25s var(--ease-expo)}
  .mm-nav a:hover{background:var(--hairline)}
  .mm-nav:not(.mm-account) a:not(.nav-cta){display:flex;align-items:center;border-bottom:1px solid var(--hairline)}
  .mm-nav:not(.mm-account) a:not(.nav-cta)::after{content:"";flex:none;width:7px;height:7px;margin-left:auto;
    border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg)}
  .mm-nav:not(.mm-account) a:not(.nav-cta):nth-child(-n+3){border-radius:0}
  .mm-nav:not(.mm-account) a:not(.nav-cta):nth-child(4){border-bottom:none}
  .mm-account{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .mm-nav button.mm-logout{display:block;width:100%;text-align:left;padding:14px 8px;margin:0 -8px;border-radius:8px;
    font-size:16px;font-weight:600;color:var(--ink);background:none;border:0;cursor:pointer;font:inherit;
    transition:background .25s var(--ease-expo),color .25s var(--ease-expo)}
  .mm-nav button.mm-logout:hover{background:var(--hairline)}
  .nav-links a.active,.mm-nav a.active{color:var(--brand);font-weight:600}
  .nav-links a.active::before,.mm-nav a.active::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:4px;vertical-align:middle}
  .nav-links a.nav-cta{background:var(--brand);color:#fff;padding:7px 16px;border-radius:999px;margin-left:10px;font-weight:700;transition:filter .3s var(--ease-expo)}
  .nav-links a.nav-cta:hover{filter:brightness(1.12);color:#fff}
  .mm-nav a.nav-cta{background:var(--brand);color:#fff;text-align:center;margin-top:10px;transition:filter .25s var(--ease-expo)}
  .mm-nav a.mm-cta-outline{border:1px solid var(--hairline-strong);text-align:center}
  .mm-nav a.mm-cta-outline:hover{border-color:var(--brand)}
  .mm-nav a.nav-cta:hover{filter:brightness(1.12);background:var(--brand);color:#fff}

  @media(max-width:860px){
    body{font-size:15px}
  }
  @media(max-width:600px){
    body{font-size:14px}
  }
  @media(max-width:860px){
    .bar-inner{gap:10px}
    .bar-stat{padding:6px 10px;font-size:12px;gap:5px}
    .bar-stat .stattext{display:none}
    .nav-links{gap:14px}
    .nav-links a{font-size:12.5px;white-space:nowrap}
  }
  /* Centered nav needs real room on either side for the brand and the
     right-side icon cluster (theme toggle + account chip) — below this
     it starts colliding with them, so hand off to the hamburger sooner
     than the plain "mobile" breakpoint above. */
  @media(max-width:767px),(orientation:portrait) and (max-width:1400px){
    .header-center{display:none}
    .menu-toggle{display:block}
  }
  /* Tablet portrait: put the hamburger at the far right edge, past
     "Create an account", instead of between the icons and it. */
  @media(orientation:portrait) and (max-width:1400px){
    .acct-cta{order:1}
    .acct-menu{order:1}
    .menu-toggle{order:2}
  }

  .acct-menu{position:relative;flex:none;display:none}
  .acct-menu.-visible{display:block}
  .acct-trigger{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 6px;
    border-radius:999px;border:1px solid var(--hairline-strong);background:var(--surface);
    cursor:pointer;color:var(--ink);font:inherit;font-size:13px;font-weight:600;
    transition:border-color .3s var(--ease-expo)}
  .acct-trigger:hover{border-color:var(--brand)}
  .acct-cta{display:flex;align-items:center;height:38px;padding:0 16px;flex:none;
    border-radius:999px;border:1px solid var(--hairline-strong);background:var(--surface);
    color:var(--ink);font:inherit;font-size:13px;font-weight:600;text-decoration:none;
    transition:border-color .3s var(--ease-expo)}
  .acct-cta:hover{border-color:var(--brand)}
  .acct-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--hairline)}
  .acct-caret{flex:none;color:var(--muted);transition:transform .25s var(--ease-expo)}
  .acct-menu.-open .acct-caret{transform:rotate(180deg)}
  .acct-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:160px;z-index:60;
    background:var(--surface);border:1px solid var(--hairline-strong);border-radius:12px;
    box-shadow:var(--shadow);padding:6px;display:none;flex-direction:column;gap:2px}
  .acct-menu.-open .acct-dropdown{display:flex}
  .acct-dropdown a,.acct-dropdown button{display:block;width:100%;text-align:left;
    padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--ink);
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .acct-dropdown a:hover,.acct-dropdown button:hover{background:var(--hairline)}
  @media(max-width:600px){
    .acct-menu{display:none!important}
    .acct-cta{display:none!important}
  }

  .theme-toggle{position:relative;flex:none;width:36px;height:36px;padding:0;border-radius:50%;
    background:var(--surface);border:1px solid var(--hairline-strong);cursor:pointer;
    display:grid;place-items:center;color:var(--ink);
    transition:border-color .3s var(--ease-expo),color .3s var(--ease-expo)}
  .theme-toggle:hover{border-color:var(--brand);color:var(--brand)}
  .theme-toggle svg{position:absolute;transition:transform .5s var(--ease-expo),opacity .35s var(--ease-expo)}
  .theme-toggle .i-moon{opacity:0;transform:rotate(-90deg) scale(.4)}
  [data-theme="dark"] .theme-toggle .i-sun{opacity:0;transform:rotate(90deg) scale(.4)}
  [data-theme="dark"] .theme-toggle .i-moon{opacity:1;transform:rotate(0deg) scale(1)}

  main{padding:48px 0 80px}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--muted);text-decoration:none;margin-bottom:20px;transition:color .25s var(--ease-expo)}
  .back-link:hover{color:var(--ink)}

  .profile-card{border:1px solid var(--hairline);border-radius:var(--radius);
    background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .pc-banner{height:120px;background:linear-gradient(135deg,var(--brand),var(--brand-light));position:relative}
  .pc-body{padding:0 32px 32px}
  .pc-avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block;
    margin-top:-52px;background:var(--hairline);border:4px solid var(--surface);box-shadow:var(--shadow);
    position:relative;z-index:1}
  .pc-name-block{margin:14px 0 22px}
  .pc-name-row{display:flex;align-items:center;gap:10px}
  .pc-name{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
  .pc-copy-btn{position:relative;flex:none;width:32px;height:32px;padding:0;border-radius:50%;
    background:var(--surface);border:1px solid var(--hairline-strong);cursor:pointer;
    display:grid;place-items:center;color:var(--muted);
    transition:border-color .25s var(--ease-expo),color .25s var(--ease-expo)}
  .pc-copy-btn:hover{border-color:var(--brand);color:var(--brand)}
  .pc-copy-btn.-copied{border-color:var(--green-ink);color:var(--green-ink)}
  .pc-copy-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--ink);color:var(--canvas);font-size:11.5px;font-weight:700;padding:4px 9px;
    border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease-expo),transform .2s var(--ease-expo)}
  .pc-copy-btn.-copied .pc-copy-tip{opacity:1;transform:translateX(-50%) translateY(0)}
  .pc-headline{font-size:14.5px;font-weight:600;color:var(--muted);margin:3px 0 0}
  .pc-meta{font-size:14px;color:var(--muted);margin:4px 0 0}
  .pc-meta-loc{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
  .pc-section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--faint);margin:16px 0 6px}
  .pc-badges{display:flex;flex-wrap:wrap;gap:8px}
  .pc-discipline{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand)}
  .pc-availability{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
  .pc-availability.-available{background:var(--green-soft);color:var(--green-ink)}
  .pc-availability.-open{background:var(--amber-soft);color:var(--amber)}
  .pc-availability.-unavailable{background:var(--hairline);color:var(--muted)}
  .pc-banner-availability{position:absolute;top:14px;right:16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pc-skills{display:flex;flex-wrap:wrap;gap:6px}
  .pc-skill{display:inline-block;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;
    background:var(--hairline);color:var(--muted)}
  .pc-contact{display:flex;flex-wrap:wrap;gap:10px}
  .pc-contact a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:999px;border:1px solid var(--hairline-strong);color:var(--ink);
    text-decoration:none;transition:border-color .25s var(--ease-expo),color .25s var(--ease-expo)}
  .pc-contact a:hover{border-color:var(--brand);color:var(--brand)}
  .pc-bio{font-size:15px;line-height:1.65;color:var(--ink);margin:0;white-space:pre-wrap}
  .pc-links{display:flex;flex-wrap:wrap;gap:10px}
  .link-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;
    padding:10px 18px;border-radius:999px;border:1px solid var(--hairline-strong);color:var(--ink);
    text-decoration:none;transition:border-color .25s var(--ease-expo),color .25s var(--ease-expo)}
  .link-btn:hover{border-color:var(--brand);color:var(--brand)}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty a{color:var(--brand);font-weight:700}
  @media(max-width:600px){
    .pc-banner{height:90px}
    .pc-body{padding:0 20px 24px}
    .pc-avatar{width:80px;height:80px;margin-top:-40px;border-width:3px}
    .pc-name{font-size:20px}
    .pc-banner-availability{top:10px;right:12px;font-size:11px;padding:3px 10px}
  }
</style>
</head>
<body>
<div id="pageLoader"><span class="pl-spinner"></span></div>

<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">
      <img class="logomark" src="/logo.png" alt="Kazi">
    </a>
    <div class="header-center">
    <nav class="nav-links">
      <a class="nav-jobs" href="/">Jobs</a>
      <a href="/post">Post a job</a>
      <a href="/designers">Find a designer</a>
      <a href="mailto:hello@odana.design">Contact us</a>
      <a href="/cv-check" class="nav-cta">Check your CV</a>
    </nav>
    </div>
    <div class="bar-right">
      <div class="bar-stat"><span class="livedot"></span><b id="liveCount">–</b><span class="stattext"> roles · updated daily</span></div>
    <button class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false" type="button">
      <svg class="i-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="i-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" type="button">
      <span></span><span></span>
    </button>
    <a href="/login" class="acct-cta" id="signinCta">Sign in</a>
    <a href="/signup" class="acct-cta" id="acctCta">Create an account</a>
    <div class="acct-menu" id="acctMenu">
      <button class="acct-trigger" id="acctTrigger" type="button" aria-haspopup="true" aria-expanded="false">
        <img class="acct-avatar" id="acctAvatar" src="" alt="">
        <span class="acct-label">Account</span>
        <svg class="acct-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="acct-dropdown" id="acctDropdown">
        <a href="/account">My profile</a>
        <button type="button" id="acctLogoutBtn">Log out</button>
      </div>
    </div>
    </div>
  </div>
</header>

<div class="mobile-menu" aria-label="Menu">
  <div class="mm-top">
    <h2>Menu</h2>
    <button class="mm-close" aria-label="Close menu" type="button">&times;</button>
  </div>
  <nav class="mm-nav">
      <a href="/">Jobs</a>
      <a href="/post">Post a job</a>
      <a href="/designers">Find a designer</a>
      <a href="mailto:hello@odana.design">Contact us</a>
      <a href="/cv-check" class="nav-cta">Check your CV</a>
  </nav>
  <nav class="mm-nav mm-account" id="mmCta">
    <a href="/login" class="mm-cta-outline">Sign in</a>
    <a href="/signup" class="mm-cta-outline">Create an account</a>
  </nav>
  <nav class="mm-nav mm-account" id="mmAccount" style="display:none">
    <a href="/account">My profile</a>
    <button type="button" class="mm-logout" id="mmLogoutBtn">Log out</button>
  </nav>
</div>

<div class="wrap">
  <main id="main">
    <div class="empty">Loading…</div>
  </main>
</div>

<footer class="foot">
  <div class="wrap">
    <span>© Kazi</span>
    <nav class="foot-links">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
      <a href="/cookies">Cookies</a>
      <a href="mailto:hello@odana.design">Contact us</a>
    </nav>
  </div>
</footer>

<script>
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ICON_INSTAGRAM = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>';
const ICON_TWITTER = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
const ICON_GLOBE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
const ICON_LINK_GENERIC = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

const AVAILABILITY_META = {
  "Available": {cls: "-available", label: "Available"},
  "Open to offers": {cls: "-open", label: "Open to offers"},
  "Not available": {cls: "-unavailable", label: "Not available"},
};

const ICON_LOCATION = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
const ICON_RESUME = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>';
const ICON_COPY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_CHECK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

/* Years of experience is free text (see account.html's wizard) — strip any
   trailing "year(s)" the designer already typed, then always append the
   full phrase so it never renders as a bare number next to the location. */
function formatYearsExperience(v) {
  const cleaned = (v || "").trim().replace(/\s*years?\s*$/i, "").trim();
  if (!cleaned) return "";
  const unit = cleaned === "1" ? "year" : "years";
  return `${escapeHtml(cleaned)} ${unit} of experience`;
}

function iconForLink(link) {
  let host = "";
  try { host = new URL(link.url).hostname.replace(/^www\./, "").toLowerCase(); } catch (e) {}
  const domainRules = [
    ["linkedin.com", ICON_LINKEDIN], ["github.com", ICON_GITHUB],
    ["behance.net", ICON_BEHANCE], ["dribbble.com", ICON_DRIBBBLE],
    ["instagram.com", ICON_INSTAGRAM],
    ["twitter.com", ICON_TWITTER], ["x.com", ICON_TWITTER],
  ];
  for (const [domain, icon] of domainRules) if (host.includes(domain)) return icon;

  const label = (link.label || "").toLowerCase();
  const labelRules = [
    [/linkedin/, ICON_LINKEDIN], [/github/, ICON_GITHUB],
    [/behance/, ICON_BEHANCE], [/dribbble/, ICON_DRIBBBLE],
    [/instagram/, ICON_INSTAGRAM], [/twitter|^x$/, ICON_TWITTER],
    [/portfolio|website|\bsite\b|personal/, ICON_GLOBE],
  ];
  for (const [re, icon] of labelRules) if (re.test(label)) return icon;

  return ICON_LINK_GENERIC;
}

async function boot() {
  const id = location.pathname.replace(/\/+$/, "").split("/").pop();
  const main = document.getElementById("main");
  try {
    const res = await fetch(`/api/designers/${id}`, {cache: "no-store"});
    if (!res.ok) throw new Error("not found");
    const d = await res.json();
    document.title = `${d.display_name} · Kazi`;
    const links = d.links || [];
    const contactRows = [
      d.phone ? `<a href="tel:${escapeHtml(d.phone)}">${ICON_PHONE}${escapeHtml(d.phone)}</a>` : "",
      d.contact_email ? `<a href="mailto:${escapeHtml(d.contact_email)}">${ICON_MAIL}${escapeHtml(d.contact_email)}</a>` : "",
    ].filter(Boolean);
    const availability = d.availability_status && AVAILABILITY_META[d.availability_status];
    main.innerHTML = `
      <a class="back-link" href="/designers">&larr; Back to all designers</a>
      <div class="profile-card">
        <div class="pc-banner">
          ${availability ? `<span class="pc-availability pc-banner-availability ${availability.cls}">${availability.label}</span>` : ""}
        </div>
        <div class="pc-body">
          <img class="pc-avatar" src="${d.photo_path ? escapeHtml(d.photo_path) : '/avatars/avatar-1.png'}" alt="">
          <div class="pc-name-block">
            <div class="pc-name-row">
              <p class="pc-name">${escapeHtml(d.display_name)}</p>
              <button type="button" class="pc-copy-btn" id="pcCopyBtn" aria-label="Copy profile link">
                ${ICON_COPY}
                <span class="pc-copy-tip">Copied!</span>
              </button>
            </div>
            ${d.headline ? `<p class="pc-headline">${escapeHtml(d.headline)}</p>` : ""}
            ${d.years_experience ? `<p class="pc-meta">${formatYearsExperience(d.years_experience)}</p>` : ""}
            ${d.location ? `<p class="pc-meta"><span class="pc-meta-loc">${ICON_LOCATION}${escapeHtml(d.location)}</span></p>` : ""}
            ${(d.discipline && d.discipline.length) ? `
            <p class="pc-section-label">Job function</p>
            <div class="pc-badges">${(d.discipline || []).map(x => `<span class="pc-discipline">${escapeHtml(x)}</span>`).join("")}</div>` : ""}
            ${(d.skills && d.skills.length) ? `
            <p class="pc-section-label">Skills</p>
            <div class="pc-skills">${d.skills.map(s => `<span class="pc-skill">${escapeHtml(s)}</span>`).join("")}</div>` : ""}
          </div>
          ${contactRows.length ? `
          <p class="pc-section-label">Contact</p>
          <div class="pc-contact">${contactRows.join("")}</div>` : ""}
          ${links.length ? `
          <p class="pc-section-label">Links</p>
          <div class="pc-links">${links.map(l => `<a class="link-btn" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${iconForLink(l)}${escapeHtml(l.label)}</a>`).join("")}</div>` : ""}
          ${d.resume_filename ? `
          <p class="pc-section-label">Resume</p>
          <div class="pc-links"><a class="link-btn" href="${escapeHtml(d.resume_url || '#')}" target="_blank" rel="noopener">${ICON_RESUME}${escapeHtml(d.resume_filename)}</a></div>` : ""}
          ${d.bio ? `
          <p class="pc-section-label">Bio</p>
          <p class="pc-bio">${escapeHtml(d.bio)}</p>` : ""}
        </div>
      </div>
    `;
    const copyBtn = document.getElementById("pcCopyBtn");
    function legacyCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    copyBtn.addEventListener("click", () => {
      const showCopied = () => {
        copyBtn.classList.add("-copied");
        copyBtn.innerHTML = `${ICON_CHECK}<span class="pc-copy-tip">Copied!</span>`;
        setTimeout(() => {
          copyBtn.classList.remove("-copied");
          copyBtn.innerHTML = `${ICON_COPY}<span class="pc-copy-tip">Copied!</span>`;
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(showCopied, () => {
          legacyCopy(location.href);
          showCopied();
        });
      } else {
        legacyCopy(location.href);
        showCopied();
      }
    });
  } catch (e) {
    main.innerHTML = `<div class="empty"><h3>Profile not found</h3><p>This designer's profile isn't available. <a href="/designers">Browse all designers</a></p></div>`;
  }
}
boot();
</script>
