<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job details · Kazi</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/theme.js?v=6"></script>
<script src="/nav.js?v=10"></script>
<script src="/confirm-dialog.js?v=1"></script>
<style>
  @font-face{font-family:Grift;src:url("/fonts/grift/Grift-Regular.woff2") format("woff2"),url("/fonts/grift/Grift-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("/fonts/grift/Grift-Medium.woff2") format("woff2"),url("/fonts/grift/Grift-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("/fonts/grift/Grift-SemiBold.woff2") format("woff2"),url("/fonts/grift/Grift-SemiBold.woff") format("woff");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("/fonts/grift/Grift-Bold.woff2") format("woff2"),url("/fonts/grift/Grift-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:Grift;src:url("/fonts/grift/Grift-ExtraBold.woff2") format("woff2"),url("/fonts/grift/Grift-ExtraBold.woff") format("woff");font-weight:800;font-style:normal;font-display:swap}

  :root{
    --canvas:#FFFFFF; --surface:#FFFFFF; --ink:#0B1623; --muted:#757575; --faint:#82828299;
    --hairline:#EEEEEE; --hairline-strong:#D2D0D0; --brand:#6D28A1; --brand-light:#AA52ED; --brand-soft:#F1E7FA;
    --green:#089111; --green-soft:#E1F5E3; --green-ink:#076C0D;
    --amber:#F25C05; --amber-soft:#FDE6D8;
    --red:#D3322A; --red-soft:#FBE4E2;
    --shadow:0 1px 2px rgba(11,22,35,.04), 0 8px 24px -12px rgba(11,22,35,.10);
    --radius:16px; --ease-expo:cubic-bezier(.19,1,.22,1); --ease-io:cubic-bezier(.65,0,.35,1);
  }
  :root[data-theme="dark"]{
    --canvas:#0B1420; --surface:#121B29; --ink:#EDEFF2; --muted:#94A0AC; --faint:#94A0AC99;
    --hairline:#1E2937; --hairline-strong:#2B3947; --brand:#A868E8; --brand-light:#C79AF2; --brand-soft:#251A38;
    --green:#22B368; --green-soft:#12301D; --green-ink:#5FE3A0;
    --amber:#FF9B57; --amber-soft:#3A2412;
    --red:#FF6B5B; --red-soft:#3A1712;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  #pageLoader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:var(--canvas);transition:opacity .35s var(--ease-io),visibility .35s var(--ease-io)}
  #pageLoader.-hide{opacity:0;visibility:hidden;pointer-events:none}
  #pageLoader .pl-spinner{width:32px;height:32px;border-radius:50%;
    border:3px solid var(--hairline-strong);border-top-color:var(--brand);
    animation:pl-spin .7s linear infinite}
  @keyframes pl-spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){#pageLoader .pl-spinner{animation:none}}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--canvas);color:var(--ink);font-family:"Grift",system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body > .wrap{flex:1}
  a{color:inherit}
  /* Wider than account.html's single-column dashboard (640px) so this reads
     as "full width, no sidebar" rather than a cramped form page, but not
     stretched to the 1200px header width either — long job-description
     prose at that line length is genuinely hard to read. The description
     text itself gets its own narrower measure below (see .job-desc). */
  .wrap{width:100%;max-width:1600px;margin:0 auto;padding:0 24px}
  @media(min-width:768px){.wrap{padding:0 32px}}
  @media(min-width:1280px){.wrap{padding:0 48px}}

  header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hairline)}
  [data-theme="dark"] header.bar{background:rgba(11,20,32,.82)}
  .bar-inner{position:relative;display:flex;align-items:center;gap:20px;height:64px;width:100%;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
  .logomark{height:20px;width:auto;flex:none;display:block}
  .bar-stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:7px 14px;
    font-variant-numeric:tabular-nums;box-shadow:var(--shadow);flex:none}
  .bar-stat b{color:var(--ink);font-weight:700}
  .bar-stat .livedot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:dotblink 2.6s ease-in-out infinite}
  @keyframes dotblink{0%,100%{opacity:1}50%{opacity:.25}}
  @media(max-width:1500px){
    .bar-stat .stattext{display:none}
    .bar-stat{padding:7px 10px}
  }
  .header-center{flex:1;min-width:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:18px}
  .bar-right{display:flex;align-items:center;gap:16px;flex:none;margin-left:auto}
  .nav-links{display:flex;align-items:center;gap:24px;white-space:nowrap}
  .nav-links a{font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;
    transition:color .3s var(--ease-expo)}
  .nav-links a:hover{color:var(--ink)}

  footer.foot{border-top:1px solid var(--hairline);padding:26px 0;color:var(--muted);font-size:13px;margin-top:auto}
  footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .foot-links{display:flex;gap:16px;flex-wrap:wrap}
  .foot-links a{color:var(--muted);text-decoration:none}
  .foot-links a:hover{color:var(--ink)}

  .menu-toggle{display:none;position:relative;flex:none;width:38px;height:38px;padding:0;
    border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
    cursor:pointer;color:var(--ink);
    transition:border-color .3s var(--ease-expo),color .3s var(--ease-expo)}
  .menu-toggle:hover{border-color:var(--brand);color:var(--brand)}
  .menu-toggle span{display:block;position:absolute;left:50%;top:50%;width:16px;height:2px;
    border-radius:2px;background:currentColor;transition:transform .4s var(--ease-io)}
  .menu-toggle span:first-child{transform:translate(-50%,-50%) translateY(-3px)}
  .menu-toggle span:last-child{transform:translate(-50%,-50%) translateY(3px)}
  .menu-toggle.-active span:first-child{transform:translate(-50%,-50%) rotate(45deg)}
  .menu-toggle.-active span:last-child{transform:translate(-50%,-50%) rotate(-45deg)}

  html.menu-open{overflow:hidden}
  .mobile-menu{position:fixed;inset:0;z-index:300;background:var(--canvas);
    padding:20px 22px 40px;overflow:auto;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease}
  .mobile-menu.-open{transform:translateX(0)}
  .mm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .mm-top h2{margin:0;font-size:16.5px;font-weight:800;color:var(--ink)}
  .mm-close{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;
    border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
    font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .mm-nav{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid var(--hairline);padding-top:6px}
  .mm-nav a{display:block;padding:14px 8px;margin:0 -8px;border-radius:8px;
    font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;
    transition:background .25s var(--ease-expo),color .25s var(--ease-expo)}
  .mm-nav a:hover{background:var(--hairline)}
  .mm-nav:not(.mm-account) a:not(.nav-cta){display:flex;align-items:center;border-bottom:1px solid var(--hairline)}
  .mm-nav:not(.mm-account) a:not(.nav-cta)::after{content:"";flex:none;width:7px;height:7px;margin-left:auto;
    border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg)}
  .mm-nav:not(.mm-account) a:not(.nav-cta):nth-child(-n+3){border-radius:0}
  .mm-nav:not(.mm-account) a:not(.nav-cta):nth-child(4){border-bottom:none}
  .mm-account{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .mm-nav button.mm-logout{display:block;width:100%;text-align:left;padding:14px 8px;margin:0 -8px;border-radius:8px;
    font-size:16px;font-weight:600;color:var(--ink);background:none;border:0;cursor:pointer;font:inherit;
    transition:background .25s var(--ease-expo),color .25s var(--ease-expo)}
  .mm-nav button.mm-logout:hover{background:var(--hairline)}
  .nav-links a.active,.mm-nav a.active{color:var(--brand);font-weight:600}
  .nav-links a.active::before,.mm-nav a.active::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:4px;vertical-align:middle}
  .nav-links a.nav-cta{background:var(--brand);color:#fff;padding:7px 16px;border-radius:999px;margin-left:10px;font-weight:700;transition:filter .3s var(--ease-expo)}
  .nav-links a.nav-cta:hover{filter:brightness(1.12);color:#fff}
  .mm-nav a.nav-cta{background:var(--brand);color:#fff;text-align:center;margin-top:10px;transition:filter .25s var(--ease-expo)}
  .mm-nav a.mm-cta-outline{border:1px solid var(--hairline-strong);text-align:center}
  .mm-nav a.mm-cta-outline:hover{border-color:var(--brand)}
  .mm-nav a.nav-cta:hover{filter:brightness(1.12);background:var(--brand);color:#fff}

  @media(max-width:860px){
    body{font-size:15px}
  }
  @media(max-width:600px){
    body{font-size:14px}
  }
  @media(max-width:860px){
    .bar-inner{gap:10px}
    .bar-stat{padding:6px 10px;font-size:12px;gap:5px}
    .bar-stat .stattext{display:none}
    .nav-links{gap:14px}
    .nav-links a{font-size:12.5px;white-space:nowrap}
  }
  @media(max-width:767px),(orientation:portrait) and (max-width:1400px){
    .header-center{display:none}
    .menu-toggle{display:block}
  }
  @media(orientation:portrait) and (max-width:1400px){
    .acct-cta{order:1}
    .acct-menu{order:1}
    .menu-toggle{order:2}
  }

  .acct-menu{position:relative;flex:none;display:none}
  .acct-menu.-visible{display:block}
  .acct-trigger{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 6px;
    border-radius:999px;border:1px solid var(--hairline-strong);background:var(--surface);
    cursor:pointer;color:var(--ink);font:inherit;font-size:13px;font-weight:600;
    transition:border-color .3s var(--ease-expo)}
  .acct-trigger:hover{border-color:var(--brand)}
  .acct-cta{display:flex;align-items:center;height:38px;padding:0 16px;flex:none;
    border-radius:999px;border:1px solid var(--hairline-strong);background:var(--surface);
    color:var(--ink);font:inherit;font-size:13px;font-weight:600;text-decoration:none;
    transition:border-color .3s var(--ease-expo)}
  .acct-cta:hover{border-color:var(--brand)}
  .acct-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--hairline)}
  .acct-caret{flex:none;color:var(--muted);transition:transform .25s var(--ease-expo)}
  .acct-menu.-open .acct-caret{transform:rotate(180deg)}
  .acct-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:160px;z-index:60;
    background:var(--surface);border:1px solid var(--hairline-strong);border-radius:12px;
    box-shadow:var(--shadow);padding:6px;display:none;flex-direction:column;gap:2px}
  .acct-menu.-open .acct-dropdown{display:flex}
  .acct-dropdown a,.acct-dropdown button{display:block;width:100%;text-align:left;
    padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--ink);
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .acct-dropdown a:hover,.acct-dropdown button:hover{background:var(--hairline)}
  @media(max-width:600px){
    .acct-menu{display:none!important}
    .acct-cta{display:none!important}
  }

  .theme-toggle{position:relative;flex:none;width:36px;height:36px;padding:0;border-radius:50%;
    background:var(--surface);border:1px solid var(--hairline-strong);cursor:pointer;
    display:grid;place-items:center;color:var(--ink);
    transition:border-color .3s var(--ease-expo),color .3s var(--ease-expo)}
  .theme-toggle:hover{border-color:var(--brand);color:var(--brand)}
  .theme-toggle svg{position:absolute;transition:transform .5s var(--ease-expo),opacity .35s var(--ease-expo)}
  .theme-toggle .i-moon{opacity:0;transform:rotate(-90deg) scale(.4)}
  [data-theme="dark"] .theme-toggle .i-sun{opacity:0;transform:rotate(90deg) scale(.4)}
  [data-theme="dark"] .theme-toggle .i-moon{opacity:1;transform:rotate(0deg) scale(1)}

  main{padding:40px 0 90px}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--muted);text-decoration:none;margin-bottom:20px;transition:color .25s var(--ease-expo)}
  .back-link:hover{color:var(--ink)}

  .job-card{border:1px solid var(--hairline);border-radius:var(--radius);
    background:var(--surface);box-shadow:var(--shadow);padding:32px}
  .job-title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .job-title{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
  .job-copy-btn{position:relative;flex:none;width:34px;height:34px;padding:0;border-radius:50%;margin-top:4px;
    background:var(--surface);border:1px solid var(--hairline-strong);cursor:pointer;
    display:grid;place-items:center;color:var(--muted);
    transition:border-color .25s var(--ease-expo),color .25s var(--ease-expo)}
  .job-copy-btn:hover{border-color:var(--brand);color:var(--brand)}
  .job-copy-btn.-copied{border-color:var(--green-ink);color:var(--green-ink)}
  .job-copy-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--ink);color:var(--canvas);font-size:11.5px;font-weight:700;padding:4px 9px;
    border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease-expo),transform .2s var(--ease-expo)}
  .job-copy-btn.-copied .job-copy-tip{opacity:1;transform:translateX(-50%) translateY(0)}
  .job-company-row{display:flex;align-items:center;gap:10px;margin:10px 0 0}
  .job-logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:var(--hairline);flex:none}
  .job-company{font-size:16px;font-weight:700;color:var(--ink)}
  .job-meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 0;font-size:13.5px;color:var(--muted)}
  .job-meta-row .jm-item{display:inline-flex;align-items:center;gap:5px}
  .job-tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
  .job-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    padding:4px 12px;border-radius:999px;background:var(--hairline);color:var(--muted)}
  .job-tag.-elig{background:var(--green-soft);color:var(--green-ink)}
  .job-tag.-pay{background:var(--brand-soft);color:var(--brand)}
  .job-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
  .btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;
    text-decoration:none;border:0;font:inherit;font-weight:700;font-size:14.5px;padding:13px 24px;
    border-radius:999px;cursor:pointer;transition:background .3s var(--ease-expo)}
  .btn-primary:hover{background:var(--brand-light)}
  .btn-secondary{display:inline-flex;align-items:center;gap:8px;background:none;color:var(--ink);
    border:1px solid var(--hairline-strong);font:inherit;font-weight:700;font-size:14.5px;padding:13px 24px;
    border-radius:999px;cursor:pointer;transition:border-color .25s var(--ease-expo),color .25s var(--ease-expo)}
  .btn-secondary:hover{border-color:var(--brand);color:var(--brand)}
  .btn-secondary:disabled{opacity:.6;cursor:not-allowed}

  .job-section{margin-top:36px;padding-top:28px;border-top:1px solid var(--hairline)}
  .job-section h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--faint);margin:0 0 14px}
  /* Optimal reading measure for the actual prose, independent of the wider
     card/actions above — this is the "optimize for reading" requirement.
     desc is our own sanitized/reformatted HTML (see scraper/desc_format.py),
     never raw source markup, so it's safe to render unescaped — this block
     is what gives it a clear typographic hierarchy instead of one flat run. */
  .job-desc{font-size:15.5px;line-height:1.7;color:var(--ink);max-width:74ch;overflow-wrap:anywhere}
  .job-desc img{max-width:100%;height:auto}
  .job-desc table{display:block;max-width:100%;overflow-x:auto}
  .job-desc pre{white-space:pre-wrap;overflow-wrap:anywhere}
  .job-desc > *:first-child{margin-top:0}
  .job-desc > *:last-child{margin-bottom:0}
  .job-desc h2{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:28px 0 10px}
  .job-desc h3{font-size:16.5px;font-weight:700;color:var(--ink);margin:24px 0 8px}
  .job-desc h4{font-size:14.5px;font-weight:700;color:var(--ink);margin:20px 0 6px}
  .job-desc p{margin:0 0 16px}
  .job-desc ul,.job-desc ol{margin:0 0 16px;padding-left:22px}
  .job-desc li{margin-bottom:7px;line-height:1.6}
  .job-desc li:last-child{margin-bottom:0}
  .job-desc li > ul,.job-desc li > ol{margin-top:7px}
  .job-desc strong,.job-desc b{font-weight:700}
  .job-desc em,.job-desc i{font-style:italic}
  .job-desc a{color:var(--brand);font-weight:600;text-decoration:none}
  .job-desc a:hover{text-decoration:underline}
  .job-desc hr{border:0;border-top:1px solid var(--hairline);margin:24px 0}
  .job-source{font-size:13px;color:var(--muted);margin:0}
  .job-source a{color:var(--brand);font-weight:600;text-decoration:none}
  .job-source a:hover{text-decoration:underline}

  .job-actions-bottom{border-top:1px solid var(--hairline);margin-top:36px;padding-top:28px}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty a{color:var(--brand);font-weight:700}

  /* ---------- ATS check panel (ported from cv-check.html) ---------- */
  .ats-panel{margin-top:28px;border:1px solid var(--hairline);border-radius:var(--radius);
    background:var(--surface);box-shadow:var(--shadow);padding:28px 28px 32px}
  .ats-panel h2{font-size:17px;font-weight:800;margin:0 0 4px}
  .ats-sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .ats-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 18px}
  .ats-note svg{flex:none;color:var(--green)}

  .save-row{display:flex;align-items:center;gap:9px;margin:14px 0 0;font-size:13.5px;color:var(--ink)}
  .save-row input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
  .save-row label{cursor:pointer}

  .dropzone{border:2px dashed var(--hairline-strong);border-radius:var(--radius);padding:32px 22px;
    text-align:center;cursor:pointer;transition:border-color .25s var(--ease-expo),background .25s var(--ease-expo)}
  .dropzone:hover,.dropzone.-drag{border-color:var(--brand);background:var(--brand-soft)}
  .dropzone svg{color:var(--muted);margin-bottom:10px}
  .dropzone .dz-title{font-weight:700;font-size:14.5px;margin:0 0 4px}
  .dropzone .dz-sub{font-size:12.5px;color:var(--muted);margin:0}
  .dropzone input[type=file]{display:none}

  .file-chip{display:flex;align-items:center;gap:12px;border:1px solid var(--hairline-strong);
    border-radius:var(--radius);padding:14px 16px}
  .file-chip .f-icon{flex:none;width:36px;height:36px;border-radius:10px;background:var(--brand-soft);
    color:var(--brand);display:grid;place-items:center}
  .file-chip .f-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-chip .f-size{font-size:12px;color:var(--muted)}
  .file-chip .f-remove{flex:none;margin-left:auto;background:none;border:0;color:var(--muted);
    cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}
  .file-chip .f-remove:hover{background:var(--hairline);color:var(--ink)}

  .ats-err{color:#a5341f;font-size:13px;margin:14px 0 0}
  [data-theme="dark"] .ats-err{color:#FF6B5B}

  .ats-submit-row{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

  .score-panel{display:flex;align-items:center;gap:22px;border:1px solid var(--hairline);
    border-radius:var(--radius);padding:22px 24px;background:var(--surface);
    margin-bottom:22px;flex-wrap:wrap}
  .score-ring{flex:none;width:80px;height:80px}
  .score-ring text{font-family:"Grift",system-ui,sans-serif;font-weight:800;font-size:22px;fill:var(--ink)}
  .score-info{flex:1;min-width:180px}
  .score-label{font-weight:800;font-size:17px;margin:0 0 4px}
  .score-desc{color:var(--muted);font-size:13.5px;margin:0}

  .check-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .check-row{display:flex;gap:12px;border:1px solid var(--hairline);border-radius:12px;padding:14px 16px;background:var(--canvas)}
  .check-row .c-icon{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
  .check-row.-pass .c-icon{background:var(--green-soft);color:var(--green-ink)}
  .check-row.-warning .c-icon{background:var(--amber-soft);color:var(--amber)}
  .check-row.-critical .c-icon{background:var(--red-soft);color:var(--red)}
  .check-row .c-title{font-weight:700;font-size:14px;margin:0 0 3px}
  .check-row .c-detail{font-size:13px;color:var(--muted);margin:0}
  .check-row .c-fix{font-size:12.5px;color:var(--ink);margin:8px 0 0;padding:9px 11px;
    background:var(--hairline);border-radius:8px}
  .check-row .c-fix b{color:var(--brand)}

  .kw-panel{border:1px solid var(--hairline);border-radius:var(--radius);padding:20px 22px;background:var(--canvas);margin-bottom:20px}
  .kw-panel h3{margin:0 0 4px;font-size:15px;font-weight:800}
  .kw-panel .kw-sub{font-size:13px;color:var(--muted);margin:0 0 14px}
  .kw-group{margin-top:16px}
  .kw-group:first-of-type{margin-top:0}
  .kw-group-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--faint);margin:0 0 8px}
  .kw-pills{display:flex;flex-wrap:wrap;gap:8px}
  .kw-pill{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--red-soft);color:var(--red)}
  .kw-pill.-match{background:var(--green-soft);color:var(--green-ink)}

  .ats-reset-row{text-align:center;margin-top:8px}
  .spinner-inline{display:inline-block;width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:pl-spin .7s linear infinite;
    vertical-align:-2px;margin-right:7px}

  @media(max-width:600px){
    .job-card{padding:22px}
    .ats-panel{padding:20px 20px 26px}
    .job-actions{flex-direction:column;align-items:stretch}
    .job-actions .btn-primary,.job-actions .btn-secondary{justify-content:center}
  }
</style>

<script>
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const TOKEN_KEY = "kazi_designer_token";
function getToken() {
  return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || "";
}

const ICON_LOCATION = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
const ICON_CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
const ICON_EXTERNAL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const ICON_COPY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_CHECK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

const ELIG_META = {
  kenya:{cls:"-elig",l:"Open to Kenya"},
  africa:{cls:"-elig",l:"Open to Africa"},
  world:{cls:"-elig",l:"Worldwide remote"},
  check:{cls:"",l:"Check restrictions"},
};

function hasPay(j){ return j.pay && j.pay !== "Not disclosed"; }
function postedLabel(j){
  return j.days === 0 ? "Today" : j.days === 1 ? "Yesterday" : (j.days < 7 ? j.days + "d ago" : Math.round(j.days / 7) + "w ago");
}

let CURRENT_JOB = null;
let ME = null; // populated if logged in

function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

function wireCopyButton() {
  const btn = document.getElementById("jobCopyBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const showCopied = () => {
      btn.classList.add("-copied");
      btn.innerHTML = `${ICON_CHECK}<span class="job-copy-tip">Copied!</span>`;
      setTimeout(() => {
        btn.classList.remove("-copied");
        btn.innerHTML = `${ICON_COPY}<span class="job-copy-tip">Copied!</span>`;
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(showCopied, () => { legacyCopy(location.href); showCopied(); });
    } else {
      legacyCopy(location.href);
      showCopied();
    }
  });
}

function trackApply(j) {
  if (window.kaziTrack) window.kaziTrack("/api/track/apply", {job_id: j.id, title: j.t, company: j.co});
}

function wireApplyButtons(j) {
  document.querySelectorAll(".job-apply-btn").forEach(btn => {
    btn.addEventListener("click", () => trackApply(j));
  });
}

function jobCardHtml(j) {
  const e = ELIG_META[j.elig] || {cls:"", l:""};
  const metaItems = [
    j.city ? `<span class="jm-item">${ICON_LOCATION}${escapeHtml(j.city)}${j.country ? ", " + escapeHtml(j.country) : ""}</span>` : "",
    j.work ? `<span class="jm-item">${escapeHtml(j.work)}</span>` : "",
    j.level ? `<span class="jm-item">${escapeHtml(j.level)}</span>` : "",
    j.cat ? `<span class="jm-item">${escapeHtml(j.cat)}</span>` : "",
    `<span class="jm-item">${ICON_CLOCK}Posted ${postedLabel(j)}</span>`,
  ].filter(Boolean);

  const tags = [
    e.l ? `<span class="job-tag -elig">${escapeHtml(e.l)}</span>` : "",
    hasPay(j) ? `<span class="job-tag -pay">${escapeHtml(j.pay)}</span>` : "",
  ].filter(Boolean);

  const actionsHtml = (idSuffix) => `
    <div class="job-actions${idSuffix === "Bottom" ? " job-actions-bottom" : ""}">
      <a class="btn-primary job-apply-btn" id="applyBtn${idSuffix}" href="${escapeHtml(j.url)}" target="_blank" rel="noopener">Apply${ICON_EXTERNAL}</a>
      <button type="button" class="btn-secondary check-resume-btn" id="checkResumeBtn${idSuffix}">Check Against Your Resume</button>
    </div>
  `;

  return `
    <div class="job-card">
      <div class="job-title-row">
        <h1 class="job-title">${escapeHtml(j.t)}</h1>
        <button type="button" class="job-copy-btn" id="jobCopyBtn" aria-label="Copy job link">
          ${ICON_COPY}<span class="job-copy-tip">Copied!</span>
        </button>
      </div>
      <div class="job-company-row">
        <span class="job-company">${escapeHtml(j.co)}</span>
      </div>
      ${metaItems.length ? `<div class="job-meta-row">${metaItems.join("")}</div>` : ""}
      ${tags.length ? `<div class="job-tags">${tags.join("")}</div>` : ""}
      ${actionsHtml("Top")}
      ${j.desc ? `
      <div class="job-section">
        <h2>Job description</h2>
        <div class="job-desc">${j.desc}</div>
      </div>` : ""}
      ${(j.src || j.url) ? `
      <div class="job-section">
        <h2>Source</h2>
        <p class="job-source">Originally posted${j.src ? " via " + escapeHtml(j.src) : ""} — <a href="${escapeHtml(j.url)}" target="_blank" rel="noopener">view the original listing</a></p>
      </div>` : ""}
      ${actionsHtml("Bottom")}
    </div>
    <div class="ats-panel" id="atsPanel" style="display:none"></div>
  `;
}

/* ---------- ATS check panel (upload UI + results, ported from cv-check.html) ---------- */

const ATS_MAX_BYTES = 3 * 1024 * 1024;

function humanSize(bytes){
  if(bytes < 1024) return `${bytes} B`;
  if(bytes < 1024*1024) return `${(bytes/1024).toFixed(0)} KB`;
  return `${(bytes/(1024*1024)).toFixed(1)} MB`;
}

function scoreColor(score){
  if(score >= 85) return "var(--green)";
  if(score >= 65) return "var(--brand)";
  if(score >= 45) return "var(--amber)";
  return "var(--red)";
}
function scoreLabelText(score){
  if(score >= 85) return "Excellent";
  if(score >= 65) return "Good";
  if(score >= 45) return "Needs work";
  return "Poor";
}
function scoreDescText(score){
  if(score >= 85) return "Your resume is in great shape for ATS software to read correctly.";
  if(score >= 65) return "Solid, but a few fixes below would make it more reliably parsed.";
  if(score >= 45) return "Several issues below could cause an ATS to misread or drop parts of your resume.";
  return "Multiple issues below are likely causing ATS software to misread your resume.";
}

const ICON_PASS = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_WARN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>';

function renderAtsResults(data) {
  const r = 36, c = 2 * Math.PI * r;
  const offset = c - (data.score / 100) * c;
  const color = scoreColor(data.score);
  const checksHtml = data.checks.map(ch => {
    const cls = ch.passed ? "-pass" : (ch.severity === "critical" ? "-critical" : "-warning");
    const icon = ch.passed ? ICON_PASS : ICON_WARN;
    return `
      <div class="check-row ${cls}">
        <span class="c-icon">${icon}</span>
        <div>
          <p class="c-title">${escapeHtml(ch.title)}</p>
          <p class="c-detail">${escapeHtml(ch.detail)}</p>
          ${!ch.passed ? `<p class="c-fix"><b>How to fix:</b> ${escapeHtml(ch.fix)}</p>` : ""}
        </div>
      </div>
    `;
  }).join("");

  const km = data.keyword_match;
  const kwHtml = km ? `
    <div class="kw-panel">
      <h3>Keyword match</h3>
      <p class="kw-sub">${km.score}% of the job description's key terms appear in your resume.</p>
      <div class="kw-group">
        <p class="kw-group-label">Missing: in the job description, not in your resume</p>
        <div class="kw-pills">${km.missing.length ? km.missing.map(w => `<span class="kw-pill">${escapeHtml(w)}</span>`).join("") : `<span class="kw-pill -match">Nothing major missing</span>`}</div>
      </div>
      <div class="kw-group">
        <p class="kw-group-label">Matched: in both</p>
        <div class="kw-pills">${km.matched.length ? km.matched.map(w => `<span class="kw-pill -match">${escapeHtml(w)}</span>`).join("") : `<span class="kw-pill">None of the key terms matched</span>`}</div>
      </div>
    </div>
  ` : "";

  const rm = data.requirements_match;
  const rmHtml = rm ? `
    <div class="kw-panel">
      <h3>Experience &amp; qualifications match</h3>
      <p class="kw-sub">${rm.items.filter(i => i.met).length} of ${rm.items.length} requirements found on your resume.</p>
      <div class="check-list">${rm.items.map(i => `
        <div class="check-row ${i.met ? "-pass" : "-critical"}">
          <span class="c-icon">${i.met ? ICON_PASS : ICON_WARN}</span>
          <div>
            <p class="c-title">${escapeHtml(i.label)}</p>
            <p class="c-detail">${escapeHtml(i.detail)}</p>
          </div>
        </div>
      `).join("")}</div>
    </div>
  ` : "";

  return `
    <div class="score-panel">
      <svg class="score-ring" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--hairline)" stroke-width="9"/>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
          transform="rotate(-90 50 50)"/>
        <text x="50" y="56" text-anchor="middle">${data.score}</text>
      </svg>
      <div class="score-info">
        <p class="score-label" style="color:${color}">${scoreLabelText(data.score)} (${data.score}/100)</p>
        <p class="score-desc">${scoreDescText(data.score)}</p>
      </div>
    </div>
    <div class="check-list">${checksHtml}</div>
    ${kwHtml}
    ${rmHtml}
    <div class="ats-reset-row">
      <button type="button" class="btn-secondary" id="atsCheckAnother">Check a different resume</button>
    </div>
  `;
}

let atsSelectedFile = null;

function wireAtsDropzone(onFile) {
  const dropzone = document.getElementById("atsDropzone");
  const fileInput = document.getElementById("atsFileInput");
  const fileChip = document.getElementById("atsFileChip");
  const fileName = document.getElementById("atsFileName");
  const fileSize = document.getElementById("atsFileSize");
  const fileRemove = document.getElementById("atsFileRemove");
  const formErr = document.getElementById("atsFormErr");
  const checkBtn = document.getElementById("atsCheckBtn");

  function showError(msg){ formErr.textContent = msg; formErr.style.display = "block"; }
  function clearError(){ formErr.style.display = "none"; }

  function setFile(file){
    clearError();
    if(!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if(!["pdf","docx"].includes(ext)){ showError("Please choose a .pdf or .docx file."); return; }
    if(file.size > ATS_MAX_BYTES){ showError("That file is larger than 3MB. Please choose a smaller one."); return; }
    atsSelectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = humanSize(file.size);
    fileChip.style.display = "flex";
    dropzone.style.display = "none";
    checkBtn.disabled = false;
  }
  function clearFile(){
    atsSelectedFile = null;
    fileInput.value = "";
    fileChip.style.display = "none";
    dropzone.style.display = "block";
    checkBtn.disabled = true;
  }

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  fileRemove.addEventListener("click", clearFile);
  ["dragenter","dragover"].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("-drag"); }));
  ["dragleave","drop"].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("-drag"); }));
  dropzone.addEventListener("drop", e => { const file = e.dataTransfer.files && e.dataTransfer.files[0]; if(file) setFile(file); });

  checkBtn.addEventListener("click", async () => {
    if(!atsSelectedFile) return;
    clearError();
    checkBtn.disabled = true;
    checkBtn.innerHTML = '<span class="spinner-inline"></span>Analyzing…';
    try {
      await onFile(atsSelectedFile);
    } catch(err) {
      showError("Couldn't analyze that file: " + err.message);
    } finally {
      checkBtn.disabled = false;
      checkBtn.textContent = "Check my resume";
    }
  });
}

function showAtsResults(data) {
  document.getElementById("atsUploadStage").style.display = "none";
  document.getElementById("atsResults").innerHTML = renderAtsResults(data);
  document.getElementById("atsCheckAnother").addEventListener("click", () => {
    openAtsPanel();
  });
}

async function runAnonymousCheck(file) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("job_description", CURRENT_JOB.desc || "");
  const res = await fetch("/api/ats/check", {method: "POST", body: fd});
  if(!res.ok){
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${res.status})`);
  }
  showAtsResults(await res.json());
}

async function runUploadAndMaybeSaveCheck(file) {
  const save = document.getElementById("atsSaveToProfile").checked;
  const token = getToken();
  if (save) {
    const fd = new FormData();
    fd.append("file", file);
    const upRes = await fetch("/api/designers/me/resume", {method: "POST", headers: {"Authorization": "Bearer " + token}, body: fd});
    if (!upRes.ok) {
      const body = await upRes.json().catch(() => ({}));
      throw new Error(body.detail || `Couldn't save resume (${upRes.status})`);
    }
    const saved = await upRes.json();
    ME.resume_filename = saved.resume_filename;
    ME.resume_uploaded_at = saved.resume_uploaded_at;
    const checkRes = await fetch("/api/designers/me/ats-check", {
      method: "POST", headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"},
      body: JSON.stringify({job_description: CURRENT_JOB.desc || ""}),
    });
    if (!checkRes.ok) {
      const body = await checkRes.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${checkRes.status})`);
    }
    showAtsResults(await checkRes.json());
  } else {
    await runAnonymousCheck(file);
  }
}

async function runSavedResumeCheck() {
  const btn = document.getElementById("atsCheckSavedBtn");
  const resultsEl = document.getElementById("atsResults");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Analyzing…';
  try {
    const token = getToken();
    const res = await fetch("/api/designers/me/ats-check", {
      method: "POST", headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"},
      body: JSON.stringify({job_description: CURRENT_JOB.desc || ""}),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }
    resultsEl.innerHTML = renderAtsResults(await res.json());
    document.getElementById("atsCheckAnother").addEventListener("click", () => openAtsPanel());
  } catch(err) {
    resultsEl.innerHTML = `<p class="ats-err">Couldn't analyze your resume: ${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Run the check";
  }
}

function openAtsPanel() {
  const panel = document.getElementById("atsPanel");
  panel.style.display = "block";
  atsSelectedFile = null;

  if (!getToken()) {
    panel.innerHTML = anonymousUploadPanelHtml();
    wireAtsDropzone(runAnonymousCheck);
  } else if (ME && ME.resume_filename) {
    panel.innerHTML = savedResumePanelHtml();
    document.getElementById("atsCheckSavedBtn").addEventListener("click", runSavedResumeCheck);
  } else {
    panel.innerHTML = accountUploadPanelHtml();
    wireAtsDropzone(runUploadAndMaybeSaveCheck);
  }
  panel.scrollIntoView({behavior: "smooth", block: "start"});
}

function wireCheckResumeButtons() {
  document.querySelectorAll(".check-resume-btn").forEach(btn => {
    btn.addEventListener("click", () => openAtsPanel());
  });
}

async function boot() {
  const id = location.pathname.replace(/\/+$/, "").split("/").pop();
  const main = document.getElementById("main");
  const token = getToken();

  try {
    const jobPromise = fetch(`/api/jobs/${id}`, {cache: "no-store"});
    const mePromise = token
      ? fetch("/api/designers/me", {headers: {"Authorization": "Bearer " + token}}).then(r => r.ok ? r.json() : null).catch(() => null)
      : Promise.resolve(null);
    const [jobRes, me] = await Promise.all([jobPromise, mePromise]);
    if (!jobRes.ok) throw new Error("not found");
    const j = await jobRes.json();
    CURRENT_JOB = j;
    ME = me;
    document.title = `${j.t} at ${j.co} · Kazi`;
    main.innerHTML = `<a class="back-link" href="/">&larr; Back to all jobs</a>` + jobCardHtml(j);
    wireCopyButton();
    wireApplyButtons(j);
    wireCheckResumeButtons();
  } catch (e) {
    main.innerHTML = `<div class="empty"><h3>Job not found</h3><p>This listing isn't available anymore. <a href="/">Browse all jobs</a></p></div>`;
  }
}
boot();
</script>
