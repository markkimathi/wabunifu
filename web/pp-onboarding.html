<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your profile · Path & Pixel</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="pp-primitives.css">
<style>
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;display:flex;justify-content:center;padding:0 var(--pp-page-margin) 64px}
  a{color:inherit}
  .wizard{max-width:560px;width:100%;padding-top:8px}

  .wizard-top{display:flex;justify-content:flex-end;margin-bottom:20px}
  .finish-later{border:none;background:transparent;font-family:var(--pp-font);font-size:14.5px;font-weight:600;
    color:var(--c-text-subtle);cursor:pointer;padding:8px 12px;border-radius:var(--pp-radius-md)}
  .finish-later:hover{background:var(--c-bg-sunken);color:var(--c-text)}

  .dots{display:flex;gap:8px;margin-bottom:16px}
  .dot{flex:1;height:4px;border-radius:999px;background:var(--c-surface-inset)}
  .dot.-done{background:var(--pp-gold)}
  .dot.-active{background:var(--c-text)}

  .strength-meter{padding:14px 16px;border-radius:var(--pp-radius-lg);background:var(--c-bg-sunken);
    border:1px solid var(--c-border);margin-bottom:28px}
  .strength-meter .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .strength-meter .row span:first-child{font-size:13px;font-weight:600}
  .strength-meter .row span:last-child{font-size:13px;font-weight:700;color:var(--pp-gold-800);font-variant-numeric:tabular-nums}
  .strength-meter .bar{height:6px;border-radius:999px;background:var(--c-border);overflow:hidden}
  .strength-meter .bar span{display:block;height:100%;background:var(--pp-gold);transition:width var(--pp-duration) var(--pp-ease)}
  .strength-meter .note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--c-text-subtle)}

  .step-title{margin:0 0 6px;font-size:30px;line-height:1.1;letter-spacing:-0.026em;font-weight:800}
  .step-sub{margin:0 0 28px;font-size:15.5px;line-height:1.55;color:var(--c-text-subtle)}
  .step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
  .skip-link{border:none;background:transparent;font-family:var(--pp-font);font-size:14.5px;
    font-weight:600;color:var(--c-text-subtle);cursor:pointer;padding:0}

  .photo-block{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px}
  .photo-block img{width:112px;height:112px;border-radius:50%;object-fit:cover;margin-bottom:16px;border:1px solid var(--c-border)}
  .photo-block .hint{font-size:12.5px;color:var(--c-text-faint);margin:8px 0 0}
  .divider-or{display:flex;align-items:center;gap:14px;margin:24px 0 16px}
  .divider-or span:not(.txt){flex:1;height:1px;background:var(--c-border)}
  .divider-or .txt{font-size:13px;color:var(--c-text-faint)}
  .avatar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .avatar-option{position:relative;border:none;background:none;padding:0;cursor:pointer;border-radius:50%;overflow:hidden}
  .avatar-option img{width:100%;aspect-ratio:1;display:block;border-radius:50%;border:2px solid transparent}
  .avatar-option.-selected img{border-color:var(--pp-gold)}
  .avatar-check{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,10,.45);color:var(--pp-gold)}
  .avatar-option.-selected .avatar-check{display:flex}

  .chip-select{display:flex;flex-wrap:wrap;gap:7px}
  .pick-chip{padding:7px 13px;border-radius:999px;font-family:var(--pp-font);font-size:13.5px;font-weight:500;
    cursor:pointer;background:var(--c-surface-inset);color:var(--c-text-muted);border:1px solid transparent}
  .pick-chip.-active{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text)}
  .pick-chip:disabled{opacity:.4;cursor:not-allowed}

  .tag-box{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:50px;padding:8px 10px;
    border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .tag-box:focus-within{border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .tag-box input{border:none;outline:none;background:transparent;font-family:var(--pp-font);
    font-size:14.5px;flex:1;min-width:120px;color:var(--c-text)}
  .skill-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    background:var(--c-surface-inset);color:var(--c-text-muted);font-size:13px;font-weight:500}
  .skill-chip button{border:none;background:none;color:inherit;cursor:pointer;padding:0;display:inline-flex;opacity:.7}
  .skill-chip button:hover{opacity:1}

  .link-row{display:flex;gap:8px;margin-bottom:10px}
  .link-row input{height:44px;padding:0 12px;border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-md);
    background:var(--c-surface);font-family:var(--pp-font);font-size:14.5px;color:var(--c-text)}
  .link-row input:focus{outline:none;border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .link-row .label-input{width:130px;flex:none}
  .link-row .url-input{flex:1;min-width:0}
  .link-row button{width:44px;height:44px;flex:none;border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-md);
    background:var(--c-surface);color:var(--c-text-subtle);cursor:pointer;font-size:18px}
  .link-row button:hover{background:var(--c-bg-sunken)}

  .file-block{border:1.5px dashed var(--c-border-strong);border-radius:var(--pp-radius-lg);padding:24px;
    text-align:center;background:var(--c-bg-sunken);margin-bottom:8px}
  .file-block svg{color:var(--c-text-faint)}
  .file-chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;
    background:var(--c-good-bg);color:var(--c-good-text);font-size:13.5px;font-weight:600}
  .file-chip[hidden]{display:none}

  .err-text{margin:10px 0 0;font-size:13.5px;color:var(--c-bad-text)}
  #projectsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
  @media(max-width:520px){#projectsGrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="pp-nav" data-shell="focused"></div>

<main><div class="wizard" id="wizard"><div class="state-panel"><p>Loading…</p></div></div></main>

<div id="pp-footer" data-variant="legal"></div>

<script src="pp-nav.js"></script>
<script src="pp-footer.js"></script>
<script src="featured-projects.js"></script>
<script>
(function(){
  "use strict";

  var token = localStorage.getItem("kazi_designer_token");
  if (!token) { location.href = "/signin?view=signup"; return; }

  var DISCIPLINES = ["Product Design","UX Design","UI Design","Brand Design","Motion Design","Design Systems","UX Research","Graphic Design","Game Design","Sound Design","Instructional Design","Fashion Design","Interior Design"];
  var MAX_DISCIPLINES = 5;
  var MAX_SKILLS = 7;
  var MAX_LINKS = 8;
  var AVATAR_COUNT = 28;
  var DEFAULT_AVATAR = "/avatars/avatar-1.png";
  var TOTAL_STEPS = 7;

  var me = null;
  var step = 0;
  var selectedDisciplines = [];
  var selectedSkills = [];

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "Authorization": "Bearer " + token });
    var res = await fetch(path, opts);
    if (!res.ok) {
      var body = await res.json().catch(function(){ return {}; });
      throw new Error(body.detail || "Request failed (" + res.status + ")");
    }
    return res.json();
  }

  function dotsHtml(){
    var out = "";
    for (var i = 0; i < TOTAL_STEPS; i++) {
      out += '<div class="dot' + (i === step ? " -active" : (i < step ? " -done" : "")) + '"></div>';
    }
    return '<div class="wizard-top"><button type="button" class="finish-later" id="finishLaterBtn">Save and finish later</button></div>' +
      '<div class="dots">' + out + '</div>' + strengthMeterHtml();
  }

  // Seven roughly-equal factors, matching the shape of a real profile
  // rather than the wizard's own step order — a photo doesn't move this,
  // since avatar-1 is a real default, not a placeholder that signals
  // incompleteness the way a blank name or bio does.
  function strengthPct(){
    var field = function(id, fallback){ var el = document.getElementById(id); return el ? el.value : fallback; };
    var n = 0;
    if ((field("fName", me.display_name) || "").trim()) n += 14;
    if ((field("fHeadline", me.headline) || "").trim()) n += 14;
    if ((field("fBio", me.bio) || "").trim()) n += 14;
    if ((step === 1 ? selectedDisciplines : (me.discipline || [])).length) n += 14;
    if ((step === 1 ? selectedSkills : (me.skills || [])).length) n += 14;
    if ((me.links || []).length || (me.projects || []).length) n += 16;
    if ((field("fLocation", me.location) || "").trim()) n += 14;
    return Math.min(100, n);
  }
  function strengthNote(pct){
    if (pct < 40) return "A headline and one line of bio move this fastest.";
    if (pct < 80) return "Add a project or a link and you're in good shape.";
    return "Strong enough to share with a hiring manager.";
  }
  function strengthMeterHtml(){
    var pct = strengthPct();
    return '<div class="strength-meter"><div class="row"><span>Profile strength</span><span>' + pct + '%</span></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<p class="note">' + strengthNote(pct) + '</p></div>';
  }
  function updateStrengthMeter(){
    var meter = document.querySelector(".strength-meter");
    if (!meter) return;
    var pct = strengthPct();
    meter.querySelector(".row span:last-child").textContent = pct + "%";
    meter.querySelector(".bar span").style.width = pct + "%";
    meter.querySelector(".note").textContent = strengthNote(pct);
  }
  async function saveAndFinishLater(){
    var btn = document.getElementById("finishLaterBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      if (step === 1 || step === 2 || step === 3) await saveProfileFields();
    } catch (e) { /* best-effort — don't block leaving on a save hiccup */ }
    location.href = "/dashboard";
  }

  function navHtml(backStep, nextId, nextLabel, opts){
    opts = opts || {};
    return '<div class="step-nav">' +
      (backStep !== null ? '<button type="button" class="pp-btn pp-btn-tertiary" id="backBtn" data-back="' + backStep + '">Back</button>' : (opts.skipId ? '<button type="button" class="skip-link" id="' + opts.skipId + '">Skip for now</button>' : "<span></span>")) +
      '<button type="button" class="pp-btn pp-btn-primary" id="' + nextId + '">' + nextLabel + '</button>' +
    '</div>';
  }

  // ---- Step 0: Photo ----
  function renderPhotoStep(){
    var current = me.photo_path || DEFAULT_AVATAR;
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Add a photo</h1><p class="step-sub">A face helps employers connect a name to your work. Optional — you can skip this.</p>' +
      '<div class="photo-block">' +
        '<img id="avatarPreview" src="' + escapeHtml(current) + '" alt="">' +
        '<button type="button" class="pp-btn pp-btn-secondary" id="photoUploadBtn">Upload a photo</button>' +
        '<input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.webp" style="display:none">' +
        '<p class="hint">JPG, PNG, or WebP. Up to 3MB.</p>' +
        '<p class="err-text" id="photoErr" hidden></p>' +
      '</div>' +
      '<div class="divider-or"><span></span><span class="txt">or pick an avatar</span><span></span></div>' +
      '<div class="avatar-grid" id="avatarGrid"></div>' +
      navHtml(null, "photoNextBtn", "Next", { skipId: null });

    renderAvatarGrid();
    document.getElementById("photoUploadBtn").addEventListener("click", function(){ document.getElementById("photoInput").click(); });
    document.getElementById("photoInput").addEventListener("change", async function(){
      var file = document.getElementById("photoInput").files[0];
      if (!file) return;
      var errEl = document.getElementById("photoErr");
      errEl.hidden = true;
      var fd = new FormData();
      fd.append("file", file);
      try {
        var res = await api("/api/designers/me/photo", { method: "POST", body: fd });
        me.photo_path = res.photo_path;
        document.getElementById("avatarPreview").src = res.photo_path + "?t=" + Date.now();
        renderAvatarGrid();
      } catch (e) {
        errEl.textContent = e.message; errEl.hidden = false;
      }
    });
    document.getElementById("photoNextBtn").addEventListener("click", function(){ goTo(1); });
  }
  function renderAvatarGrid(){
    var grid = document.getElementById("avatarGrid");
    var current = me.photo_path || DEFAULT_AVATAR;
    var html = "";
    for (var n = 1; n <= AVATAR_COUNT; n++) {
      var path = "/avatars/avatar-" + n + ".png";
      html += '<button type="button" class="avatar-option' + (current === path ? " -selected" : "") + '" data-avatar="' + path + '" aria-label="Avatar ' + n + '">' +
        '<img src="' + path + '" alt=""><span class="avatar-check">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span></button>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll(".avatar-option").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var path = btn.getAttribute("data-avatar");
        if (path === (me.photo_path || DEFAULT_AVATAR)) return;
        try {
          await api("/api/designers/me/avatar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ photo_path: path }) });
          me.photo_path = path;
          document.getElementById("avatarPreview").src = path;
          renderAvatarGrid();
        } catch (e) {}
      });
    });
  }

  // ---- Step 1: About you ----
  function renderAboutStep(){
    selectedDisciplines = (me.discipline || []).slice();
    selectedSkills = (me.skills || []).slice();
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">About you</h1><p class="step-sub">This is how you\'ll show up in the directory.</p>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Name</label>' +
        '<span class="pp-field-input"><input id="fName" type="text" value="' + escapeHtml(me.display_name || "") + '"></span></div>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Professional headline <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
        '<span class="pp-field-input"><input id="fHeadline" type="text" maxlength="120" placeholder="e.g. Senior Product Designer" value="' + escapeHtml(me.headline || "") + '"></span></div>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Job function <span style="font-weight:400;color:var(--c-text-faint)">(up to 5)</span></label>' +
        '<div class="chip-select" id="disciplineChips"></div>' +
        '<p class="err-text" id="disciplineErr" hidden>Choose at least one job function.</p></div>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Skills <span style="font-weight:400;color:var(--c-text-faint)">(up to 7)</span></label>' +
        '<div class="tag-box" id="skillBox"><span id="skillChips"></span><input id="skillInput" type="text" placeholder="Type a skill and press Enter"></div></div>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Years of experience <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
        '<span class="pp-field-input"><input id="fYears" type="text" maxlength="20" placeholder="e.g. 5+ years" value="' + escapeHtml(me.years_experience || "") + '"></span></div>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Availability <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
        '<span class="pp-field-input"><select id="fAvail">' +
          '<option value="">Not specified</option>' +
          ["Available", "Open to offers", "Not available"].map(function(v){
            return '<option value="' + v + '"' + (me.availability_status === v ? " selected" : "") + '>' + v + '</option>';
          }).join("") +
        '</select></span></div>' +
      '<div class="pp-field" style="margin-bottom:8px"><label class="pp-field-label">Location <span style="font-weight:400;color:var(--c-text-faint)">(city, or "Remote")</span></label>' +
        '<span class="pp-field-input"><input id="fLocation" type="text" placeholder="e.g. Nairobi, Kenya" value="' + escapeHtml(me.location || "") + '"></span></div>' +
      '<p class="err-text" id="aboutErr" hidden></p>' +
      navHtml(0, "aboutNextBtn", "Next");

    renderDisciplineChips();
    renderSkillChips();
    var skillInput = document.getElementById("skillInput");
    skillInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); addSkill(skillInput.value); skillInput.value = ""; }
    });
    ["fName", "fHeadline", "fLocation"].forEach(function(id){
      document.getElementById(id).addEventListener("input", updateStrengthMeter);
    });
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(0); });
    document.getElementById("aboutNextBtn").addEventListener("click", async function(){
      if (skillInput.value.trim()) { addSkill(skillInput.value); skillInput.value = ""; }
      var errEl = document.getElementById("aboutErr");
      errEl.hidden = true;
      if (!document.getElementById("fName").value.trim()) { errEl.textContent = "Enter your name."; errEl.hidden = false; return; }
      if (!selectedDisciplines.length) { document.getElementById("disciplineErr").hidden = false; return; }
      document.getElementById("disciplineErr").hidden = true;
      var btn = document.getElementById("aboutNextBtn");
      btn.disabled = true;
      try { await saveProfileFields(); goTo(2); }
      catch (e) { errEl.textContent = e.message; errEl.hidden = false; }
      finally { btn.disabled = false; }
    });
  }
  function renderDisciplineChips(){
    var box = document.getElementById("disciplineChips");
    var atCap = selectedDisciplines.length >= MAX_DISCIPLINES;
    box.innerHTML = DISCIPLINES.map(function(d){
      var active = selectedDisciplines.indexOf(d) !== -1;
      return '<button type="button" class="pick-chip' + (active ? " -active" : "") + '" data-d="' + escapeHtml(d) + '"' + (!active && atCap ? " disabled" : "") + '>' + escapeHtml(d) + '</button>';
    }).join("");
    box.querySelectorAll(".pick-chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d = btn.getAttribute("data-d");
        var idx = selectedDisciplines.indexOf(d);
        if (idx !== -1) selectedDisciplines.splice(idx, 1);
        else if (selectedDisciplines.length < MAX_DISCIPLINES) selectedDisciplines.push(d);
        renderDisciplineChips();
        updateStrengthMeter();
      });
    });
  }
  function renderSkillChips(){
    var box = document.getElementById("skillChips");
    box.innerHTML = selectedSkills.map(function(s){
      return '<span class="skill-chip">' + escapeHtml(s) + '<button type="button" data-s="' + escapeHtml(s) + '" aria-label="Remove ' + escapeHtml(s) + '">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>';
    }).join("");
    box.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedSkills = selectedSkills.filter(function(s){ return s !== btn.getAttribute("data-s"); });
        renderSkillChips();
        updateStrengthMeter();
      });
    });
    var input = document.getElementById("skillInput");
    var atCap = selectedSkills.length >= MAX_SKILLS;
    input.disabled = atCap;
    input.placeholder = atCap ? "Maximum " + MAX_SKILLS + " skills" : "Type a skill and press Enter";
  }
  function addSkill(raw){
    var value = raw.trim().slice(0, 40);
    if (!value || selectedSkills.length >= MAX_SKILLS) return;
    if (selectedSkills.some(function(s){ return s.toLowerCase() === value.toLowerCase(); })) return;
    selectedSkills.push(value);
    renderSkillChips();
    updateStrengthMeter();
  }
  // Every step (About/Contact/Bio) re-sends the full PUT /me payload, since
  // that's one endpoint for all of it — but only the current step's fields
  // exist in the DOM. Reading a missing field's fallback from `me` only
  // works if `me` reflects what was actually last saved, so this updates
  // `me` from the DOM first, then sends `me` — otherwise a later step's
  // save would silently revert an earlier step's edit back to whatever
  // `me` was at page load.
  async function saveProfileFields(){
    var get = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : null; };
    if (get("fName") !== null) me.display_name = get("fName");
    if (get("fHeadline") !== null) me.headline = get("fHeadline");
    if (get("fYears") !== null) me.years_experience = get("fYears");
    if (document.getElementById("fAvail")) me.availability_status = document.getElementById("fAvail").value;
    if (get("fLocation") !== null) me.location = get("fLocation");
    if (get("fPhone") !== null) me.phone = get("fPhone");
    if (get("fContactEmail") !== null) me.contact_email = get("fContactEmail");
    if (get("fBio") !== null) me.bio = get("fBio");
    me.discipline = selectedDisciplines;
    me.skills = selectedSkills;

    await api("/api/designers/me", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        display_name: me.display_name || "", headline: me.headline || "",
        discipline: me.discipline, skills: me.skills,
        years_experience: me.years_experience || "", availability_status: me.availability_status || "",
        location: me.location || "", phone: me.phone || "",
        contact_email: me.contact_email || "", bio: me.bio || ""
      })
    });
  }

  // ---- Step 2: Contact ----
  function renderContactStep(){
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Get in touch</h1><p class="step-sub">Optional. Shown publicly on your profile so employers can reach you directly, separate from your login email.</p>' +
      '<div class="pp-field" style="margin-bottom:16px"><label class="pp-field-label">Phone <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
        '<span class="pp-field-input"><input id="fPhone" type="tel" placeholder="+254 700 123 456" value="' + escapeHtml(me.phone || "") + '"></span></div>' +
      '<div class="pp-field" style="margin-bottom:8px"><label class="pp-field-label">Public contact email <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
        '<span class="pp-field-input"><input id="fContactEmail" type="email" placeholder="e.g. hello@yourname.design" value="' + escapeHtml(me.contact_email || "") + '"></span></div>' +
      '<p class="err-text" id="contactErr" hidden></p>' +
      navHtml(1, "contactNextBtn", "Next");
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(1); });
    document.getElementById("contactNextBtn").addEventListener("click", async function(){
      var errEl = document.getElementById("contactErr");
      errEl.hidden = true;
      var btn = document.getElementById("contactNextBtn");
      btn.disabled = true;
      try { await saveProfileFields(); goTo(3); }
      catch (e) { errEl.textContent = e.message; errEl.hidden = false; }
      finally { btn.disabled = false; }
    });
  }

  // ---- Step 3: Bio ----
  function renderBioStep(){
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Bio</h1><p class="step-sub">A few sentences about you and the work you do. Optional, but profiles with a bio get more attention.</p>' +
      '<textarea id="fBio" class="pp-textarea" rows="5" placeholder="Product designer based in Nairobi, focused on fintech and mobile-first experiences...">' + escapeHtml(me.bio || "") + '</textarea>' +
      '<p class="err-text" id="bioErr" hidden></p>' +
      navHtml(2, "bioNextBtn", "Next");
    document.getElementById("fBio").addEventListener("input", updateStrengthMeter);
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(2); });
    document.getElementById("bioNextBtn").addEventListener("click", async function(){
      var errEl = document.getElementById("bioErr");
      errEl.hidden = true;
      var btn = document.getElementById("bioNextBtn");
      btn.disabled = true;
      try { await saveProfileFields(); goTo(4); }
      catch (e) { errEl.textContent = e.message; errEl.hidden = false; }
      finally { btn.disabled = false; }
    });
  }

  // ---- Step 4: Links ----
  function renderLinksStep(){
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Links</h1><p class="step-sub">Portfolio, LinkedIn, Dribbble, case studies, up to 8.</p>' +
      '<div id="linkRows"></div>' +
      '<button type="button" class="pp-btn pp-btn-tertiary" id="addLinkBtn" style="margin-bottom:8px">+ Add a link</button>' +
      '<p class="err-text" id="linksErr" hidden></p>' +
      navHtml(3, "linksNextBtn", "Next");
    var links = me.links && me.links.length ? me.links : [{ label: "", url: "" }];
    links.forEach(function(l){ addLinkRow(l.label, l.url); });
    document.getElementById("addLinkBtn").addEventListener("click", function(){ addLinkRow("", ""); });
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(3); });
    document.getElementById("linksNextBtn").addEventListener("click", async function(){
      var errEl = document.getElementById("linksErr");
      errEl.hidden = true;
      var btn = document.getElementById("linksNextBtn");
      btn.disabled = true;
      try {
        var rows = currentLinkRows();
        await api("/api/designers/me/links", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ links: rows }) });
        me.links = rows;
        goTo(5);
      } catch (e) { errEl.textContent = e.message; errEl.hidden = false; }
      finally { btn.disabled = false; }
    });
  }
  function currentLinkRows(){
    return Array.from(document.querySelectorAll("#linkRows .link-row")).map(function(row){
      var inputs = row.querySelectorAll("input");
      return { label: inputs[0].value.trim(), url: inputs[1].value.trim() };
    }).filter(function(l){ return l.label && l.url; });
  }
  function addLinkRow(label, url){
    var box = document.getElementById("linkRows");
    if (box.children.length >= MAX_LINKS) return;
    var row = document.createElement("div");
    row.className = "link-row";
    row.innerHTML = '<input class="label-input" placeholder="Portfolio" value="' + escapeHtml(label) + '">' +
      '<input class="url-input" placeholder="https://..." value="' + escapeHtml(url) + '">' +
      '<button type="button" aria-label="Remove link">×</button>';
    row.querySelector("button").addEventListener("click", function(){ row.remove(); });
    box.appendChild(row);
  }

  // ---- Step 5: Resume ----
  function renderResumeStep(){
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Résumé <span style="font-weight:400;color:var(--c-text-faint);font-size:20px">(optional)</span></h1>' +
      '<p class="step-sub">Upload a résumé now and you\'ll be able to check it against any job in one click. Skip this and add one later from Edit Profile whenever you like.</p>' +
      '<div class="file-block">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"></path></svg>' +
        '<p style="margin:10px 0 0;font-size:14px;font-weight:600">PDF or DOCX, under 5MB</p>' +
        '<button type="button" class="pp-btn pp-btn-secondary" id="resumeUploadBtn" style="margin-top:12px">Upload résumé</button>' +
        '<input type="file" id="resumeInput" accept=".pdf,.docx" style="display:none">' +
        (me.resume_filename ? '<div class="file-chip" id="resumeChip">' + escapeHtml(me.resume_filename) + '</div>' : '<div class="file-chip" id="resumeChip" hidden></div>') +
      '</div>' +
      '<p class="err-text" id="resumeErr" hidden></p>' +
      navHtml(4, "resumeNextBtn", "Next");
    document.getElementById("resumeUploadBtn").addEventListener("click", function(){ document.getElementById("resumeInput").click(); });
    document.getElementById("resumeInput").addEventListener("change", async function(){
      var file = document.getElementById("resumeInput").files[0];
      if (!file) return;
      var errEl = document.getElementById("resumeErr");
      errEl.hidden = true;
      var fd = new FormData();
      fd.append("file", file);
      try {
        var res = await api("/api/designers/me/resume", { method: "POST", body: fd });
        me.resume_filename = res.resume_filename;
        var chip = document.getElementById("resumeChip");
        chip.textContent = res.resume_filename;
        chip.hidden = false;
      } catch (e) { errEl.textContent = e.message; errEl.hidden = false; }
    });
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(4); });
    document.getElementById("resumeNextBtn").addEventListener("click", function(){ goTo(6); });
  }

  // ---- Step 6: Featured projects (reuses the real shared component) ----
  function renderProjectsStep(){
    var wizard = document.getElementById("wizard");
    wizard.innerHTML = dotsHtml() +
      '<h1 class="step-title">Featured projects <span style="font-weight:400;color:var(--c-text-faint);font-size:20px">(optional)</span></h1>' +
      '<p class="step-sub">Add up to 6 projects to showcase your best work. Skip this and add projects later from your dashboard.</p>' +
      '<div id="projectsGrid"></div>' +
      '<p class="err-text" id="finishErr" hidden></p>' +
      navHtml(5, "finishBtn", "Finish");
    window.FeaturedProjects.mount(document.getElementById("projectsGrid"), {
      projects: me.projects || [], variant: "manage",
      onChange: function(list){ me.projects = list; }
    });
    document.getElementById("backBtn").addEventListener("click", function(){ goTo(5); });
    document.getElementById("finishBtn").addEventListener("click", async function(){
      var errEl = document.getElementById("finishErr");
      errEl.hidden = true;
      var btn = document.getElementById("finishBtn");
      btn.disabled = true;
      var original = btn.textContent;
      btn.textContent = "Saving…";
      try {
        await api("/api/designers/me/complete-onboarding", { method: "POST" });
        location.href = "/designers/" + encodeURIComponent(me.handle || me.id);
      } catch (e) {
        errEl.textContent = e.message; errEl.hidden = false;
        btn.disabled = false; btn.textContent = original;
      }
    });
  }

  function goTo(n){
    step = n;
    window.scrollTo({ top: 0, behavior: "smooth" });
    render();
  }
  function render(){
    if (step === 0) renderPhotoStep();
    else if (step === 1) renderAboutStep();
    else if (step === 2) renderContactStep();
    else if (step === 3) renderBioStep();
    else if (step === 4) renderLinksStep();
    else if (step === 5) renderResumeStep();
    else renderProjectsStep();
    document.getElementById("finishLaterBtn").addEventListener("click", saveAndFinishLater);
  }

  async function init(){
    try {
      me = await api("/api/designers/me");
    } catch (e) {
      localStorage.removeItem("kazi_designer_token");
      location.href = "/signin?view=signup";
      return;
    }
    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
