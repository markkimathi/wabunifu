  function wireEmployerAccount(){
    var form = document.getElementById("accountForm");
    if (form) form.addEventListener("submit", async function(e){
      e.preventDefault();
      var err = document.getElementById("accountErr");
      var btn = document.getElementById("accountSaveBtn");
      err.hidden = true;
      btn.disabled = true;
      try {
        await api("/api/employers/me", { method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name: document.getElementById("aName").value.trim(),
                                 role_title: document.getElementById("aRole").value.trim() }) });
        me = await api("/api/employers/me");
        toast("Saved.");
        render();
      } catch (e2) {
        err.textContent = e2.message || "Couldn't save that.";
        err.hidden = false;
        btn.disabled = false;
      }
    });

    var vBtn = document.getElementById("empVerifyBtn");
    if (vBtn) {
      var input = document.getElementById("empVerifyCode");
      var err = document.getElementById("empVerifyErr");
      var note = document.getElementById("empVerifyNote");
      vBtn.addEventListener("click", async function(){
        var code = input.value.trim();
        err.hidden = true; note.hidden = true;
        if (!/^\d{6}$/.test(code)) { err.textContent = "That code is six digits."; err.hidden = false; input.focus(); return; }
        vBtn.disabled = true;
        try {
          await api("/api/employers/me/verify-email", { method: "POST",
            headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) });
          me.email_verified = true;
          toast("Email verified.");
          render();
        } catch (e3) {
          err.textContent = e3.message || "That code is incorrect or has expired.";
          err.hidden = false;
          vBtn.disabled = false;
        }
      });
      document.getElementById("empResendBtn").addEventListener("click", async function(e4){
        var b = e4.currentTarget;
        b.disabled = true; err.hidden = true;
        try {
          await api("/api/employers/me/resend-verification", { method: "POST" });
          note.textContent = "Sent. It can take a minute — check your spam folder if it doesn't arrive.";
          note.hidden = false;
        } catch (e5) {
          err.textContent = "Couldn't send that. Try again in a moment.";
          err.hidden = false;
          b.disabled = false;
        }
      });
    }

    var del = document.getElementById("empDeleteBtn");
    if (del) del.addEventListener("click", async function(){
      var ok = window.showPPConfirm ? await window.showPPConfirm({
        title: "Close your account?",
        description: "You're removed from this company. Its page, listings and applicants stay. This can't be undone.",
        confirmLabel: "Close account", safeLabel: "Keep my account", danger: true }) : true;
      if (!ok) return;
      try {
        await api("/api/employers/me", { method: "DELETE" });
        localStorage.removeItem("kazi_employer_token");
        location.href = "/";
      } catch (e6) {
        // The last owner of a company is deliberately blocked from leaving it
        // with nobody to run it, and that reason is worth showing in full.
        toast(e6.message || "Couldn't close that account.");
      }
    });
  }

  function renderBilling(){
    return '<div class="section-head"><h2>Billing</h2></div>' +
      '<div class="billing-panel"><h3>Hiring tools are free right now</h3>' +
      '<p>Kazi isn\'t charging for posting roles or managing applicants yet. If that changes, you\'ll see it here first — nothing changes automatically, and nothing is billed today.</p></div>';
  }

  // ---------------- Data + wiring ----------------

  var cache = { listings: [], applicants: [], team: null, conversations: [], messages: [] };

  async function loadSection(){
    var content = document.getElementById("content");
    if (section === "listings" || section === "applicants") {
      var data = await api("/api/employers/me/listings");
      cache.listings = data.listings;
    }
    if (section === "applicants" && applicantListingId) {
      var adata = await api("/api/employers/me/listings/" + applicantListingId + "/applicants");
      cache.applicants = adata.applicants;
    }
    if (section === "team") {
      cache.team = await api("/api/employers/me/team");
    }
    if (section === "listings") {
      try { cache.perf = (await api("/api/employers/me/role-performance")).roles; }
      catch (e) { cache.perf = []; }
    }
    if (section === "talent") {
      // Both lists every time: the shortlist count sits on the tab, and search
      // results need to know who is already on it.
      var qs = new URLSearchParams();
      if (talentQuery) qs.set("q", talentQuery);
      if (talentFilters.discipline) qs.set("discipline", talentFilters.discipline);
      if (talentFilters.open_to) qs.set("open_to", talentFilters.open_to);
      var t = await api("/api/employers/me/talent" + (qs.toString() ? "?" + qs : ""));
      cache.talent = t.designers;
      var sl = await api("/api/employers/me/shortlist");
      cache.shortlist = sl.designers;
    }
    if (section === "messages") {
      var convData = await api("/api/employers/me/conversations");
      cache.conversations = convData.conversations;
    }
    render();
  }

  /* ---------------- Talent ----------------
     The directory was always public; what was missing was any route to it from
     the hiring side, so a company could post a role and never go looking for
     anyone to fill it. Two tabs because they are genuinely different jobs:
     searching, and returning to people you already flagged. */
  var talentTab = "search";
  var talentQuery = "";
  var talentFilters = { discipline: "", country: "", open_to: "" };

  function talentCardHtml(d){
    var openTo = (d.open_to || []).map(function(o){
      return '<span class="pp-chip">' + escapeHtml(o) + '</span>';
    }).join("");
    var disc = (d.discipline || []).slice(0, 3).map(function(x){
      return '<span class="pp-chip">' + escapeHtml(x) + '</span>';
    }).join("");
    var avail = d.availability_status || "";
    var availClass = /available|open/i.test(avail) ? "-good" : "-neutral";
    return '<div class="talent-card">' +
      '<div class="tc-head">' +
        (d.photo_path
          ? '<img class="tc-photo" src="' + escapeHtml(d.photo_path) + '" alt="">'
          : '<span class="pp-avatar -md">' + escapeHtml(initialsOf(d.display_name)) + '</span>') +
        '<div class="tc-id">' +
          '<h3>' + escapeHtml(d.display_name) + '</h3>' +
          '<p>' + escapeHtml([d.headline, d.location].filter(Boolean).join(" · ") || "Designer") + '</p>' +
        '</div>' +
        (avail ? '<span class="pp-status ' + availClass + '">' + escapeHtml(avail) + '</span>' : "") +
      '</div>' +
      (d.bio ? '<p class="tc-bio">' + escapeHtml(d.bio) + '</p>' : "") +
      ((disc || openTo) ? '<div class="tc-tags">' + disc + openTo + '</div>' : "") +
      (d.note ? '<p class="tc-note">' + escapeHtml(d.note) + '</p>' : "") +
      '<div class="tc-actions">' +
        '<a class="pp-btn pp-btn-secondary" href="/designers/' + encodeURIComponent(d.handle || d.id) + '" target="_blank" rel="noopener">View profile</a>' +
        '<button type="button" class="pp-btn ' + (d.shortlisted ? "pp-btn-secondary" : "pp-btn-secondary") +
          '" data-shortlist="' + d.id + '" data-on="' + (d.shortlisted ? "1" : "0") + '">' +
          (d.shortlisted ? "Shortlisted ✓" : "Shortlist") + '</button>' +
        '<button type="button" class="pp-btn pp-btn-primary" data-msg-designer="' + d.id +
          '" data-msg-name="' + escapeHtml(d.display_name) + '">Message</button>' +
      '</div>' +
    '</div>';
  }

  function renderTalent(){
    var list = talentTab === "search" ? (cache.talent || []) : (cache.shortlist || []);
    var body = '<div class="section-head"><h2>Talent</h2></div>';

    body += '<div class="talent-tabs">' +
      '<button type="button" class="pp-tab-chip' + (talentTab === "search" ? " -active" : "") + '" data-talent-tab="search">Search</button>' +
      '<button type="button" class="pp-tab-chip' + (talentTab === "shortlist" ? " -active" : "") + '" data-talent-tab="shortlist">Shortlist' +
        (cache.shortlist && cache.shortlist.length ? ' <span class="pp-tab-count">' + cache.shortlist.length + '</span>' : "") +
      '</button></div>';

    if (talentTab === "search") {
      body += '<div class="talent-search">' +
        '<div class="pp-field-input"><input id="talentQ" placeholder="Name, skill, headline…" value="' + escapeHtml(talentQuery) + '"></div>' +
        '<select id="talentDiscipline"><option value="">Any discipline</option>' +
          DISCIPLINES.map(function(x){
            return '<option value="' + escapeHtml(x) + '"' + (talentFilters.discipline === x ? " selected" : "") + '>' + escapeHtml(x) + '</option>';
          }).join("") + '</select>' +
        '<select id="talentOpenTo"><option value="">Any work type</option>' +
          ["Full-time", "Contract", "Freelance", "Internship"].map(function(x){
            return '<option value="' + escapeHtml(x) + '"' + (talentFilters.open_to === x ? " selected" : "") + '>' + escapeHtml(x) + '</option>';
          }).join("") + '</select>' +
        '<button type="button" class="pp-btn pp-btn-primary" id="talentGo">Search</button>' +
      '</div>';
    }

    if (!list.length) {
      body += '<div class="pp-empty">' +
        '<h3>' + (talentTab === "search" ? "No designers match that" : "Nobody shortlisted yet") + '</h3>' +
        '<p>' + (talentTab === "search"
          ? "Try a broader search — the directory is still growing, so fewer filters usually finds more."
          : "Shortlist someone from Search and they'll wait here, with the note you left about why.") + '</p>' +
      '</div>';
    } else {
      body += '<div class="talent-grid">' + list.map(talentCardHtml).join("") + '</div>';
    }
    return body;
  }

  function render(){
    var content = document.getElementById("content");
    var banner = me.is_pending_approval
      ? '<div class="pending-banner">Someone at ' + escapeHtml(me.company ? me.company.name : "this company") + ' needs to approve you before you can post or manage anything here. You can still look around.</div>'
      : "";
    var head = '<div class="dash-head"><div><h1>' + escapeHtml(me.company ? me.company.name : "Hiring") + '</h1><p>Signed in as ' + escapeHtml(me.full_name) + '</p></div></div>' + banner;
    var body = "";
    if (section === "listings") body = renderListings(cache);
    else if (section === "applicants") body = renderApplicants(cache);
    else if (section === "talent") body = renderTalent();
    else if (section === "messages") body = renderMessages();
    else if (section === "team") body = renderTeam(cache);
    else if (section === "company") body = renderCompany(cache);
    else if (section === "billing") body = renderBilling();
    else body = renderEmployerAccount();
    content.innerHTML = head + body;
    document.getElementById("dashRail").innerHTML = railHtml();
    document.getElementById("dashChipsMobile").innerHTML = chipsMobileHtml();
    wire();
    wireWizardCounters();
    if (section === "account") wireEmployerAccount();
    if (section === "messages" && cache.conversations.length) loadThread(activeThreadId || cache.conversations[0].id);
  }

  function setSection(s){
    section = s;
    try {
      var url = new URL(location.href);
      if (s === "listings") url.searchParams.delete("tab"); else url.searchParams.set("tab", s);
      history.replaceState(null, "", url);
    } catch (e) {}
    showNewListing = false; wizardData = null; showNewApplicant = false;
    loadSection();
  }

  function showErr(id, msg){
    var el = document.getElementById(id);
    if (!el) return;
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function wireTalent(){
    document.querySelectorAll("[data-talent-tab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        talentTab = btn.getAttribute("data-talent-tab");
        render();
      });
    });
    var go = document.getElementById("talentGo");
    if (go) {
      var run = function(){
        talentQuery = document.getElementById("talentQ").value.trim();
        talentFilters.discipline = document.getElementById("talentDiscipline").value;
        talentFilters.open_to = document.getElementById("talentOpenTo").value;
        loadSection();
      };
      go.addEventListener("click", run);
      document.getElementById("talentQ").addEventListener("keydown", function(e){
        if (e.key === "Enter") run();
      });
    }
    document.querySelectorAll("[data-shortlist]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-shortlist");
        var on = btn.getAttribute("data-on") === "1";
        btn.disabled = true;
        try {
          if (on) {
            await api("/api/employers/me/shortlist/" + id, { method: "DELETE" });
          } else {
            // The note is the reason they were saved — the thing that otherwise
            // ends up in someone's private doc and is lost to the rest of the team.
            var note = window.prompt("Why this designer? (optional, your team will see it)", "") || "";
            await api("/api/employers/me/shortlist", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ designer_id: Number(id), note: note })
            });
          }
          await loadSection();
        } catch (e) { btn.disabled = false; }
      });
    });
    document.querySelectorAll("[data-msg-designer]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-msg-designer");
        var name = btn.getAttribute("data-msg-name");
        var body = window.prompt("Message to " + name + " — say which role and why them.", "");
        if (!body || !body.trim()) return;
        btn.disabled = true;
        try {
          await api("/api/employers/me/conversations", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ designer_id: Number(id), body: body.trim() })
          });
          setSection("messages");
        } catch (e) { btn.disabled = false; }
      });
    });
  }

  function wire(){
    document.querySelectorAll("[data-section]").forEach(function(btn){
      btn.addEventListener("click", function(){ setSection(btn.getAttribute("data-section")); });
    });
    wireTalent();
    renderListingSkills();
    document.querySelectorAll("[data-rail-signout]").forEach(function(btn){
      btn.addEventListener("click", function(){ window.PathPixelNav.signOut("employer"); });
    });

    // Listings
    var addListingBtn = document.getElementById("addListingBtn");
    if (addListingBtn) addListingBtn.addEventListener("click", function(){
      cache.editingListing = null; wizardData = blankWizardData(); wizardStep = 1; wizardMax = 1;
      showNewListing = true; render();
    });
    var listingCancelBtn = document.getElementById("listingCancelBtn");
    if (listingCancelBtn) listingCancelBtn.addEventListener("click", function(){ showNewListing = false; wizardData = null; render(); });
    document.querySelectorAll("[data-edit-listing]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = parseInt(btn.getAttribute("data-edit-listing"), 10);
        cache.editingListing = cache.listings.filter(function(l){ return l.id === id; })[0];
        wizardData = wizardDataFromListing(cache.editingListing);
        wizardStep = 1; wizardMax = 3;
        showNewListing = true;
        render();
      });
    });
    document.querySelectorAll("[data-close-listing]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-close-listing");
        var ok = await window.showPPConfirm({
          title: "Close this listing?", description: "It comes off the board. Applicants tracked against it stay in your history.",
          confirmLabel: "Close listing", safeLabel: "Keep it open", danger: false
        });
        if (!ok) return;
        await api("/api/employers/me/listings/" + id, { method: "DELETE" });
        toast("Listing closed.");
        loadSection();
      });
    });
    wireWizardStep();
    document.querySelectorAll("[data-goto-step]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var n = parseInt(btn.getAttribute("data-goto-step"), 10);
        if (n > wizardMax) return;
        readWizardStepFields();
        wizardStep = n;
        render();
      });
    });
    var wizBackBtn = document.getElementById("wizBackBtn");
    if (wizBackBtn) wizBackBtn.addEventListener("click", function(){
      readWizardStepFields();
      wizardStep -= 1;
      render();
    });
    var wizNextBtn = document.getElementById("wizNextBtn");
    if (wizNextBtn) wizNextBtn.addEventListener("click", async function(){
      readWizardStepFields();
      var errId = "wizStep" + wizardStep + "Err";
      showErr(errId, "");
      if (wizardStep === 1) {
        if (!wizardData.title || !wizardData.company || !wizardData.location || !wizardData.discipline || !wizardData.url || !wizardData.contact_email) {
          showErr(errId, "Fill in the role title, company, location, discipline and application link.");
          return;
        }
        wizardStep = 2; wizardMax = Math.max(wizardMax, 2); render();
      } else if (wizardStep === 2) {
        if (needsProof(wizardData.eligibility) && !wizardData.cross_border_note) {
          showErr(errId, "Add a sentence on how you employ someone outside your own country.");
          return;
        }
        wizardStep = 3; wizardMax = Math.max(wizardMax, 3); render();
      } else {
        if (!wizardData.description) {
          showErr(errId, "Describe what the person will actually do.");
          return;
        }
        var payload = {
          title: wizardData.title, company: wizardData.company, url: wizardData.url,
          contact_email: wizardData.contact_email, description: wizardData.description,
          location: wizardData.location, work_type: wizardData.work_type,
          discipline: wizardData.discipline, level: wizardData.level,
          eligibility: wizardData.eligibility, cross_border_note: wizardData.cross_border_note,
          accepts_applications: !!wizardData.accepts_applications,
          salary: wizardData.salary, agreed_to_terms: true
        };
        wizNextBtn.disabled = true;
        try {
          if (wizardData.id) {
            await api("/api/employers/me/listings/" + wizardData.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            toast("Saved. Back in the review queue.");
          } else {
            await api("/api/employers/me/listings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            toast("Submitted for review.");
          }
          showNewListing = false; wizardData = null;
          loadSection();
        } catch (err) {
          showErr(errId, err.message);
          wizNextBtn.disabled = false;
        }
      }
    });

    // Applicants
    var applicantListingSelect = document.getElementById("applicantListingSelect");
    if (applicantListingSelect) applicantListingSelect.addEventListener("change", function(){
      applicantListingId = parseInt(applicantListingSelect.value, 10);
      showNewApplicant = false;
      loadSection();
    });
    var addApplicantBtn = document.getElementById("addApplicantBtn");
    if (addApplicantBtn) addApplicantBtn.addEventListener("click", function(){ showNewApplicant = true; render(); });
    var applicantCancelBtn = document.getElementById("applicantCancelBtn");
    if (applicantCancelBtn) applicantCancelBtn.addEventListener("click", function(){ showNewApplicant = false; render(); });
    var applicantForm = document.getElementById("applicantForm");
    if (applicantForm) applicantForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("applicantErr", "");
      var name = document.getElementById("aName").value.trim();
      if (!name) { showErr("applicantErr", "Add a name."); return; }
      var payload = {
        full_name: name, email: document.getElementById("aEmail").value.trim(),
        location: document.getElementById("aLocation").value.trim(),
        portfolio_url: document.getElementById("aPortfolio").value.trim(),
        note: document.getElementById("aNote").value.trim()
      };
      var btn = document.getElementById("applicantSubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/listings/" + applicantListingId + "/applicants", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        showNewApplicant = false;
        toast("Added.");
        loadSection();
      } catch (err) {
        showErr("applicantErr", err.message);
        btn.disabled = false;
      }
    });
    document.querySelectorAll("[data-move]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-move");
        var current = cache.applicants.filter(function(a){ return String(a.id) === id; })[0];
        var stage = current.stage + parseInt(btn.getAttribute("data-dir"), 10);
        await api("/api/employers/me/applicants/" + id + "/stage", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stage: stage }) });
        loadSection();
      });
    });
    document.querySelectorAll("[data-remove-applicant]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        // Two different actions wearing one label. Removing a card you typed
        // in yourself is housekeeping. Removing someone who applied through
        // Kazi also deletes their own record of having applied — it vanishes
        // from their dashboard with no explanation — so say that plainly
        // rather than letting "comes off the board" imply it's only yours.
        var viaKazi = btn.getAttribute("data-applied-here") === "1";
        var ok = await window.showPPConfirm({
          title: viaKazi ? "Remove this application?" : "Remove this applicant?",
          description: viaKazi
            ? "They applied through Kazi, so this deletes their copy too — it disappears from their dashboard and they aren't told why. If you've decided against them, leaving the card where it is says less."
            : "Their card comes off the board. This can't be undone.",
          confirmLabel: "Remove", safeLabel: "Keep them", danger: true
        });
        if (!ok) return;
        await api("/api/employers/me/applicants/" + btn.getAttribute("data-remove-applicant"), { method: "DELETE" });
        loadSection();
      });
    });

    // Messages
    document.querySelectorAll("[data-thread]").forEach(function(btn){
      btn.addEventListener("click", function(){ loadThread(parseInt(btn.getAttribute("data-thread"), 10)).then(render); });
    });
    var composerForm = document.getElementById("composerForm");
    if (composerForm) composerForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var input = document.getElementById("composerInput");
      var body = input.value.trim();
      if (!body) return;
      input.value = "";
      await api("/api/employers/me/conversations/" + activeThreadId + "/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body: body }) });
      await loadThread(activeThreadId);
      render();
    });

    // Team
    var inviteForm = document.getElementById("inviteForm");
    if (inviteForm) inviteForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("inviteErr", "");
      var email = document.getElementById("iEmail").value.trim();
      var btn = document.getElementById("inviteSubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/team/invite", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, team_role: document.getElementById("iRole").value }) });
        toast("Invite sent.");
        document.getElementById("iEmail").value = "";
        loadSection();
      } catch (err) {
        showErr("inviteErr", err.message);
      }
      btn.disabled = false;
    });
    document.querySelectorAll("[data-approve]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        await api("/api/employers/me/team/" + btn.getAttribute("data-approve") + "/approve", { method: "POST" });
        toast("Approved.");
        loadSection();
      });
    });
    document.querySelectorAll("[data-decline-teammate]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var ok = await window.showPPConfirm({
          title: "Decline this person?", description: "Nothing is shared with them beyond a plain decline. Their account is removed.",
          confirmLabel: "Decline", safeLabel: "Keep pending", danger: true
        });
        if (!ok) return;
        await api("/api/employers/me/team/" + btn.getAttribute("data-decline-teammate") + "/decline", { method: "POST" });
        loadSection();
      });
    });
    document.querySelectorAll("[data-remove-member]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var ok = await window.showPPConfirm({
          title: "Remove this teammate?", description: "They lose access to this company's listings and applicants right away.",
          confirmLabel: "Remove", safeLabel: "Keep them", danger: true
        });
        if (!ok) return;
        try {
          await api("/api/employers/me/team/" + btn.getAttribute("data-remove-member"), { method: "DELETE" });
          loadSection();
        } catch (err) { toast(err.message); }
      });
    });

    // Company
    document.querySelectorAll('input[name="wApplyMode"]').forEach(function(r){
      r.addEventListener("change", function(){
        var kazi = r.value === "kazi" && r.checked;
        document.querySelectorAll(".apply-opt").forEach(function(o){
          o.classList.toggle("-on", o.contains(r) ? r.checked : !r.checked);
        });
        var hint = document.getElementById("wScreenHint");
        if (hint) hint.textContent = kazi
          ? "Up to three. Applicants answer these when they apply, and you read the answers next to their profile."
          : "Up to three. These appear on the listing so candidates can prepare — the answers go to your own site with the application.";
      });
    });

    var logoBtn = document.getElementById("logoUploadBtn");
    var logoInput = document.getElementById("logoInput");
    if (logoBtn && logoInput) {
      logoBtn.addEventListener("click", function(){ logoInput.click(); });
      logoInput.addEventListener("change", async function(){
        if (!logoInput.files[0]) return;
        var fd = new FormData();
        fd.append("file", logoInput.files[0]);
        logoBtn.disabled = true;
        try {
          var data = await api("/api/employers/me/company/logo", { method: "POST", body: fd });
          // The file is written to a stable path per company, so without a
          // cache-buster a re-upload keeps showing the old image.
          if (me.company) me.company.logo_path = data.logo_path + "?t=" + Date.now();
          toast("Logo updated.");
          // Re-render rather than swapping the src: the monogram and the image
          // are different elements, so the first upload has to replace one with
          // the other. Cache-bust so a re-upload actually shows.
          render();
        } catch (err) {
          toast(err.message || "Couldn't upload that.");
        } finally { logoBtn.disabled = false; }
      });
    }

    var companyForm = document.getElementById("companyForm");
    if (companyForm) companyForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("companyErr", "");
      var payload = {
        name: document.getElementById("cName").value.trim(),
        website: document.getElementById("cWebsite").value.trim(),
        blurb: document.getElementById("cBlurb").value.trim(),
        eligibility: document.getElementById("cElig").value,
        eligibility_note: document.getElementById("cEligNote").value.trim()
      };
      var btn = document.getElementById("companySubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/company", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        toast("Saved. Back in review since the company page changed.");
        me = await api("/api/employers/me");
        render();
      } catch (err) {
        showErr("companyErr", err.message);
        btn.disabled = false;
      }
    });
  }

  async function init(){
    // Returning silently on failure left the page on "Loading…" forever with
    // nothing said — same dead end the designer dashboard had.
    function fail(e, heading){
      document.getElementById("content").innerHTML =
        '<div class="state-panel"><h3>' + heading + '</h3>' +
        '<p>' + escapeHtml(e.message || "Something went wrong.") + '</p>' +
        '<p>Try again in a moment, or write to <a href="mailto:hello@odana.design">hello@odana.design</a> if it keeps happening.</p></div>';
    }
    try {
      me = await api("/api/employers/me");
    } catch (e) {
      fail(e, "We couldn't load your dashboard");
      return;
    }

    // A suspended employer can read their own account and nothing else, so
    // every section load would 403. Say what's true and stop, rather than
    // showing a generic failure for something that isn't a failure.
    if (me && me.suspended) {
      document.getElementById("content").innerHTML =
        '<div class="review-banner -bad"><h3>This account is suspended</h3>' +
        '<p>You can\'t post roles or message while that\'s the case, and your listings aren\'t showing. ' +
        'Write to <a href="mailto:hello@odana.design">hello@odana.design</a> if you think that\'s wrong.</p></div>';
      return;
    }

    try {
      await loadSection();
    } catch (e) {
      fail(e, "We couldn't load this");
    }
  }

  init();
})();
</script>
</body>
</html>
