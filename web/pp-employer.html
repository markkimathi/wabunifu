    { key: "talent", label: "Talent" },
    { key: "messages", label: "Messages" },
    { key: "team", label: "Team" }, { key: "company", label: "Company" }, { key: "billing", label: "Billing" }
  ];

  var me = null;
  var section = "listings";
  var showNewListing = false;
  var wizardStep = 1;
  var wizardMax = 1;
  var wizardData = null;
  var applicantListingId = null;
  var showNewApplicant = false;
  var activeThreadId = null;

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "Authorization": "Bearer " + token });
    var res = await fetch(path, opts);
    if (res.status === 401) { localStorage.removeItem("kazi_employer_token"); location.href = "/signin?role=employer&view=signin"; throw new Error("signed out"); }
    if (!res.ok) {
      var body = await res.json().catch(function(){ return {}; });
      throw new Error((body.detail && typeof body.detail === "string") ? body.detail : "Request failed (" + res.status + ")");
    }
    return res.json();
  }

  function toast(msg){
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2600);
  }

  function canWrite(){ return me && !me.is_pending_approval && (me.team_role === "owner" || me.team_role === "can_post"); }
  function isOwner(){ return me && !me.is_pending_approval && me.team_role === "owner"; }

  function railIcon(key){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + RAIL_ICONS[key] + '</svg>';
  }

  function railHtml(){
    return SECTIONS.map(function(s){
      return '<button type="button" class="dash-rail-item' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '" title="' + s.label + '">' +
        railIcon(s.key) + '<span class="dash-rail-label">' + s.label + '</span></button>';
    }).join("") +
    '<div class="dash-rail-spacer"></div>' +
    '<button type="button" class="dash-rail-item dash-rail-signout" data-rail-signout title="Sign out">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' +
      '<span class="dash-rail-label">Sign out</span></button>';
  }

  function chipsMobileHtml(){
    return '<div class="pp-tabs-scroll">' +
      SECTIONS.map(function(s){
        return '<button type="button" class="pp-tab-chip' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '">' + s.label + '</button>';
      }).join("") +
      '<button type="button" class="pp-tab-chip" data-rail-signout>Sign out</button>' +
    '</div>';
  }

  function statusPill(status){
    var map = {
      pending: '<span class="pp-status -new">In review</span>',
      approved: '<span class="pp-status -good">Live</span>',
      rejected: '<span class="pp-status -neutral">Not approved</span>',
      closed: '<span class="pp-status -neutral">Closed</span>'
    };
    return map[status] || '<span class="pp-status -neutral">' + escapeHtml(status) + '</span>';
  }

  // ---------------- Listings ----------------

  var ELIG_DETAIL = {
    kenya: { tag: "Narrowest reach", note: "Only candidates already able to work in your home country. Fastest to fill, smallest pool." },
    africa: { tag: "Recommended", note: "Anyone able to work from an African country, however you make that work — contractor, EOR, or a local entity." },
    world: { tag: "Widest reach", note: "Open to remote candidates anywhere. Largest pool, and the clearest signal to designers outside Africa." },
    check: { tag: "Uncertain", note: "You're not sure yet. This shows candidates a flag to check with you before assuming they can apply." }
  };
  function needsProof(elig){ return elig === "africa" || elig === "world"; }

  function blankWizardData(){
    return {
      id: null,
      title: "", company: (me.company ? me.company.name : ""), location: "", work_type: "Remote",
      discipline: "", level: "Mid",
      url: (me.company && me.company.website ? "https://" + me.company.website.replace(/^https?:\/\//, "") : ""),
      eligibility: (me.company && me.company.eligibility) || "africa",
      cross_border_note: "", salary: "", closes_at: "",
      skills: [], screening: [], portfolio_required: false,
      contact_email: me.email || "", description: ""
    };
  }
  function wizardDataFromListing(l){
    return {
      id: l.id, title: l.title || "", company: l.company || "", location: l.location || "", work_type: l.work_type || "Remote",
      discipline: l.discipline || "", level: l.level || "Mid", url: l.url || "",
      eligibility: l.eligibility || "africa", cross_border_note: l.cross_border_note || "", salary: l.salary || "",
      closes_at: l.closes_at || "",
      skills: l.skills || [], screening: l.screening || [], portfolio_required: !!l.portfolio_required,
      contact_email: l.contact_email || "", description: l.description || ""
    };
  }

  function wizStepsHtml(){
    var steps = [{ n: 1, label: "Draft" }, { n: 2, label: "Eligibility" }, { n: 3, label: "Preview" }];
    return '<div class="wiz-steps">' + steps.map(function(s){
      var done = s.n < wizardStep, active = s.n === wizardStep, reachable = s.n <= wizardMax;
      return '<div class="wiz-step-wrap">' +
        '<button type="button" class="wiz-step-btn" data-goto-step="' + s.n + '"' + (reachable ? "" : " disabled") + '>' +
          '<span class="wiz-step-dot' + (done ? " -done" : (active ? " -active" : "")) + '">' + (done ? "✓" : s.n) + '</span>' +
          '<span class="wiz-step-label' + (active ? " -active" : "") + '">' + s.label + '</span>' +
        '</button>' +
        (s.n < 3 ? '<span class="wiz-step-rule"></span>' : "") +
      '</div>';
    }).join("") + '</div>';
  }

  function wizPreviewHtml(){
    var d = wizardData;
    var elig = ELIGIBILITY.filter(function(e){ return e.v === d.eligibility; })[0] || ELIGIBILITY[1];
    var eligPositive = d.eligibility === "africa" || d.eligibility === "world" || d.eligibility === "kenya";
    return '<div class="wiz-preview">' +
      '<span class="wiz-preview-label">How it will look in Jobs</span>' +
      '<div class="wiz-preview-head">' +
        '<span class="wiz-preview-mark">' + escapeHtml((d.title || d.company || "?")[0].toUpperCase()) + '</span>' +
        '<div style="flex:1;min-width:0"><h4>' + escapeHtml(d.title || "Job title") + '</h4>' +
          '<p>' + escapeHtml([d.company || "Company", d.location || "Location"].join(" · ")) + '</p></div>' +
      '</div>' +
      '<div class="wiz-preview-tags">' +
        '<span class="pp-elig' + (eligPositive ? " -positive" : " -check") + '">' + (eligPositive ? '<span class="pp-elig-dot"></span>' : "") + escapeHtml(elig.l) + '</span>' +
        '<span class="pp-chip">' + escapeHtml(d.salary || "Not disclosed") + '</span>' +
        '<span class="pp-chip">Just now</span>' +
      '</div>' +
      '<p class="wiz-preview-note">This updates as you type. It\'s the whole card, and it\'s what designers decide from.</p>' +
    '</div>';
  }

  function wizStep1Html(){
    var d = wizardData;
    return '<div class="field-block"><label class="pp-field-label">Role title</label>' +
        '<div class="pp-field-input"><input id="wTitle" value="' + escapeHtml(d.title) + '" placeholder="Senior Product Designer"></div>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">The title a designer would search for, not your internal level code.</p></div>' +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Company</label>' +
          '<div class="pp-field-input"><input id="wCompany" value="' + escapeHtml(d.company) + '" placeholder="Paystack"></div></div>' +
        '<div class="field-block"><label class="pp-field-label">Where the team sits</label>' +
          '<div class="pp-field-input"><input id="wLocation" value="' + escapeHtml(d.location) + '" placeholder="Lagos, or Remote"></div></div>' +
      '</div>' +
      '<div class="field-block"><label class="pp-field-label">Work type</label>' +
        '<div class="wiz-chip-row" id="wWorkType">' + WORK_TYPES.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.work_type === w ? " -active" : "") + '" data-pick-worktype="' + w + '">' + w + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Discipline</label>' +
        '<div class="wiz-chip-row" id="wDiscipline">' + DISCIPLINES.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.discipline === w ? " -active" : "") + '" data-pick-discipline="' + escapeHtml(w) + '">' + escapeHtml(w) + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Seniority</label>' +
        '<div class="wiz-chip-row" id="wLevel">' + LEVELS.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.level === w ? " -active" : "") + '" data-pick-level="' + w + '">' + w + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Link to your application page</label>' +
        '<div class="pp-field-input"><input id="wUrl" value="' + escapeHtml(d.url) + '" placeholder="yoursite.com/careers/senior-product-designer"></div>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Every Apply button on Path &amp; Pixel goes straight here. We do not collect applications.</p></div>' +
      '<div class="field-block"><label class="pp-field-label">Where we reach you about this listing</label>' +
        '<div class="pp-field-input"><input id="wContactEmail" value="' + escapeHtml(d.contact_email) + '"></div></div>' +
      '<div class="fielderr" id="wizStep1Err" hidden></div>';
  }

  function wizStep2Html(){
    var d = wizardData;
    return '<div class="wiz-callout"><h4>This is the question the whole platform is built on</h4>' +
        '<p>Designers across Africa lose hours to roles that were never open to them. Answer this accurately and your listing reaches people who can actually take the job. Answer it loosely and you get applications you have to reject.</p></div>' +
      '<label class="pp-field-label" style="display:block;margin-bottom:12px">Who can take this role?</label>' +
      '<div class="wiz-elig-list">' + ELIGIBILITY.map(function(e){
        var detail = ELIG_DETAIL[e.v] || {};
        var active = d.eligibility === e.v;
        return '<button type="button" class="wiz-elig-card' + (active ? " -active" : "") + '" data-pick-elig="' + e.v + '">' +
          '<span class="wiz-elig-radio"><span></span></span>' +
          '<span style="flex:1;min-width:0">' +
            (detail.tag ? '<span class="pp-chip" style="margin-bottom:6px;display:inline-block">' + escapeHtml(detail.tag) + '</span>' : "") +
            '<span class="wiz-elig-label">' + escapeHtml(e.l) + '</span>' +
            '<span class="wiz-elig-note">' + escapeHtml(detail.note || "") + '</span>' +
          '</span>' +
        '</button>';
      }).join("") + '</div>' +
      (needsProof(d.eligibility) ? '<div class="field-block"><label class="pp-field-label">How do you employ someone outside your own country?</label>' +
        '<textarea id="wCrossBorder" class="pp-textarea" rows="2" placeholder="Contractor agreements through Deel, or an entity in Kenya and Nigeria">' + escapeHtml(d.cross_border_note) + '</textarea>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Shown on the listing. One sentence is enough, and it saves candidates a message.</p></div>' : "") +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Pay range, if you\'re sharing it</label>' +
          '<div class="pp-field-input"><input id="wSalary" value="' + escapeHtml(d.salary) + '" placeholder="$4,500 – $6,200 / mo"></div></div>' +
        '<div class="field-block"><label class="pp-field-label" for="wCloses">Closes on, if there\'s a deadline</label>' +
          '<div class="pp-field-input"><input id="wCloses" type="date" value="' + escapeHtml(d.closes_at) + '"></div>' +
          '<p class="wiz-hint">Leave blank to keep it open. After this date the role stops showing on the board, and anyone who saved it sees that it closed.</p></div>' +
      '</div>' +

      '<div class="field-block"><label class="pp-field-label">Skills that actually matter</label>' +
        '<p class="wiz-hint" style="margin:0 0 8px">Up to eight, from the same list designers pick from — that is what lets us put your role in front of the right people rather than everyone in the discipline.</p>' +
        '<div class="chip-select" id="wSkills"></div></div>' +

      '<div class="field-block"><label class="pp-field-label">What should an applicant be ready to answer?</label>' +
        '<p class="wiz-hint" style="margin:0 0 8px">Up to three. These appear on the listing so candidates can prepare — we never collect the answers, because the application happens on your own site.</p>' +
        [0,1,2].map(function(i){
          return '<div class="pp-field-input" style="margin-bottom:8px"><input id="wScreen' + i + '" value="' +
            escapeHtml(d.screening[i] || "") + '" placeholder="' +
            ["e.g. Which project here is closest to our problem?","e.g. How do you work with engineers?","e.g. What would you want to change first?"][i] + '"></div>';
        }).join("") +
        '<label class="pp-check-row" style="margin-top:6px"><input type="checkbox" id="wPortfolio"' +
          (d.portfolio_required ? " checked" : "") + '><span>A portfolio or case study is required for this role</span></label></div>' +

      '<div style="display:none">' +
      '</div>' +
      '<div class="fielderr" id="wizStep2Err" hidden></div>';
  }

  function wizStep3Html(){
    var d = wizardData;
    var checks = [
      { ok: !!d.title.trim(), label: "Role title and company set" },
      { ok: !!d.url.trim(), label: "Candidates have somewhere to apply" },
      { ok: !needsProof(d.eligibility) || !!d.cross_border_note.trim(), label: "Eligibility answer backed with how you actually hire" }
    ];
    return '<div class="field-block"><label class="pp-field-label" style="display:flex;justify-content:space-between">' +
        '<span>What the person will actually do</span><span style="font-weight:400;color:var(--c-text-faint)">' + d.description.length + ' / 900</span></label>' +
        '<textarea id="wDescription" class="pp-textarea" rows="7" maxlength="900" placeholder="The problem this person owns, who they work with, and what the first three months look like.">' + escapeHtml(d.description) + '</textarea>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Skip the values paragraph. Designers scroll past it, and it\'s the same at every company.</p></div>' +
      '<div class="wiz-checks"><h4>Before it goes live</h4>' +
        checks.map(function(c){
          return '<div class="wiz-check-row' + (c.ok ? "" : " -bad") + '"><span class="mark">' + (c.ok ? "✓" : "!") + '</span><span>' + escapeHtml(c.label) + '</span></div>';
        }).join("") +
      '</div>' +
      '<p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--c-text-faint);max-width:60ch">A person reads every listing before it publishes, usually within a working day. If the eligibility answer does not match the job description we come back to you rather than quietly changing it.</p>' +
      '<div class="fielderr" id="wizStep3Err" hidden></div>';
  }

  /* The same vocabulary designers pick their own skills from. Two lists that
     nearly match are worse than one: "Figma" and "figma" would never join up,
     and matching would quietly under-report. */
  var LISTING_SKILLS = ["Figma", "Prototyping", "Design Systems", "User Research", "Wireframing",
    "Interaction Design", "Visual Design", "Branding", "Illustration", "Motion", "Webflow",
    "Accessibility", "Usability Testing", "Information Architecture", "Copywriting", "HTML/CSS"];
  var MAX_LISTING_SKILLS = 8;

  function renderListingSkills(){
    var box = document.getElementById("wSkills");
    if (!box || !wizardData) return;
    var picked = wizardData.skills || [];
    var atCap = picked.length >= MAX_LISTING_SKILLS;
    box.innerHTML = LISTING_SKILLS.map(function(sk){
      var on = picked.indexOf(sk) !== -1;
      return '<button type="button" class="pick-chip' + (on ? " -active" : "") + '"' +
        (!on && atCap ? " disabled" : "") + ' data-skill="' + escapeHtml(sk) + '">' + escapeHtml(sk) + '</button>';
    }).join("");
    box.querySelectorAll("[data-skill]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sk = btn.getAttribute("data-skill");
        var list = wizardData.skills || [];
        var i = list.indexOf(sk);
        if (i !== -1) list.splice(i, 1);
        else if (list.length < MAX_LISTING_SKILLS) list.push(sk);
        wizardData.skills = list;
        renderListingSkills();
      });
    });
  }

  function listingFormHtml(listing){
    if (!wizardData) wizardData = listing && listing.id ? wizardDataFromListing(listing) : blankWizardData();
    var d = wizardData;
    var stepHtml = wizardStep === 1 ? wizStep1Html() : wizardStep === 2 ? wizStep2Html() : wizStep3Html();
    var backLabel = wizardStep === 1 ? null : "Back";
    var nextLabel = wizardStep === 3 ? (d.id ? "Save changes" : "Submit for review") : "Continue";
    var gateNote = wizardStep === 2 && needsProof(d.eligibility) && !d.cross_border_note.trim()
      ? "Add how you hire abroad to continue." : "";
    return '<div class="form-panel"><h3>' + (d.id ? "Edit listing" : "Post a role") + '</h3>' +
      wizStepsHtml() +
      '<div class="wiz-layout">' +
        '<div class="wiz-main"><form id="listingForm" onsubmit="return false">' + stepHtml + '</form></div>' +
        '<div class="wiz-side">' + wizPreviewHtml() +
          '<div class="wiz-cost"><h4>What posting costs</h4>' +
            '<div><span class="price">Free</span><span class="per">for 30 days</span></div>' +
            '<p>After that, $180 for another 30 days. No commission, no candidate fees.</p></div>' +
        '</div>' +
      '</div>' +
      '<div class="wiz-foot">' +
        (backLabel ? '<button type="button" class="pp-btn pp-btn-tertiary" id="wizBackBtn">' + backLabel + '</button>' : "") +
        '<button type="button" class="pp-btn pp-btn-tertiary" id="listingCancelBtn">Cancel</button>' +
        '<div class="spacer"></div>' +
        (gateNote ? '<span class="gate-note">' + escapeHtml(gateNote) + '</span>' : "") +
        '<button type="button" class="pp-btn pp-btn-primary" id="wizNextBtn">' + nextLabel + '</button>' +
      '</div>' +
    '</div>';
  }

  function readWizardStepFields(){
    if (!wizardData) return;
    var get = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : null; };
    if (wizardStep === 1) {
      if (get("wTitle") !== null) wizardData.title = get("wTitle");
      if (get("wCompany") !== null) wizardData.company = get("wCompany");
      if (get("wLocation") !== null) wizardData.location = get("wLocation");
      if (get("wUrl") !== null) wizardData.url = get("wUrl");
      if (get("wContactEmail") !== null) wizardData.contact_email = get("wContactEmail");
    } else if (wizardStep === 2) {
      if (get("wCrossBorder") !== null) wizardData.cross_border_note = get("wCrossBorder");
      if (get("wSalary") !== null) wizardData.salary = get("wSalary");
      if (get("wCloses") !== null) wizardData.closes_at = get("wCloses");
      var screen = [];
      [0,1,2].forEach(function(i){
        var el = document.getElementById("wScreen" + i);
        if (el && el.value.trim()) screen.push(el.value.trim());
      });
      if (document.getElementById("wScreen0")) wizardData.screening = screen;
      var pf = document.getElementById("wPortfolio");
      if (pf) wizardData.portfolio_required = pf.checked;
    } else if (wizardStep === 3) {
      if (get("wDescription") !== null) wizardData.description = get("wDescription");
    }
  }

  function updateWizPreview(){
    var el = document.querySelector(".wiz-preview");
    if (el) el.outerHTML = wizPreviewHtml();
  }

  function wireWizardStep(){
    if (!wizardData) return;
    if (wizardStep === 1) {
      document.querySelectorAll("[data-pick-worktype]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.work_type = btn.getAttribute("data-pick-worktype"); render(); });
      });
      document.querySelectorAll("[data-pick-discipline]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.discipline = btn.getAttribute("data-pick-discipline"); render(); });
      });
      document.querySelectorAll("[data-pick-level]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.level = btn.getAttribute("data-pick-level"); render(); });
      });
      ["wTitle", "wCompany", "wLocation"].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.addEventListener("input", function(){
          if (id === "wTitle") wizardData.title = el.value;
          if (id === "wCompany") wizardData.company = el.value;
          if (id === "wLocation") wizardData.location = el.value;
          updateWizPreview();
        });
      });
    } else if (wizardStep === 2) {
      document.querySelectorAll("[data-pick-elig]").forEach(function(btn){
        btn.addEventListener("click", function(){
          readWizardStepFields();
          wizardData.eligibility = btn.getAttribute("data-pick-elig");
          render();
        });
      });
      var salaryEl = document.getElementById("wSalary");
      if (salaryEl) salaryEl.addEventListener("input", function(){ wizardData.salary = salaryEl.value; updateWizPreview(); });
    } else if (wizardStep === 3) {
      var descEl = document.getElementById("wDescription");
      if (descEl) descEl.addEventListener("input", function(){
        wizardData.description = descEl.value;
        var counter = descEl.closest(".field-block").querySelector(".pp-field-label span:last-child");
        if (counter) counter.textContent = descEl.value.length + " / 900";
      });
    }
  }

  function renderListings(state){
    var listings = state.listings || [];
    var body =       '<div class="section-head"><h2>Listings</h2>' +
      (canWrite() && !showNewListing ? '<button type="button" class="pp-btn pp-btn-primary" id="addListingBtn">Post a role</button>' : "") +
      '</div>';
    var perf = (cache.perf || []).filter(function(r){ return r.views > 0; });
    if (!showNewListing && perf.length) {
      body += '<div class="perf-panel"><h3>How your roles are doing</h3>' +
        '<p class="perf-lead">Opened, and how many of those went through to your site. A role people open and don\'t apply to is usually telling you something about the description or the pay.</p>' +
        '<div class="perf-rows">' + perf.map(function(r){
          var rate = r.views ? Math.round(100 * r.applies / r.views) : 0;
          return '<div class="perf-row">' +
            '<span class="perf-title">' + escapeHtml(r.title) + '</span>' +
            '<span class="perf-n">' + r.views + '<em>opened</em></span>' +
            '<span class="perf-n">' + r.applies + '<em>applied</em></span>' +
            '<span class="perf-rate">' + rate + '%</span>' +
          '</div>';
        }).join("") + '</div></div>';
    }
    if (showNewListing) body += listingFormHtml(state.editingListing || {});
    if (!listings.length && !showNewListing) {
      body += '<div class="pp-empty"><h3>No listings yet</h3><p>Post your first role and it goes through the same review queue as everything else on Kazi.</p></div>';
    } else {
      listings.forEach(function(l){
        body += '<div class="listing-row">' +
          '<div class="main"><h3>' + escapeHtml(l.title) + '</h3>' +
            '<div class="meta">' + escapeHtml(l.location || "Remote") + ' · ' + escapeHtml(l.work_type) + ' · ' + (l.applicant_count || 0) + ' applicant' + (l.applicant_count === 1 ? "" : "s") + '</div>' +
            // A rejection the employer can't see the reason for is one they
            // can't fix. Shown in the reviewer's own words, not paraphrased.
            (l.review_note ? '<p class="review-note">' + escapeHtml(l.review_note) + '</p>' : "") +
          '</div>' +
          statusPill(l.status) +
          '<div class="actions">' +
            (canWrite() && l.status !== "closed" ? '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-edit-listing="' + l.id + '">Edit</button>' : "") +
            (canWrite() && l.status !== "closed" ? '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-close-listing="' + l.id + '">Close</button>' : "") +
          '</div>' +
        '</div>';
      });
    }
    return body;
  }

  // ---------------- Applicants ----------------

  function applicantFormHtml(){
    return '<div class="form-panel"><h3>Add someone you\'re talking to</h3>' +
      '<p style="margin:0 0 14px;font-size:13.5px;color:var(--c-text-subtle)">Kazi doesn\'t collect applications — add people here yourself as they reach out, so you can track where each conversation stands.</p>' +
      '<form id="applicantForm">' +
        '<div class="field-block"><label class="pp-field-label">Name</label><div class="pp-field-input"><input id="aName" placeholder="Full name"></div></div>' +
        '<div class="field-row2">' +
          '<div class="field-block"><label class="pp-field-label">Email</label><div class="pp-field-input"><input id="aEmail" type="email"></div></div>' +
          '<div class="field-block"><label class="pp-field-label">Location</label><div class="pp-field-input"><input id="aLocation"></div></div>' +
        '</div>' +
        '<div class="field-block"><label class="pp-field-label">Portfolio link</label><div class="pp-field-input"><input id="aPortfolio" placeholder="https://"></div></div>' +
        '<div class="field-block"><label class="pp-field-label">Note</label><textarea id="aNote" class="pp-textarea" rows="2" placeholder="How you found them, what stood out."></textarea></div>' +
        '<div class="fielderr" id="applicantErr" hidden></div>' +
        '<div class="form-actions">' +
          '<button type="submit" class="pp-btn pp-btn-primary" id="applicantSubmitBtn">Add</button>' +
          '<button type="button" class="pp-btn pp-btn-tertiary" id="applicantCancelBtn">Cancel</button>' +
        '</div>' +
      '</form></div>';
  }

  function applicantCardHtml(a){
    var canMoveBack = a.stage > 0, canMoveNext = a.stage < STAGES.length - 1;
    return '<div class="applicant-card">' +
      '<p class="name">' + escapeHtml(a.full_name) + '</p>' +
      '<p class="sub">' + [a.location, a.email].filter(Boolean).map(escapeHtml).join(" · ") + '</p>' +
      (a.note ? '<p class="note">' + escapeHtml(a.note) + '</p>' : "") +
      (a.portfolio_url ? '<p class="note"><a href="' + escapeHtml(a.portfolio_url) + '" target="_blank" rel="noopener">Portfolio</a></p>' : "") +
      (canWrite() ? '<div class="card-actions">' +
        (canMoveBack ? '<button type="button" data-move="' + a.id + '" data-dir="-1">← Back</button>' : "") +
        (canMoveNext ? '<button type="button" data-move="' + a.id + '" data-dir="1">Next →</button>' : "") +
        '<button type="button" data-remove-applicant="' + a.id + '">Remove</button>' +
      '</div>' : "") +
    '</div>';
  }

  function renderApplicants(state){
    var listings = (state.listings || []).filter(function(l){ return l.status !== "rejected"; });
    var body = '<div class="section-head"><h2>Applicants</h2></div>';
    if (!listings.length) {
      return body + '<div class="pp-empty"><h3>Post a role first</h3><p>Applicants are tracked per listing — add one from the Listings tab.</p></div>';
    }
    if (!applicantListingId || !listings.some(function(l){ return l.id === applicantListingId; })) applicantListingId = listings[0].id;
    body += '<div class="applicant-picker pp-field"><label class="pp-field-label">Listing</label><div class="pp-field-input"><select id="applicantListingSelect">' +
      listings.map(function(l){ return '<option value="' + l.id + '"' + (l.id === applicantListingId ? " selected" : "") + '>' + escapeHtml(l.title) + '</option>'; }).join("") +
      '</select></div></div>';
    if (canWrite() && !showNewApplicant) body += '<button type="button" class="pp-btn pp-btn-secondary" id="addApplicantBtn" style="margin-bottom:16px">Add someone</button>';
    if (showNewApplicant) body += applicantFormHtml();
    var applicants = state.applicants || [];
    body += '<div class="board">' + STAGES.map(function(stageName, i){
      var col = applicants.filter(function(a){ return a.stage === i; });
      return '<div class="board-col"><div class="board-col-head"><span>' + stageName + '</span><span>' + col.length + '</span></div>' +
        (col.length ? col.map(applicantCardHtml).join("") : '<p style="font-size:12.5px;color:var(--c-text-faint);padding:4px 2px">Nobody here yet.</p>') +
      '</div>';
    }).join("") + '</div>';
    return body;
  }

  // ---------------- Team ----------------

  function renderTeam(state){
    var team = state.team || { members: [], pending_invites: [] };
    var body = '<div class="section-head"><h2>Team</h2></div>';
    if (team.pending_invites.length) {
      body += '<h3 style="font-size:14px;color:var(--c-text-subtle);margin:0 0 10px">Invited, not yet joined</h3>';
      team.pending_invites.forEach(function(inv){
        body += '<div class="team-row"><div class="who"><div class="name">' + escapeHtml(inv.invited_email) + '</div><div class="role">Invited as ' + escapeHtml(inv.proposed_team_role === "can_post" ? "Can post" : "Can view") + '</div></div>' +
          '<span class="pp-status -new">Waiting</span></div>';
      });
    }
    var pendingApproval = team.members.filter(function(m){ return m.is_pending_approval; });
    if (pendingApproval.length) {
      body += '<h3 style="font-size:14px;color:var(--c-text-subtle);margin:16px 0 10px">Joined, needs your approval</h3>';
      pendingApproval.forEach(function(m){
        body += '<div class="team-row"><div class="who"><div class="name">' + escapeHtml(m.full_name) + '</div><div class="role">' + escapeHtml(m.role_title || "") + '</div></div>' +
          (isOwner() ? '<div class="actions"><button type="button" class="pp-btn pp-btn-primary pp-btn-sm" data-approve="' + m.id + '">Approve</button><button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-decline-teammate="' + m.id + '">Decline</button></div>' : '<span class="pp-status -new">Pending approval</span>') +
        '</div>';
      });
    }
    body += '<h3 style="font-size:14px;color:var(--c-text-subtle);margin:16px 0 10px">On the account</h3>';
    team.members.filter(function(m){ return !m.is_pending_approval; }).forEach(function(m){
      body += '<div class="team-row"><div class="who"><div class="name">' + escapeHtml(m.full_name) + '</div><div class="role">' + escapeHtml(m.role_title || "") + ' · ' + (m.team_role === "owner" ? "Owner" : m.team_role === "can_post" ? "Can post" : "Can view") + '</div></div>' +
        (isOwner() && m.id !== me.id ? '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-remove-member="' + m.id + '">Remove</button>' : "") +
      '</div>';
    });
    if (canWrite()) {
      body += '<div class="form-panel" style="margin-top:20px"><h3>Invite someone</h3>' +
        '<form id="inviteForm">' +
          '<div class="field-row2">' +
            '<div class="field-block"><label class="pp-field-label">Email</label><div class="pp-field-input"><input id="iEmail" type="email" placeholder="colleague@' + escapeHtml((me.company && me.company.website || "").replace(/^https?:\/\//, "")) + '"></div></div>' +
            '<div class="field-block"><label class="pp-field-label">Role</label><div class="pp-field-input"><select id="iRole"><option value="can_post">Can post</option><option value="can_view">Can view</option></select></div></div>' +
          '</div>' +
          '<div class="fielderr" id="inviteErr" hidden></div>' +
          '<button type="submit" class="pp-btn pp-btn-primary" id="inviteSubmitBtn">Send invite</button>' +
        '</form></div>';
    }
    return body;
  }

  // ---------------- Company ----------------

  function renderCompany(state){
    var c = me.company || {};
    var body = '<div class="section-head"><h2>Company page</h2></div>';
    body += '<div class="form-panel"><form id="companyForm">' +
      '<div class="field-block"><label class="pp-field-label">Company name</label><div class="pp-field-input"><input id="cName" value="' + escapeHtml(c.name || "") + '"' + (isOwner() ? "" : " disabled") + '></div></div>' +
      '<div class="field-block"><label class="pp-field-label">Website</label><div class="pp-field-input"><input id="cWebsite" value="' + escapeHtml(c.website || "") + '"' + (isOwner() ? "" : " disabled") + '></div></div>' +
      '<div class="field-block"><label class="pp-field-label">One line about the company</label><textarea id="cBlurb" class="pp-textarea" rows="2"' + (isOwner() ? "" : " disabled") + '>' + escapeHtml(c.blurb || "") + '</textarea></div>' +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Who you can employ</label><div class="pp-field-input"><select id="cElig"' + (isOwner() ? "" : " disabled") + '>' + ELIGIBILITY.map(function(e){ return '<option value="' + e.v + '"' + (c.eligibility === e.v ? " selected" : "") + '>' + e.l + '</option>'; }).join("") + '</select></div></div>' +
        '<div class="field-block"><label class="pp-field-label">Status</label><div style="padding-top:10px">' + statusPill(c.status || "pending") + '</div></div>' +
      '</div>' +
      '<div class="field-block"><label class="pp-field-label">How you hire abroad</label><textarea id="cEligNote" class="pp-textarea" rows="2"' + (isOwner() ? "" : " disabled") + '>' + escapeHtml(c.eligibility_note || "") + '</textarea></div>' +
      (isOwner() ? '<div class="fielderr" id="companyErr" hidden></div><button type="submit" class="pp-btn pp-btn-primary" id="companySubmitBtn">Save changes</button>' :
        '<p style="font-size:13px;color:var(--c-text-faint)">Only an owner can edit the company page.</p>') +
    '</form></div>';
    return body;
  }

  // ---------------- Messages ----------------

  function renderMessages(){
    var body = '<div class="section-head"><h2>Messages</h2></div>';
    if (!cache.conversations.length) {
      body += '<div class="pp-empty"><h3>No conversations yet</h3><p>When a designer messages your company, the thread shows up here.</p></div>';
      return body;
    }
    if (!activeThreadId) activeThreadId = cache.conversations[0].id;
    var active = cache.conversations.filter(function(c){ return c.id === activeThreadId; })[0] || cache.conversations[0];
    body += '<div class="thread-layout">' +
      '<div class="thread-list">' + cache.conversations.map(function(c){
        return '<button type="button" class="thread-item' + (c.id === active.id ? " -active" : "") + '" data-thread="' + c.id + '">' +
          '<span class="name">' + (c.unread_count ? '<span class="unread-dot"></span>' : "") + escapeHtml(c.designer_name) + '</span>' +
          '<span class="preview">' + escapeHtml(c.last_message ? c.last_message.body : "") + '</span>' +
        '</button>';
      }).join("") + '</div>' +
      '<div class="thread-body">' +
        '<div class="thread-messages" id="threadMessages"><p style="color:var(--c-text-faint);font-size:13.5px">Loading…</p></div>' +
        '<form class="thread-composer" id="composerForm"><input id="composerInput" placeholder="Write a reply…" autocomplete="off"><button type="submit" class="pp-btn pp-btn-primary">Send</button></form>' +
      '</div>' +
    '</div>';
    return body;
  }

  function renderThreadMessages(){
    var el = document.getElementById("threadMessages");
    if (!el) return;
    if (!cache.messages.length) { el.innerHTML = '<p style="color:var(--c-text-faint);font-size:13.5px">Say hello.</p>'; return; }
    el.innerHTML = cache.messages.map(function(m){
      var mine = m.sender_type === "employer";
      return '<div class="msg-row ' + (mine ? "-me" : "-them") + '">' +
        '<div class="msg-bubble">' + escapeHtml(m.body) + '</div>' +
        (mine ? "" : '<button type="button" class="msg-report-btn" data-report-msg="' + m.id + '">Report</button>' +
          '<div class="msg-report-box" data-report-box-msg="' + m.id + '" style="display:none"></div>') +
      '</div>';
    }).join("");
    el.scrollTop = el.scrollHeight;
    wireMessageReportButtons();
  }

  var MSG_REPORT_BOX_HTML =
    '<textarea rows="2" placeholder="Why report this? (optional)"></textarea>' +
    '<div class="row"><button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm report-cancel">Cancel</button>' +
    '<button type="button" class="pp-btn pp-btn-danger pp-btn-sm report-send">Send</button></div>';

  function wireMessageReportButtons(){
    document.querySelectorAll("[data-report-msg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-report-msg");
        var box = document.querySelector('[data-report-box-msg="' + id + '"]');
        if (box.style.display !== "none") { box.style.display = "none"; return; }
        box.innerHTML = MSG_REPORT_BOX_HTML;
        box.style.display = "flex";
        box.querySelector(".report-cancel").addEventListener("click", function(){ box.style.display = "none"; });
        box.querySelector(".report-send").addEventListener("click", async function(){
          var sendBtn = box.querySelector(".report-send");
          sendBtn.disabled = true;
          try {
            await api("/api/employers/me/conversations/" + activeThreadId + "/messages/" + id + "/report", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ summary: box.querySelector("textarea").value.trim() })
            });
            box.style.display = "none";
            toast("Report sent — a person will review it.");
          } catch (e) {}
          sendBtn.disabled = false;
        });
      });
    });
  }

  async function loadThread(id){
    activeThreadId = id;
    var data = await api("/api/employers/me/conversations/" + id + "/messages");
    cache.messages = data.messages;
    renderThreadMessages();
    var convData = await api("/api/employers/me/conversations");
    cache.conversations = convData.conversations;
  }

  // ---------------- Billing ----------------

  function renderBilling(){
    return '<div class="section-head"><h2>Billing</h2></div>' +
      '<div class="billing-panel"><h3>Hiring tools are free right now</h3>' +
      '<p>Kazi isn\'t charging for posting roles or managing applicants yet. If that changes, you\'ll see it here first — nothing changes automatically, and nothing is billed today.</p></div>';
  }

  // ---------------- Data + wiring ----------------

  var cache = { listings: [], applicants: [], team: null, conversations: [], messages: [] };

  async function loadSection(){
    var content = document.getElementById("content");
    if (section === "listings" || section === "applicants") {
      var data = await api("/api/employers/me/listings");
      cache.listings = data.listings;
    }
    if (section === "applicants" && applicantListingId) {
      var adata = await api("/api/employers/me/listings/" + applicantListingId + "/applicants");
      cache.applicants = adata.applicants;
    }
    if (section === "team") {
      cache.team = await api("/api/employers/me/team");
    }
    if (section === "listings") {
      try { cache.perf = (await api("/api/employers/me/role-performance")).roles; }
      catch (e) { cache.perf = []; }
    }
    if (section === "talent") {
      // Both lists every time: the shortlist count sits on the tab, and search
      // results need to know who is already on it.
      var qs = new URLSearchParams();
      if (talentQuery) qs.set("q", talentQuery);
      if (talentFilters.discipline) qs.set("discipline", talentFilters.discipline);
      if (talentFilters.open_to) qs.set("open_to", talentFilters.open_to);
      var t = await api("/api/employers/me/talent" + (qs.toString() ? "?" + qs : ""));
      cache.talent = t.designers;
      var sl = await api("/api/employers/me/shortlist");
      cache.shortlist = sl.designers;
    }
    if (section === "messages") {
      var convData = await api("/api/employers/me/conversations");
      cache.conversations = convData.conversations;
    }
    render();
  }

  /* ---------------- Talent ----------------
     The directory was always public; what was missing was any route to it from
     the hiring side, so a company could post a role and never go looking for
     anyone to fill it. Two tabs because they are genuinely different jobs:
     searching, and returning to people you already flagged. */
  var talentTab = "search";
  var talentQuery = "";
  var talentFilters = { discipline: "", country: "", open_to: "" };

  function talentCardHtml(d){
    var openTo = (d.open_to || []).map(function(o){
      return '<span class="pp-chip">' + escapeHtml(o) + '</span>';
    }).join("");
    var disc = (d.discipline || []).slice(0, 3).map(function(x){
      return '<span class="pp-chip">' + escapeHtml(x) + '</span>';
    }).join("");
    var avail = d.availability_status || "";
    var availClass = /available|open/i.test(avail) ? "-good" : "-neutral";
    return '<div class="talent-card">' +
      '<div class="tc-head">' +
        (d.photo_path
          ? '<img class="tc-photo" src="' + escapeHtml(d.photo_path) + '" alt="">'
          : '<span class="pp-avatar -md">' + escapeHtml(initialsOf(d.display_name)) + '</span>') +
        '<div class="tc-id">' +
          '<h3>' + escapeHtml(d.display_name) + '</h3>' +
          '<p>' + escapeHtml([d.headline, d.location].filter(Boolean).join(" · ") || "Designer") + '</p>' +
        '</div>' +
        (avail ? '<span class="pp-status ' + availClass + '">' + escapeHtml(avail) + '</span>' : "") +
      '</div>' +
      (d.bio ? '<p class="tc-bio">' + escapeHtml(d.bio) + '</p>' : "") +
      ((disc || openTo) ? '<div class="tc-tags">' + disc + openTo + '</div>' : "") +
      (d.note ? '<p class="tc-note">' + escapeHtml(d.note) + '</p>' : "") +
      '<div class="tc-actions">' +
        '<a class="pp-btn pp-btn-secondary" href="/designers/' + encodeURIComponent(d.handle || d.id) + '" target="_blank" rel="noopener">View profile</a>' +
        '<button type="button" class="pp-btn ' + (d.shortlisted ? "pp-btn-secondary" : "pp-btn-secondary") +
          '" data-shortlist="' + d.id + '" data-on="' + (d.shortlisted ? "1" : "0") + '">' +
          (d.shortlisted ? "Shortlisted ✓" : "Shortlist") + '</button>' +
        '<button type="button" class="pp-btn pp-btn-primary" data-msg-designer="' + d.id +
          '" data-msg-name="' + escapeHtml(d.display_name) + '">Message</button>' +
      '</div>' +
    '</div>';
  }

  function renderTalent(){
    var list = talentTab === "search" ? (cache.talent || []) : (cache.shortlist || []);
    var body = '<div class="section-head"><h2>Talent</h2></div>';

    body += '<div class="talent-tabs">' +
      '<button type="button" class="pp-tab-chip' + (talentTab === "search" ? " -active" : "") + '" data-talent-tab="search">Search</button>' +
      '<button type="button" class="pp-tab-chip' + (talentTab === "shortlist" ? " -active" : "") + '" data-talent-tab="shortlist">Shortlist' +
        (cache.shortlist && cache.shortlist.length ? ' <span class="pp-tab-count">' + cache.shortlist.length + '</span>' : "") +
      '</button></div>';

    if (talentTab === "search") {
      body += '<div class="talent-search">' +
        '<div class="pp-field-input"><input id="talentQ" placeholder="Name, skill, headline…" value="' + escapeHtml(talentQuery) + '"></div>' +
        '<select id="talentDiscipline"><option value="">Any discipline</option>' +
          DISCIPLINES.map(function(x){
            return '<option value="' + escapeHtml(x) + '"' + (talentFilters.discipline === x ? " selected" : "") + '>' + escapeHtml(x) + '</option>';
          }).join("") + '</select>' +
        '<select id="talentOpenTo"><option value="">Any work type</option>' +
          ["Full-time", "Contract", "Freelance", "Internship"].map(function(x){
            return '<option value="' + escapeHtml(x) + '"' + (talentFilters.open_to === x ? " selected" : "") + '>' + escapeHtml(x) + '</option>';
          }).join("") + '</select>' +
        '<button type="button" class="pp-btn pp-btn-primary" id="talentGo">Search</button>' +
      '</div>';
    }

    if (!list.length) {
      body += '<div class="pp-empty">' +
        '<h3>' + (talentTab === "search" ? "No designers match that" : "Nobody shortlisted yet") + '</h3>' +
        '<p>' + (talentTab === "search"
          ? "Try a broader search — the directory is still growing, so fewer filters usually finds more."
          : "Shortlist someone from Search and they'll wait here, with the note you left about why.") + '</p>' +
      '</div>';
    } else {
      body += '<div class="talent-grid">' + list.map(talentCardHtml).join("") + '</div>';
    }
    return body;
  }

  function render(){
    var content = document.getElementById("content");
    var banner = me.is_pending_approval
      ? '<div class="pending-banner">Someone at ' + escapeHtml(me.company ? me.company.name : "this company") + ' needs to approve you before you can post or manage anything here. You can still look around.</div>'
      : "";
    var head = '<div class="dash-head"><div><h1>' + escapeHtml(me.company ? me.company.name : "Hiring") + '</h1><p>Signed in as ' + escapeHtml(me.full_name) + '</p></div></div>' + banner;
    var body = "";
    if (section === "listings") body = renderListings(cache);
    else if (section === "applicants") body = renderApplicants(cache);
    else if (section === "talent") body = renderTalent();
    else if (section === "messages") body = renderMessages();
    else if (section === "team") body = renderTeam(cache);
    else if (section === "company") body = renderCompany(cache);
    else body = renderBilling();
    content.innerHTML = head + body;
    document.getElementById("dashRail").innerHTML = railHtml();
    document.getElementById("dashChipsMobile").innerHTML = chipsMobileHtml();
    wire();
    if (section === "messages" && cache.conversations.length) loadThread(activeThreadId || cache.conversations[0].id);
  }

  function setSection(s){ section = s; showNewListing = false; wizardData = null; showNewApplicant = false; loadSection(); }

  function showErr(id, msg){
    var el = document.getElementById(id);
    if (!el) return;
    el.hidden = !msg;
    el.textContent = msg || "";
  }

  function wireTalent(){
    document.querySelectorAll("[data-talent-tab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        talentTab = btn.getAttribute("data-talent-tab");
        render();
      });
    });
    var go = document.getElementById("talentGo");
    if (go) {
      var run = function(){
        talentQuery = document.getElementById("talentQ").value.trim();
        talentFilters.discipline = document.getElementById("talentDiscipline").value;
        talentFilters.open_to = document.getElementById("talentOpenTo").value;
        loadSection();
      };
      go.addEventListener("click", run);
      document.getElementById("talentQ").addEventListener("keydown", function(e){
        if (e.key === "Enter") run();
      });
    }
    document.querySelectorAll("[data-shortlist]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-shortlist");
        var on = btn.getAttribute("data-on") === "1";
        btn.disabled = true;
        try {
          if (on) {
            await api("/api/employers/me/shortlist/" + id, { method: "DELETE" });
          } else {
            // The note is the reason they were saved — the thing that otherwise
            // ends up in someone's private doc and is lost to the rest of the team.
            var note = window.prompt("Why this designer? (optional, your team will see it)", "") || "";
            await api("/api/employers/me/shortlist", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ designer_id: Number(id), note: note })
            });
          }
          await loadSection();
        } catch (e) { btn.disabled = false; }
      });
    });
    document.querySelectorAll("[data-msg-designer]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-msg-designer");
        var name = btn.getAttribute("data-msg-name");
        var body = window.prompt("Message to " + name + " — say which role and why them.", "");
        if (!body || !body.trim()) return;
        btn.disabled = true;
        try {
          await api("/api/employers/me/conversations", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ designer_id: Number(id), body: body.trim() })
          });
          setSection("messages");
        } catch (e) { btn.disabled = false; }
      });
    });
  }

  function wire(){
    document.querySelectorAll("[data-section]").forEach(function(btn){
      btn.addEventListener("click", function(){ setSection(btn.getAttribute("data-section")); });
    });
    wireTalent();
    renderListingSkills();
    document.querySelectorAll("[data-rail-signout]").forEach(function(btn){
      btn.addEventListener("click", function(){ window.PathPixelNav.signOut("employer"); });
    });

    // Listings
    var addListingBtn = document.getElementById("addListingBtn");
    if (addListingBtn) addListingBtn.addEventListener("click", function(){
      cache.editingListing = null; wizardData = blankWizardData(); wizardStep = 1; wizardMax = 1;
      showNewListing = true; render();
    });
    var listingCancelBtn = document.getElementById("listingCancelBtn");
    if (listingCancelBtn) listingCancelBtn.addEventListener("click", function(){ showNewListing = false; wizardData = null; render(); });
    document.querySelectorAll("[data-edit-listing]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = parseInt(btn.getAttribute("data-edit-listing"), 10);
        cache.editingListing = cache.listings.filter(function(l){ return l.id === id; })[0];
        wizardData = wizardDataFromListing(cache.editingListing);
        wizardStep = 1; wizardMax = 3;
        showNewListing = true;
        render();
      });
    });
    document.querySelectorAll("[data-close-listing]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-close-listing");
        var ok = await window.showPPConfirm({
          title: "Close this listing?", description: "It comes off the board. Applicants tracked against it stay in your history.",
          confirmLabel: "Close listing", safeLabel: "Keep it open", danger: false
        });
        if (!ok) return;
        await api("/api/employers/me/listings/" + id, { method: "DELETE" });
        toast("Listing closed.");
        loadSection();
      });
    });
    wireWizardStep();
    document.querySelectorAll("[data-goto-step]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var n = parseInt(btn.getAttribute("data-goto-step"), 10);
        if (n > wizardMax) return;
        readWizardStepFields();
        wizardStep = n;
        render();
      });
    });
    var wizBackBtn = document.getElementById("wizBackBtn");
    if (wizBackBtn) wizBackBtn.addEventListener("click", function(){
      readWizardStepFields();
      wizardStep -= 1;
      render();
    });
    var wizNextBtn = document.getElementById("wizNextBtn");
    if (wizNextBtn) wizNextBtn.addEventListener("click", async function(){
      readWizardStepFields();
      var errId = "wizStep" + wizardStep + "Err";
      showErr(errId, "");
      if (wizardStep === 1) {
        if (!wizardData.title || !wizardData.company || !wizardData.location || !wizardData.discipline || !wizardData.url || !wizardData.contact_email) {
          showErr(errId, "Fill in the role title, company, location, discipline and application link.");
          return;
        }
        wizardStep = 2; wizardMax = Math.max(wizardMax, 2); render();
      } else if (wizardStep === 2) {
        if (needsProof(wizardData.eligibility) && !wizardData.cross_border_note) {
          showErr(errId, "Add a sentence on how you employ someone outside your own country.");
          return;
        }
        wizardStep = 3; wizardMax = Math.max(wizardMax, 3); render();
      } else {
        if (!wizardData.description) {
          showErr(errId, "Describe what the person will actually do.");
          return;
        }
        var payload = {
          title: wizardData.title, company: wizardData.company, url: wizardData.url,
          contact_email: wizardData.contact_email, description: wizardData.description,
          location: wizardData.location, work_type: wizardData.work_type,
          discipline: wizardData.discipline, level: wizardData.level,
          eligibility: wizardData.eligibility, cross_border_note: wizardData.cross_border_note,
          salary: wizardData.salary, agreed_to_terms: true
        };
        wizNextBtn.disabled = true;
        try {
          if (wizardData.id) {
            await api("/api/employers/me/listings/" + wizardData.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            toast("Saved. Back in the review queue.");
          } else {
            await api("/api/employers/me/listings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            toast("Submitted for review.");
          }
          showNewListing = false; wizardData = null;
          loadSection();
        } catch (err) {
          showErr(errId, err.message);
          wizNextBtn.disabled = false;
        }
      }
    });

    // Applicants
    var applicantListingSelect = document.getElementById("applicantListingSelect");
    if (applicantListingSelect) applicantListingSelect.addEventListener("change", function(){
      applicantListingId = parseInt(applicantListingSelect.value, 10);
      showNewApplicant = false;
      loadSection();
    });
    var addApplicantBtn = document.getElementById("addApplicantBtn");
    if (addApplicantBtn) addApplicantBtn.addEventListener("click", function(){ showNewApplicant = true; render(); });
    var applicantCancelBtn = document.getElementById("applicantCancelBtn");
    if (applicantCancelBtn) applicantCancelBtn.addEventListener("click", function(){ showNewApplicant = false; render(); });
    var applicantForm = document.getElementById("applicantForm");
    if (applicantForm) applicantForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("applicantErr", "");
      var name = document.getElementById("aName").value.trim();
      if (!name) { showErr("applicantErr", "Add a name."); return; }
      var payload = {
        full_name: name, email: document.getElementById("aEmail").value.trim(),
        location: document.getElementById("aLocation").value.trim(),
        portfolio_url: document.getElementById("aPortfolio").value.trim(),
        note: document.getElementById("aNote").value.trim()
      };
      var btn = document.getElementById("applicantSubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/listings/" + applicantListingId + "/applicants", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        showNewApplicant = false;
        toast("Added.");
        loadSection();
      } catch (err) {
        showErr("applicantErr", err.message);
        btn.disabled = false;
      }
    });
    document.querySelectorAll("[data-move]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.getAttribute("data-move");
        var current = cache.applicants.filter(function(a){ return String(a.id) === id; })[0];
        var stage = current.stage + parseInt(btn.getAttribute("data-dir"), 10);
        await api("/api/employers/me/applicants/" + id + "/stage", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stage: stage }) });
        loadSection();
      });
    });
    document.querySelectorAll("[data-remove-applicant]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var ok = await window.showPPConfirm({
          title: "Remove this applicant?", description: "Their card comes off the board. This can't be undone.",
          confirmLabel: "Remove", safeLabel: "Keep them", danger: true
        });
        if (!ok) return;
        await api("/api/employers/me/applicants/" + btn.getAttribute("data-remove-applicant"), { method: "DELETE" });
        loadSection();
      });
    });

    // Messages
    document.querySelectorAll("[data-thread]").forEach(function(btn){
      btn.addEventListener("click", function(){ loadThread(parseInt(btn.getAttribute("data-thread"), 10)).then(render); });
    });
    var composerForm = document.getElementById("composerForm");
    if (composerForm) composerForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var input = document.getElementById("composerInput");
      var body = input.value.trim();
      if (!body) return;
      input.value = "";
      await api("/api/employers/me/conversations/" + activeThreadId + "/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body: body }) });
      await loadThread(activeThreadId);
      render();
    });

    // Team
    var inviteForm = document.getElementById("inviteForm");
    if (inviteForm) inviteForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("inviteErr", "");
      var email = document.getElementById("iEmail").value.trim();
      var btn = document.getElementById("inviteSubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/team/invite", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, team_role: document.getElementById("iRole").value }) });
        toast("Invite sent.");
        document.getElementById("iEmail").value = "";
        loadSection();
      } catch (err) {
        showErr("inviteErr", err.message);
      }
      btn.disabled = false;
    });
    document.querySelectorAll("[data-approve]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        await api("/api/employers/me/team/" + btn.getAttribute("data-approve") + "/approve", { method: "POST" });
        toast("Approved.");
        loadSection();
      });
    });
    document.querySelectorAll("[data-decline-teammate]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var ok = await window.showPPConfirm({
          title: "Decline this person?", description: "Nothing is shared with them beyond a plain decline. Their account is removed.",
          confirmLabel: "Decline", safeLabel: "Keep pending", danger: true
        });
        if (!ok) return;
        await api("/api/employers/me/team/" + btn.getAttribute("data-decline-teammate") + "/decline", { method: "POST" });
        loadSection();
      });
    });
    document.querySelectorAll("[data-remove-member]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var ok = await window.showPPConfirm({
          title: "Remove this teammate?", description: "They lose access to this company's listings and applicants right away.",
          confirmLabel: "Remove", safeLabel: "Keep them", danger: true
        });
        if (!ok) return;
        try {
          await api("/api/employers/me/team/" + btn.getAttribute("data-remove-member"), { method: "DELETE" });
          loadSection();
        } catch (err) { toast(err.message); }
      });
    });

    // Company
    var companyForm = document.getElementById("companyForm");
    if (companyForm) companyForm.addEventListener("submit", async function(e){
      e.preventDefault();
      showErr("companyErr", "");
      var payload = {
        name: document.getElementById("cName").value.trim(),
        website: document.getElementById("cWebsite").value.trim(),
        blurb: document.getElementById("cBlurb").value.trim(),
        eligibility: document.getElementById("cElig").value,
        eligibility_note: document.getElementById("cEligNote").value.trim()
      };
      var btn = document.getElementById("companySubmitBtn");
      btn.disabled = true;
      try {
        await api("/api/employers/me/company", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        toast("Saved. Back in review since the company page changed.");
        me = await api("/api/employers/me");
        render();
      } catch (err) {
        showErr("companyErr", err.message);
        btn.disabled = false;
      }
    });
  }

  async function init(){
    try {
      me = await api("/api/employers/me");
    } catch (e) {
      return;
    }
    await loadSection();
  }

  init();
})();
</script>
</body>
</html>
