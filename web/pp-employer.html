<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiring dashboard · Path & Pixel</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/pp-primitives.css">
<style>
  body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--pp-font);
    font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{max-width:var(--pp-container-wide);width:100%;margin:0 auto;padding:28px var(--pp-page-margin) 64px;box-sizing:border-box}
  a{color:inherit}

  /* Dashboard rail — same pattern as pp-dashboard.html: 248px labelled
     rail (desktop), 68px icon-only (1024-1279px), horizontal chip row
     below 1024px. See that file for the fuller comment. */
  .dash-layout{display:flex;align-items:flex-start;gap:32px}
  .dash-rail{display:none;flex:none;width:var(--pp-sidebar);flex-direction:column;gap:2px;
    position:sticky;top:24px}
  @media(min-width:1024px){.dash-rail{display:flex}}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail{width:var(--pp-sidebar-collapsed)}}
  .dash-rail-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:none;
    border-radius:var(--pp-radius-md);background:transparent;color:var(--c-text-muted);cursor:pointer;
    font-family:var(--pp-font);font-size:14.5px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden}
  .dash-rail-item svg{flex:none}
  .dash-rail-item:hover{background:var(--c-bg-sunken);color:var(--c-text)}
  .dash-rail-item.-active{background:var(--pp-gold-200);color:var(--pp-gold-800);font-weight:600}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail-item{width:44px;padding:0;justify-content:center}}
  .dash-rail-label{overflow:hidden;text-overflow:ellipsis}
  @media(min-width:1024px) and (max-width:1279px){.dash-rail-label{display:none}}
  .dash-rail-spacer{flex:1;min-height:16px}
  .dash-rail-signout{color:var(--c-text)}
  .dash-main{flex:1;min-width:0}
  .dash-chips-mobile{margin-bottom:22px}
  @media(min-width:1024px){.dash-chips-mobile{display:none}}

  .dash-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

  /* ---- Talent ---- */
  .talent-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .talent-search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .talent-search .pp-field-input{flex:1;min-width:220px}
  .talent-search select{height:44px;padding:0 10px;border-radius:var(--pp-radius-md);
    border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-text);
    font-family:var(--pp-font);font-size:14.5px}
  .talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .talent-card{padding:18px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);
    background:var(--c-surface);display:flex;flex-direction:column;gap:12px}
  .talent-card:hover{border-color:var(--c-border-hover)}
  .tc-head{display:flex;align-items:center;gap:12px}
  .tc-photo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
  .tc-id{flex:1;min-width:0}
  .tc-id h3{margin:0 0 2px;font-size:16.5px;font-weight:700;letter-spacing:-0.015em}
  .tc-id p{margin:0;font-size:13.5px;color:var(--c-text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-bio{margin:0;font-size:14px;line-height:1.5;color:var(--c-text-muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tc-tags{display:flex;flex-wrap:wrap;gap:6px}
  /* The saved note, in the team's own words — kept visually distinct from the
     designer's own copy so nobody mistakes one for the other. */
  .tc-note{margin:0;padding:9px 11px;border-radius:var(--pp-radius-sm);background:var(--pp-gold-200);
    color:var(--pp-gold-800);font-size:13px;line-height:1.5}
  .tc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .tc-actions .pp-btn{flex:1;min-width:110px;height:38px;font-size:14px}

  .dash-head h1{margin:0 0 4px;font-size:30px;line-height:1.1;letter-spacing:-0.026em;font-weight:800}
  .dash-head p{margin:0;font-size:14.5px;color:var(--c-text-subtle)}
  .pending-banner{padding:16px 18px;border-radius:var(--pp-radius-md);background:var(--pp-gold-200);
    color:var(--pp-gold-800);border:1px solid var(--pp-gold-400);font-size:14.5px;line-height:1.55;margin-bottom:22px}

  .section{margin-top:26px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .section-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.015em}

  .logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo-preview{width:56px;height:56px;font-size:21px;overflow:hidden;flex:none}
  .logo-preview img{width:100%;height:100%;object-fit:cover;display:block}

  .verify-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .verify-row .pp-field-input{height:38px}
  .verify-row input{font-variant-numeric:tabular-nums;letter-spacing:.08em}
  .danger-block{padding:20px;border:1px solid var(--c-bad-border);border-radius:var(--pp-radius-lg);
    background:var(--c-bad-bg);margin-top:18px}
  .danger-block h3{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--c-bad-text)}
  .danger-block p{margin:0 0 14px;font-size:14.5px;line-height:1.6;color:var(--c-text-subtle);max-width:66ch}

  .apply-choice{display:grid;gap:10px}
  .apply-opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-md);background:var(--c-surface);cursor:pointer}
  .apply-opt.-on{border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}
  .apply-opt input{margin-top:3px;flex:none}
  .apply-opt strong{display:block;font-size:15px;font-weight:700;letter-spacing:-0.012em}
  .apply-opt em{display:block;margin-top:4px;font-style:normal;font-size:13.5px;line-height:1.55;color:var(--c-text-subtle)}

  .thread-head{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--c-border)}
  .thread-head .th-av{width:34px;height:34px;font-size:14px;flex:none}
  .thread-head strong{display:block;font-size:15px;font-weight:700;letter-spacing:-0.012em}
  .thread-head a{font-size:12.5px;color:var(--c-accent-text);text-decoration:none}
  .thread-head a:hover{text-decoration:underline}

  .review-banner{padding:18px 20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);
    background:var(--c-bg-sunken);margin-bottom:18px}
  .review-banner h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-0.015em}
  .review-banner p{margin:0;font-size:14.5px;line-height:1.6;color:var(--c-text-subtle);max-width:70ch}
  .review-banner.-bad{border-color:var(--c-bad-border);background:var(--c-bad-bg)}
  .review-banner.-bad h3{color:var(--c-bad-text)}

  .listing-row{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-md);background:var(--c-surface);margin-bottom:10px;flex-wrap:wrap}
  .listing-row .main{flex:1;min-width:200px}
  .listing-row h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-0.012em}
  .listing-row .meta{font-size:13.5px;color:var(--c-text-subtle)}
  .listing-row .actions{display:flex;gap:8px;flex:none}
  /* The reviewer's reason. Indented off a rule so it reads as a reply to the
     listing above it rather than as more of the listing's own metadata. */
  .listing-row .review-note{margin:8px 0 0;padding-left:10px;font-size:13.5px;line-height:1.5;
    color:var(--c-text-subtle);border-left:2px solid var(--c-border)}

  .form-panel{padding:22px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface);margin-bottom:20px}
  .form-panel h3{margin:0 0 16px;font-size:17px;font-weight:700}
  .field-block{margin-bottom:14px}
  .field-block .pp-field-label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
  .field-block .pp-field-input select{cursor:pointer}
  .chip-select{display:flex;flex-wrap:wrap;gap:7px}
  .pick-chip{padding:7px 13px;border-radius:999px;font-family:var(--pp-font);font-size:13.5px;font-weight:500;
    cursor:pointer;background:var(--c-surface-inset);color:var(--c-text-muted);border:1px solid transparent}
  .pick-chip.-active{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text)}
  .pick-chip:disabled{opacity:.5;cursor:not-allowed}
  .perf-panel{padding:20px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);
    background:var(--c-surface);margin-bottom:20px}
  .perf-panel h3{margin:0 0 6px;font-size:16px;font-weight:700}
  .perf-lead{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:var(--c-text-subtle);max-width:64ch}
  .perf-rows{display:flex;flex-direction:column;gap:8px}
  .perf-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px 52px;gap:12px;align-items:center;
    padding:11px 13px;border-radius:var(--pp-radius-md);background:var(--c-bg-sunken)}
  @media(max-width:600px){.perf-row{grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px}}
  .perf-title{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .perf-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
  .perf-n em{font-style:normal;font-size:11px;font-weight:500;color:var(--c-text-faint)}
  .perf-rate{font-size:15px;font-weight:700;color:var(--pp-gold-800);font-variant-numeric:tabular-nums;text-align:right}
  .wiz-hint{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--c-text-subtle)}
  .field-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.field-row2{grid-template-columns:1fr}}
  .form-actions{display:flex;gap:10px;margin-top:16px}
  .fielderr{font-size:13px;color:var(--c-bad-text);margin-top:6px}

  /* Post-a-role wizard */
  .wiz-steps{display:flex;align-items:center;gap:0;margin-bottom:28px}
  .wiz-step-wrap{display:flex;align-items:center;flex:1;min-width:0}
  .wiz-step-wrap:last-child{flex:none}
  .wiz-step-btn{display:flex;align-items:center;gap:10px;border:none;background:transparent;font-family:var(--pp-font);
    padding:0;text-align:left;min-width:0}
  .wiz-step-dot{width:28px;height:28px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;background:var(--c-surface-inset);color:var(--c-text-faint);border:1px solid var(--c-border)}
  .wiz-step-dot.-done{background:var(--pp-gold);color:var(--pp-ink);border-color:var(--pp-gold)}
  .wiz-step-dot.-active{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text)}
  .wiz-step-label{font-size:14px;color:var(--c-text-faint);white-space:nowrap}
  .wiz-step-label.-active{color:var(--c-text);font-weight:600}
  .wiz-step-rule{flex:1;height:1px;background:var(--c-border);margin:0 12px;min-width:16px}

  .wiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
  @media(max-width:1023px){.wiz-layout{grid-template-columns:1fr}}
  .wiz-main{min-width:0}
  .wiz-side{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
  @media(max-width:1023px){.wiz-side{position:static}}

  .wiz-chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .wiz-chip{height:38px;padding:0 15px;border-radius:999px;font-family:var(--pp-font);font-size:14px;font-weight:500;
    cursor:pointer;background:var(--c-surface-inset);color:var(--c-text-muted);border:1px solid transparent}
  .wiz-chip.-active{background:var(--c-text);color:var(--c-bg);font-weight:600}

  .wiz-callout{padding:20px;border-radius:var(--pp-radius-lg);background:var(--pp-gold-200);border:1px solid var(--pp-gold-400);margin-bottom:22px}
  .wiz-callout h4{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-0.014em;color:var(--pp-gold-800)}
  .wiz-callout p{margin:0;font-size:14.5px;line-height:1.55;color:var(--pp-gold-800)}

  .wiz-elig-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
  .wiz-elig-card{display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:var(--pp-radius-md);
    cursor:pointer;text-align:left;font-family:var(--pp-font);width:100%;background:var(--c-surface);border:1px solid var(--c-border)}
  .wiz-elig-card.-active{background:var(--pp-gold-200);border-color:var(--pp-gold)}
  .wiz-elig-radio{width:18px;height:18px;flex:none;margin-top:2px;border-radius:50%;border:2px solid var(--c-border-strong);
    display:inline-flex;align-items:center;justify-content:center}
  .wiz-elig-card.-active .wiz-elig-radio{border-color:var(--pp-gold-800)}
  .wiz-elig-radio span{width:8px;height:8px;border-radius:50%;background:transparent}
  .wiz-elig-card.-active .wiz-elig-radio span{background:var(--pp-gold-800)}
  .wiz-elig-label{display:block;font-size:15.5px;font-weight:600;margin-bottom:3px}
  .wiz-elig-note{display:block;font-size:14px;line-height:1.5;color:var(--c-text-subtle)}

  .wiz-preview{padding:18px;border-radius:var(--pp-radius-lg);background:var(--c-surface);border:1px solid var(--c-border)}
  .wiz-preview-label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-text-faint);margin-bottom:10px}
  .wiz-preview-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .wiz-preview-mark{width:40px;height:40px;flex:none;border-radius:9px;background:var(--pp-ink);color:var(--pp-gold);
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .wiz-preview-head h4{margin:0 0 2px;font-size:16px;font-weight:700;letter-spacing:-0.014em;line-height:1.25}
  .wiz-preview-head p{margin:0;font-size:13px;color:var(--c-text-faint)}
  .wiz-preview-tags{display:flex;flex-wrap:wrap;gap:6px}
  .wiz-preview-note{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--c-text-faint)}

  .wiz-cost{padding-top:16px;border-top:1px solid var(--c-border)}
  .wiz-cost h4{margin:0 0 10px;font-size:14px;font-weight:700;letter-spacing:-0.01em}
  .wiz-cost .price{font-size:32px;font-weight:800;letter-spacing:-0.03em}
  .wiz-cost .per{font-size:13.5px;color:var(--c-text-faint);margin-left:6px}
  .wiz-cost p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--c-text-faint)}

  .wiz-checks{padding:18px;border-radius:var(--pp-radius-lg);background:var(--c-bg-sunken);border:1px solid var(--c-border);margin-bottom:18px}
  .wiz-checks h4{margin:0 0 12px;font-size:16px;font-weight:700}
  .wiz-check-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14.5px;line-height:1.5}
  .wiz-check-row:last-child{margin-bottom:0}
  .wiz-check-row .mark{width:18px;height:18px;flex:none;margin-top:1px;border-radius:50%;background:var(--c-good-bg);
    color:var(--c-good-text);display:inline-flex;align-items:center;justify-content:center}
  .wiz-check-row.-bad .mark{background:var(--c-bad-bg);color:var(--c-bad-text)}

  .wiz-foot{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--c-border)}
  .wiz-foot .spacer{flex:1}
  .wiz-foot .gate-note{font-size:13px;color:var(--c-text-faint)}

  .applicant-picker{margin-bottom:18px}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  @media(max-width:900px){.board{grid-template-columns:1fr;gap:20px}}
  .board-col{display:flex;flex-direction:column;gap:10px}
  .board-col-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--c-text-faint);padding:0 2px}
  .applicant-card{padding:14px;border:1px solid var(--c-border);border-radius:var(--pp-radius-md);background:var(--c-surface)}
  .applicant-card .name{font-size:14.5px;font-weight:700;margin:0 0 2px}
  .applicant-card .sub{font-size:12.5px;color:var(--c-text-subtle);margin:0 0 8px}
  .applicant-card .note{font-size:12.5px;color:var(--c-text-muted);margin:0 0 10px;line-height:1.5}
  .applicant-card .card-actions{display:flex;gap:6px;flex-wrap:wrap}
  .applicant-card .card-actions button{height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;
    border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-text-subtle);cursor:pointer;font-family:var(--pp-font)}
  .applicant-card .card-actions button:hover{background:var(--c-bg-sunken)}

  .team-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-md);background:var(--c-surface);margin-bottom:8px;flex-wrap:wrap}
  .team-row .who{flex:1;min-width:160px}
  .team-row .who .name{font-size:14.5px;font-weight:700}
  .team-row .who .role{font-size:12.5px;color:var(--c-text-subtle)}
  .team-row .actions{display:flex;gap:8px}

  .billing-panel{padding:26px;border:1px solid var(--c-border);border-radius:var(--pp-radius-lg);background:var(--c-surface)}
  .billing-panel h3{margin:0 0 8px;font-size:19px;font-weight:700}
  .billing-panel p{margin:0;font-size:14.5px;line-height:1.6;color:var(--c-text-subtle);max-width:56ch}

  .thread-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;border:1px solid var(--c-border);
    border-radius:var(--pp-radius-lg);overflow:hidden;min-height:420px}
  @media(max-width:760px){.thread-layout{grid-template-columns:1fr}}
  .thread-list{border-right:1px solid var(--c-border);overflow-y:auto;max-height:560px}
  @media(max-width:760px){.thread-list{border-right:none;border-bottom:1px solid var(--c-border);max-height:220px}}
  .thread-item{display:block;width:100%;text-align:left;padding:14px 16px;border:none;border-bottom:1px solid var(--c-border);
    background:var(--c-surface);cursor:pointer;font-family:var(--pp-font);color:var(--c-text)}
  .thread-item.-active{background:var(--c-bg-sunken)}
  .thread-item .name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  /* display:block matters: this is a <span>, and text-overflow does nothing on
     an inline box — the preview ran its full width instead of ellipsing, which
     dragged the whole thread list into a horizontal scroll it never wanted. */
  .thread-item .preview{display:block;font-size:13px;color:var(--c-text-subtle);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pp-gold);flex:none}
  .thread-body{display:flex;flex-direction:column;background:var(--c-bg)}
  .thread-messages{flex:1;padding:18px;overflow-y:auto;max-height:460px;display:flex;flex-direction:column;gap:10px}
  .msg-row{display:flex;flex-direction:column;max-width:70%}
  .msg-row.-me{align-self:flex-end;align-items:flex-end}
  .msg-row.-them{align-self:flex-start;align-items:flex-start}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5}
  .msg-row.-me .msg-bubble{background:var(--c-text);color:var(--c-bg);border-bottom-right-radius:4px}
  .msg-row.-them .msg-bubble{background:var(--c-surface-inset);color:var(--c-text);border-bottom-left-radius:4px}
  /* Kept in place rather than dropped from the thread — the other side
     needs to see that something was there and is gone. Declared after the
     -me/-them rules: same specificity, so source order is what decides. */
  .msg-row .msg-bubble.-removed{font-style:italic;color:var(--c-text-faint);
    background:transparent;border:1px dashed var(--c-border)}
  .msg-report-btn{margin-top:3px;border:none;background:transparent;font-family:var(--pp-font);
    font-size:11.5px;color:var(--c-text-faint);cursor:pointer;padding:2px 4px}
  .msg-report-btn:hover{color:var(--c-bad-text)}
  .msg-report-box{margin-top:6px;padding:10px;border-radius:var(--pp-radius-md);background:var(--c-bg-sunken);
    border:1px solid var(--c-border);display:flex;flex-direction:column;gap:8px;width:220px}
  .msg-report-box textarea{width:100%;box-sizing:border-box;font-family:var(--pp-font);font-size:13px;
    border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-sm);padding:6px 8px;background:var(--c-surface);color:var(--c-text)}
  .msg-report-box .row{display:flex;gap:6px;justify-content:flex-end}
  .thread-composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--c-border)}
  .thread-composer input{flex:1;height:44px;padding:0 14px;border:1px solid var(--c-border-strong);border-radius:var(--pp-radius-md);
    background:var(--c-surface);font-family:var(--pp-font);font-size:14.5px;color:var(--c-text)}
  .thread-composer input:focus{outline:none;border-color:var(--pp-gold);box-shadow:var(--pp-focus-ring)}

  .state-panel{padding:48px 16px;text-align:center;color:var(--c-text-subtle);font-size:14.5px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;
    background:var(--c-text);color:var(--c-bg);font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(10,10,10,.2)}
</style>
</head>
<body>

<div id="pp-nav" data-shell="focused"></div>

<main>
  <div class="wrap dash-layout">
    <aside class="dash-rail" id="dashRail"></aside>
    <div class="dash-main">
      <div class="dash-chips-mobile" id="dashChipsMobile"></div>
      <div id="content"><div class="state-panel">Loading…</div></div>
    </div>
  </div>
</main>

<div id="pp-footer" data-variant="legal"></div>

<script src="/pp-nav.js"></script>
<script src="/pp-footer.js"></script>
<script src="/pp-confirm.js"></script>
<script>
(function(){
  "use strict";

  var token = localStorage.getItem("kazi_employer_token");
  if (!token) { location.href = "/signin?role=employer&view=signin"; return; }

  var ELIGIBILITY = [
    { v: "kenya", l: "Open to Kenya" }, { v: "africa", l: "Open to Africa" },
    { v: "world", l: "Worldwide remote" }, { v: "check", l: "Check restrictions" }
  ];
  var WORK_TYPES = ["Remote", "Hybrid", "On-site"];
  var LEVELS = ["Junior", "Mid", "Senior", "Lead"];
  // Mirrors DISCIPLINES in scraper/models.py — keep in step when that changes.
  var DISCIPLINES = ["Product Design","UX Design","UI Design","Brand Design","Motion Design","Design Systems","UX Research","Graphic Design","Design Engineering","Content Design","Creative Technology","Game Design","Sound Design","Instructional Design","Fashion Design","Interior Design"];
  function initialsOf(name){
    return (name || "?").trim().split(/\s+/).map(function(w){ return w[0]; }).slice(0,2).join("").toUpperCase();
  }
  var STAGES = ["Applied", "Reviewing", "Interviewing", "Offer"];
  var RAIL_ICONS = {
    listings: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4V3a1 1 0 011-1h6a1 1 0 011 1v1"/><path d="M3 10h18"/>',
    applicants: '<rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14.5" y="5" width="7" height="8" rx="1.5"/>',
    talent: '<circle cx="10" cy="8" r="3.4"/><path d="M3.5 19.5a6.5 6.5 0 0110-5.4"/><circle cx="17" cy="16" r="3.2"/><path d="M19.4 18.4L22 21"/>',
    messages: '<path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/>',
    team: '<circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 5.5a3.2 3.2 0 010 6M17 14.6a6.2 6.2 0 014.5 5.4"/>',
    company: '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',
    billing: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.5h19"/><path d="M6 15h4"/>',
    account: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'
  };
  var SECTIONS = [
    { key: "listings", label: "Listings" }, { key: "applicants", label: "Applicants" },
    // Talent sits next to Applicants because they are the same job from two
    // directions: people who came to you, and people you go and find.
    { key: "talent", label: "Talent" },
    { key: "messages", label: "Messages" },
    { key: "team", label: "Team" }, { key: "company", label: "Company" }, { key: "billing", label: "Billing" },
    { key: "account", label: "Account" }
  ];

  var me = null;
  // Same as the designer dashboard: a notification about an application or a
  // message should open the tab it is about, not the default one.
  var SECTION_KEYS = ["listings","applicants","talent","messages","team","company","billing","account"];
  function sectionFromUrl(){
    try {
      var t = new URLSearchParams(location.search).get("tab");
      if (t && SECTION_KEYS.indexOf(t) !== -1) return t;
    } catch (e) {}
    return "listings";
  }
  var section = sectionFromUrl();
  var showNewListing = false;
  var wizardStep = 1;
  var wizardMax = 1;
  var wizardData = null;
  var applicantListingId = null;
  var showNewApplicant = false;
  var activeThreadId = null;

  function escapeHtml(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "Authorization": "Bearer " + token });
    var res = await fetch(path, opts);
    if (res.status === 401) { localStorage.removeItem("kazi_employer_token"); location.href = "/signin?role=employer&view=signin"; throw new Error("signed out"); }
    if (!res.ok) {
      var body = await res.json().catch(function(){ return {}; });
      // FastAPI details are sometimes an object, not a string — a 423
      // lockout sends {message, locked}. Only unwrapping strings turned
      // "Too many attempts. Try again in 15 minutes." into
      // "Request failed (423)". admin.html and pp-auth.html already read
      // both shapes; these two didn't.
      var detail = body.detail;
      if (detail && typeof detail === "object" && detail.message) detail = detail.message;
      throw new Error((detail && typeof detail === "string") ? detail : "Request failed (" + res.status + ")");
    }
    return res.json();
  }

  function toast(msg){
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2600);
  }

  function canWrite(){ return me && !me.is_pending_approval && (me.team_role === "owner" || me.team_role === "can_post"); }
  function isOwner(){ return me && !me.is_pending_approval && me.team_role === "owner"; }

  function railIcon(key){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      // An unknown key used to concatenate the string "undefined" into the
      // SVG, which rendered as visible text next to the label — that is how
      // "undefinedTalent" got into the rail. Draw nothing instead.
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (RAIL_ICONS[key] || "") + '</svg>';
  }

  function railHtml(){
    return SECTIONS.map(function(s){
      return '<button type="button" class="dash-rail-item' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '" title="' + s.label + '">' +
        railIcon(s.key) + '<span class="dash-rail-label">' + s.label + '</span></button>';
    }).join("") +
    '<div class="dash-rail-spacer"></div>' +
    '<button type="button" class="dash-rail-item dash-rail-signout" data-rail-signout title="Sign out">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' +
      '<span class="dash-rail-label">Sign out</span></button>';
  }

  function chipsMobileHtml(){
    return '<div class="pp-tabs-scroll">' +
      SECTIONS.map(function(s){
        return '<button type="button" class="pp-tab-chip' + (section === s.key ? " -active" : "") + '" data-section="' + s.key + '">' + s.label + '</button>';
      }).join("") +
      '<button type="button" class="pp-tab-chip" data-rail-signout>Sign out</button>' +
    '</div>';
  }

  function statusPill(status){
    var map = {
      pending: '<span class="pp-status -new">In review</span>',
      approved: '<span class="pp-status -good">Live</span>',
      rejected: '<span class="pp-status -neutral">Not approved</span>',
      closed: '<span class="pp-status -neutral">Closed</span>'
    };
    return map[status] || '<span class="pp-status -neutral">' + escapeHtml(status) + '</span>';
  }

  // ---------------- Listings ----------------

  var ELIG_DETAIL = {
    kenya: { tag: "Narrowest reach", note: "Only candidates already able to work in your home country. Fastest to fill, smallest pool." },
    africa: { tag: "Recommended", note: "Anyone able to work from an African country, however you make that work — contractor, EOR, or a local entity." },
    world: { tag: "Widest reach", note: "Open to remote candidates anywhere. Largest pool, and the clearest signal to designers outside Africa." },
    check: { tag: "Uncertain", note: "You're not sure yet. This shows candidates a flag to check with you before assuming they can apply." }
  };
  function needsProof(elig){ return elig === "africa" || elig === "world"; }

  function blankWizardData(){
    return {
      id: null,
      title: "", company: (me.company ? me.company.name : ""), location: "", work_type: "Remote",
      discipline: "", level: "Mid",
      url: (me.company && me.company.website ? "https://" + me.company.website.replace(/^https?:\/\//, "") : ""),
      eligibility: (me.company && me.company.eligibility) || "africa",
      cross_border_note: "", salary: "", closes_at: "", accepts_applications: false,
      skills: [], screening: [], portfolio_required: false,
      contact_email: me.email || "", description: ""
    };
  }
  function wizardDataFromListing(l){
    return {
      id: l.id, title: l.title || "", company: l.company || "", location: l.location || "", work_type: l.work_type || "Remote",
      discipline: l.discipline || "", level: l.level || "Mid", url: l.url || "",
      eligibility: l.eligibility || "africa", cross_border_note: l.cross_border_note || "", salary: l.salary || "",
      accepts_applications: !!l.accepts_applications,
      closes_at: l.closes_at || "",
      skills: l.skills || [], screening: l.screening || [], portfolio_required: !!l.portfolio_required,
      contact_email: l.contact_email || "", description: l.description || ""
    };
  }

  function wizStepsHtml(){
    var steps = [{ n: 1, label: "Draft" }, { n: 2, label: "Eligibility" }, { n: 3, label: "Preview" }];
    return '<div class="wiz-steps">' + steps.map(function(s){
      var done = s.n < wizardStep, active = s.n === wizardStep, reachable = s.n <= wizardMax;
      return '<div class="wiz-step-wrap">' +
        '<button type="button" class="wiz-step-btn" data-goto-step="' + s.n + '"' + (reachable ? "" : " disabled") + '>' +
          '<span class="wiz-step-dot' + (done ? " -done" : (active ? " -active" : "")) + '">' + (done ? "✓" : s.n) + '</span>' +
          '<span class="wiz-step-label' + (active ? " -active" : "") + '">' + s.label + '</span>' +
        '</button>' +
        (s.n < 3 ? '<span class="wiz-step-rule"></span>' : "") +
      '</div>';
    }).join("") + '</div>';
  }

  function wizPreviewHtml(){
    var d = wizardData;
    var elig = ELIGIBILITY.filter(function(e){ return e.v === d.eligibility; })[0] || ELIGIBILITY[1];
    var eligPositive = d.eligibility === "africa" || d.eligibility === "world" || d.eligibility === "kenya";
    return '<div class="wiz-preview">' +
      '<span class="wiz-preview-label">How it will look in Jobs</span>' +
      '<div class="wiz-preview-head">' +
        '<span class="wiz-preview-mark">' + escapeHtml((d.title || d.company || "?")[0].toUpperCase()) + '</span>' +
        '<div style="flex:1;min-width:0"><h4>' + escapeHtml(d.title || "Job title") + '</h4>' +
          '<p>' + escapeHtml([d.company || "Company", d.location || "Location"].join(" · ")) + '</p></div>' +
      '</div>' +
      '<div class="wiz-preview-tags">' +
        '<span class="pp-elig' + (eligPositive ? " -positive" : " -check") + '">' + (eligPositive ? '<span class="pp-elig-dot"></span>' : "") + escapeHtml(elig.l) + '</span>' +
        '<span class="pp-chip">' + escapeHtml(d.salary || "Not disclosed") + '</span>' +
        '<span class="pp-chip">Just now</span>' +
      '</div>' +
      '<p class="wiz-preview-note">This updates as you type. It\'s the whole card, and it\'s what designers decide from.</p>' +
    '</div>';
  }

  function wizStep1Html(){
    var d = wizardData;
    return '<div class="field-block"><label class="pp-field-label">Role title</label>' +
        '<div class="pp-field-input"><input id="wTitle" value="' + escapeHtml(d.title) + '" placeholder="Senior Product Designer"></div>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">The title a designer would search for, not your internal level code.</p></div>' +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Company</label>' +
          '<div class="pp-field-input"><input id="wCompany" value="' + escapeHtml(d.company) + '" placeholder="Paystack"></div></div>' +
        '<div class="field-block"><label class="pp-field-label">Where the team sits</label>' +
          '<div class="pp-field-input"><input id="wLocation" value="' + escapeHtml(d.location) + '" placeholder="Lagos, or Remote"></div></div>' +
      '</div>' +
      '<div class="field-block"><label class="pp-field-label">Work type</label>' +
        '<div class="wiz-chip-row" id="wWorkType">' + WORK_TYPES.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.work_type === w ? " -active" : "") + '" data-pick-worktype="' + w + '">' + w + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Discipline</label>' +
        '<div class="wiz-chip-row" id="wDiscipline">' + DISCIPLINES.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.discipline === w ? " -active" : "") + '" data-pick-discipline="' + escapeHtml(w) + '">' + escapeHtml(w) + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Seniority</label>' +
        '<div class="wiz-chip-row" id="wLevel">' + LEVELS.map(function(w){
          return '<button type="button" class="wiz-chip' + (d.level === w ? " -active" : "") + '" data-pick-level="' + w + '">' + w + '</button>';
        }).join("") + '</div></div>' +
      '<div class="field-block"><label class="pp-field-label">Link to your application page</label>' +
        '<div class="pp-field-input"><input id="wUrl" value="' + escapeHtml(d.url) + '" placeholder="yoursite.com/careers/senior-product-designer"></div>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Every Apply button on Path &amp; Pixel goes straight here. We do not collect applications.</p></div>' +
      '<div class="field-block"><label class="pp-field-label">Where we reach you about this listing</label>' +
        '<div class="pp-field-input"><input id="wContactEmail" value="' + escapeHtml(d.contact_email) + '"></div></div>' +
      '<div class="fielderr" id="wizStep1Err" hidden></div>';
  }

  function wizStep2Html(){
    var d = wizardData;
    return '<div class="wiz-callout"><h4>This is the question the whole platform is built on</h4>' +
        '<p>Designers across Africa lose hours to roles that were never open to them. Answer this accurately and your listing reaches people who can actually take the job. Answer it loosely and you get applications you have to reject.</p></div>' +
      '<label class="pp-field-label" style="display:block;margin-bottom:12px">Who can take this role?</label>' +
      '<div class="wiz-elig-list">' + ELIGIBILITY.map(function(e){
        var detail = ELIG_DETAIL[e.v] || {};
        var active = d.eligibility === e.v;
        return '<button type="button" class="wiz-elig-card' + (active ? " -active" : "") + '" data-pick-elig="' + e.v + '">' +
          '<span class="wiz-elig-radio"><span></span></span>' +
          '<span style="flex:1;min-width:0">' +
            (detail.tag ? '<span class="pp-chip" style="margin-bottom:6px;display:inline-block">' + escapeHtml(detail.tag) + '</span>' : "") +
            '<span class="wiz-elig-label">' + escapeHtml(e.l) + '</span>' +
            '<span class="wiz-elig-note">' + escapeHtml(detail.note || "") + '</span>' +
          '</span>' +
        '</button>';
      }).join("") + '</div>' +
      (needsProof(d.eligibility) ? '<div class="field-block"><label class="pp-field-label">How do you employ someone outside your own country?</label>' +
        '<textarea id="wCrossBorder" class="pp-textarea" rows="2" placeholder="Contractor agreements through Deel, or an entity in Kenya and Nigeria">' + escapeHtml(d.cross_border_note) + '</textarea>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Shown on the listing. One sentence is enough, and it saves candidates a message.</p></div>' : "") +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label">Pay range, if you\'re sharing it</label>' +
          '<div class="pp-field-input"><input id="wSalary" value="' + escapeHtml(d.salary) + '" placeholder="$4,500 – $6,200 / mo"></div></div>' +
        '<div class="field-block"><label class="pp-field-label" for="wCloses">Closes on, if there\'s a deadline</label>' +
          '<div class="pp-field-input"><input id="wCloses" type="date" value="' + escapeHtml(d.closes_at) + '"></div>' +
          '<p class="wiz-hint">Leave blank to keep it open. After this date the role stops showing on the board, and anyone who saved it sees that it closed.</p></div>' +
      '</div>' +

      '<div class="field-block"><label class="pp-field-label">Skills that actually matter</label>' +
        '<p class="wiz-hint" style="margin:0 0 8px">Up to eight, from the same list designers pick from — that is what lets us put your role in front of the right people rather than everyone in the discipline.</p>' +
        '<div class="chip-select" id="wSkills"></div></div>' +

      // Where applications land. Off by default, which is how every listing
      // behaved before this existed.
      '<div class="field-block"><label class="pp-field-label">Where should applications go?</label>' +
        '<div class="apply-choice">' +
          '<label class="apply-opt' + (!d.accepts_applications ? " -on" : "") + '">' +
            '<input type="radio" name="wApplyMode" value="site"' + (!d.accepts_applications ? " checked" : "") + '>' +
            '<span><strong>To your own site</strong>' +
            '<em>The Apply button sends people to the link above. You handle it in your own ATS, and Kazi is not involved.</em></span></label>' +
          '<label class="apply-opt' + (d.accepts_applications ? " -on" : "") + '">' +
            '<input type="radio" name="wApplyMode" value="kazi"' + (d.accepts_applications ? " checked" : "") + '>' +
            '<span><strong>To you, here on Kazi</strong>' +
            '<em>Applications arrive in your Applicants tab with the designer\'s profile attached. No fee, and only your team sees them.</em></span></label>' +
        '</div></div>' +

      '<div class="field-block"><label class="pp-field-label">What should an applicant be ready to answer?</label>' +
        '<p class="wiz-hint" style="margin:0 0 8px" id="wScreenHint">' +
          (d.accepts_applications
            ? "Up to three. Applicants answer these when they apply, and you read the answers next to their profile."
            : "Up to three. These appear on the listing so candidates can prepare — the answers go to your own site with the application.") + '</p>' +
        [0,1,2].map(function(i){
          return '<div class="pp-field-input" style="margin-bottom:8px"><input id="wScreen' + i + '" value="' +
            escapeHtml(d.screening[i] || "") + '" placeholder="' +
            ["e.g. Which project here is closest to our problem?","e.g. How do you work with engineers?","e.g. What would you want to change first?"][i] + '"></div>';
        }).join("") +
        '<label class="pp-check-row" style="margin-top:6px"><input type="checkbox" id="wPortfolio"' +
          (d.portfolio_required ? " checked" : "") + '><span>A portfolio or case study is required for this role</span></label></div>' +

      '<div style="display:none">' +
      '</div>' +
      '<div class="fielderr" id="wizStep2Err" hidden></div>';
  }

  function wizStep3Html(){
    var d = wizardData;
    var checks = [
      { ok: !!d.title.trim(), label: "Role title and company set" },
      { ok: !!d.url.trim(), label: "Candidates have somewhere to apply" },
      { ok: !needsProof(d.eligibility) || !!d.cross_border_note.trim(), label: "Eligibility answer backed with how you actually hire" }
    ];
    return '<div class="field-block"><label class="pp-field-label" style="display:flex;justify-content:space-between">' +
        '<span>What the person will actually do</span><span style="font-weight:400;color:var(--c-text-faint)">' + d.description.length + ' / 900</span></label>' +
        '<textarea id="wDescription" class="pp-textarea" rows="7" maxlength="900" placeholder="The problem this person owns, who they work with, and what the first three months look like.">' + escapeHtml(d.description) + '</textarea>' +
        '<p style="margin:7px 0 0;font-size:13px;color:var(--c-text-faint)">Skip the values paragraph. Designers scroll past it, and it\'s the same at every company.</p></div>' +
      '<div class="wiz-checks"><h4>Before it goes live</h4>' +
        checks.map(function(c){
          return '<div class="wiz-check-row' + (c.ok ? "" : " -bad") + '"><span class="mark">' + (c.ok ? "✓" : "!") + '</span><span>' + escapeHtml(c.label) + '</span></div>';
        }).join("") +
      '</div>' +
      '<p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--c-text-faint);max-width:60ch">A person reads every listing before it publishes, usually within a working day. If the eligibility answer does not match the job description we come back to you rather than quietly changing it.</p>' +
      '<div class="fielderr" id="wizStep3Err" hidden></div>';
  }

  /* The same vocabulary designers pick their own skills from. Two lists that
     nearly match are worse than one: "Figma" and "figma" would never join up,
     and matching would quietly under-report. */
  var LISTING_SKILLS = ["Figma", "Prototyping", "Design Systems", "User Research", "Wireframing",
    "Interaction Design", "Visual Design", "Branding", "Illustration", "Motion", "Webflow",
    "Accessibility", "Usability Testing", "Information Architecture", "Copywriting", "HTML/CSS"];
  var MAX_LISTING_SKILLS = 8;

  function renderListingSkills(){
    var box = document.getElementById("wSkills");
    if (!box || !wizardData) return;
    var picked = wizardData.skills || [];
    var atCap = picked.length >= MAX_LISTING_SKILLS;
    box.innerHTML = LISTING_SKILLS.map(function(sk){
      var on = picked.indexOf(sk) !== -1;
      return '<button type="button" class="pick-chip' + (on ? " -active" : "") + '"' +
        (!on && atCap ? " disabled" : "") + ' data-skill="' + escapeHtml(sk) + '">' + escapeHtml(sk) + '</button>';
    }).join("");
    box.querySelectorAll("[data-skill]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sk = btn.getAttribute("data-skill");
        var list = wizardData.skills || [];
        var i = list.indexOf(sk);
        if (i !== -1) list.splice(i, 1);
        else if (list.length < MAX_LISTING_SKILLS) list.push(sk);
        wizardData.skills = list;
        renderListingSkills();
      });
    });
  }

  function listingFormHtml(listing){
    if (!wizardData) wizardData = listing && listing.id ? wizardDataFromListing(listing) : blankWizardData();
    var d = wizardData;
    var stepHtml = wizardStep === 1 ? wizStep1Html() : wizardStep === 2 ? wizStep2Html() : wizStep3Html();
    var backLabel = wizardStep === 1 ? null : "Back";
    var nextLabel = wizardStep === 3 ? (d.id ? "Save changes" : "Submit for review") : "Continue";
    var gateNote = wizardStep === 2 && needsProof(d.eligibility) && !d.cross_border_note.trim()
      ? "Add how you hire abroad to continue." : "";
    return '<div class="form-panel"><h3>' + (d.id ? "Edit listing" : "Post a role") + '</h3>' +
      wizStepsHtml() +
      '<div class="wiz-layout">' +
        '<div class="wiz-main"><form id="listingForm" onsubmit="return false">' + stepHtml + '</form></div>' +
        '<div class="wiz-side">' + wizPreviewHtml() +
          '<div class="wiz-cost"><h4>What posting costs</h4>' +
            '<div><span class="price">Free</span><span class="per">for 30 days</span></div>' +
            '<p>After that, $180 for another 30 days. No commission, no candidate fees.</p></div>' +
        '</div>' +
      '</div>' +
      '<div class="wiz-foot">' +
        (backLabel ? '<button type="button" class="pp-btn pp-btn-tertiary" id="wizBackBtn">' + backLabel + '</button>' : "") +
        '<button type="button" class="pp-btn pp-btn-tertiary" id="listingCancelBtn">Cancel</button>' +
        '<div class="spacer"></div>' +
        (gateNote ? '<span class="gate-note">' + escapeHtml(gateNote) + '</span>' : "") +
        '<button type="button" class="pp-btn pp-btn-primary" id="wizNextBtn">' + nextLabel + '</button>' +
      '</div>' +
    '</div>';
  }

  // Counters on the two wizard fields long enough to lose the end of a
  // sentence to the cap.
  function wireWizardCounters(){
    if (!window.PPCount) return;
    PPCount(document.getElementById("wDescription"));
    PPCount(document.getElementById("wCrossBorder"));
  }

  function readWizardStepFields(){
    if (!wizardData) return;
    var get = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : null; };
    if (wizardStep === 1) {
      if (get("wTitle") !== null) wizardData.title = get("wTitle");
      if (get("wCompany") !== null) wizardData.company = get("wCompany");
      if (get("wLocation") !== null) wizardData.location = get("wLocation");
      if (get("wUrl") !== null) wizardData.url = get("wUrl");
      if (get("wContactEmail") !== null) wizardData.contact_email = get("wContactEmail");
    } else if (wizardStep === 2) {
      if (get("wCrossBorder") !== null) wizardData.cross_border_note = get("wCrossBorder");
      var mode = document.querySelector('input[name="wApplyMode"]:checked');
      if (mode) wizardData.accepts_applications = mode.value === "kazi";
      if (get("wSalary") !== null) wizardData.salary = get("wSalary");
      if (get("wCloses") !== null) wizardData.closes_at = get("wCloses");
      var screen = [];
      [0,1,2].forEach(function(i){
        var el = document.getElementById("wScreen" + i);
        if (el && el.value.trim()) screen.push(el.value.trim());
      });
      if (document.getElementById("wScreen0")) wizardData.screening = screen;
      var pf = document.getElementById("wPortfolio");
      if (pf) wizardData.portfolio_required = pf.checked;
    } else if (wizardStep === 3) {
      if (get("wDescription") !== null) wizardData.description = get("wDescription");
    }
  }

  function updateWizPreview(){
    var el = document.querySelector(".wiz-preview");
    if (el) el.outerHTML = wizPreviewHtml();
  }

  function wireWizardStep(){
    if (!wizardData) return;
    if (wizardStep === 1) {
      document.querySelectorAll("[data-pick-worktype]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.work_type = btn.getAttribute("data-pick-worktype"); render(); });
      });
      document.querySelectorAll("[data-pick-discipline]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.discipline = btn.getAttribute("data-pick-discipline"); render(); });
      });
      document.querySelectorAll("[data-pick-level]").forEach(function(btn){
        btn.addEventListener("click", function(){ wizardData.level = btn.getAttribute("data-pick-level"); render(); });
      });
      ["wTitle", "wCompany", "wLocation"].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.addEventListener("input", function(){
          if (id === "wTitle") wizardData.title = el.value;
          if (id === "wCompany") wizardData.company = el.value;
          if (id === "wLocation") wizardData.location = el.value;
          updateWizPreview();
        });
      });
    } else if (wizardStep === 2) {
      document.querySelectorAll("[data-pick-elig]").forEach(function(btn){
        btn.addEventListener("click", function(){
          readWizardStepFields();
          wizardData.eligibility = btn.getAttribute("data-pick-elig");
          render();
        });
      });
      var salaryEl = document.getElementById("wSalary");
      if (salaryEl) salaryEl.addEventListener("input", function(){ wizardData.salary = salaryEl.value; updateWizPreview(); });
    } else if (wizardStep === 3) {
      var descEl = document.getElementById("wDescription");
      if (descEl) descEl.addEventListener("input", function(){
        wizardData.description = descEl.value;
        var counter = descEl.closest(".field-block").querySelector(".pp-field-label span:last-child");
        if (counter) counter.textContent = descEl.value.length + " / 900";
      });
    }
  }

  /* Same gap the designer side had: a company sits in review before its page
     is public, and the only sign of that was a status pill inside the Company
     tab. Roles still post and still publish — this says which part is waiting,
     so "my company page 404s" doesn't read as a broken site. */
  function companyReviewBannerHtml(){
    var c = (me && me.company) || {};
    var status = c.status || "";
    if (!status || status === "approved") return "";
    if (status === "rejected") {
      return '<div class="review-banner -bad"><h3>' + escapeHtml(c.name || "Your company") + " wasn't approved</h3>" +
        '<p>Your roles aren\'t publishing while that\'s the case. Write to ' +
        '<a href="mailto:hello@odana.design">hello@odana.design</a> and we\'ll go through it with you.</p></div>';
    }
    return '<div class="review-banner"><h3>Your company page is in review</h3>' +
      '<p>Someone reads every company before its page joins the directory. You can post roles now — ' +
      'each one is reviewed on its own, and the company page goes live once this is done.</p></div>';
  }

  function renderListings(state){
    var listings = state.listings || [];
    var body = companyReviewBannerHtml() +
      '<div class="section-head"><h2>Listings</h2>' +
      (canWrite() && !showNewListing ? '<button type="button" class="pp-btn pp-btn-primary" id="addListingBtn">Post a role</button>' : "") +
      '</div>';
    var perf = (cache.perf || []).filter(function(r){ return r.views > 0; });
    if (!showNewListing && perf.length) {
      body += '<div class="perf-panel"><h3>How your roles are doing</h3>' +
        '<p class="perf-lead">Opened, and how many of those went through to your site. A role people open and don\'t apply to is usually telling you something about the description or the pay.</p>' +
        '<div class="perf-rows">' + perf.map(function(r){
          var rate = r.views ? Math.round(100 * r.applies / r.views) : 0;
          return '<div class="perf-row">' +
            '<span class="perf-title">' + escapeHtml(r.title) + '</span>' +
            '<span class="perf-n">' + r.views + '<em>opened</em></span>' +
            '<span class="perf-n">' + r.applies + '<em>applied</em></span>' +
            '<span class="perf-rate">' + rate + '%</span>' +
          '</div>';
        }).join("") + '</div></div>';
    }
    if (showNewListing) body += listingFormHtml(state.editingListing || {});
    if (!listings.length && !showNewListing) {
      body += '<div class="pp-empty"><h3>No listings yet</h3><p>Post your first role and it goes through the same review queue as everything else on Kazi.</p></div>';
    } else {
      listings.forEach(function(l){
        body += '<div class="listing-row">' +
          '<div class="main"><h3>' + escapeHtml(l.title) + '</h3>' +
            '<div class="meta">' + escapeHtml(l.location || "Remote") + ' · ' + escapeHtml(l.work_type) + ' · ' + (l.applicant_count || 0) + ' applicant' + (l.applicant_count === 1 ? "" : "s") + '</div>' +
            // A rejection the employer can't see the reason for is one they
            // can't fix. Shown in the reviewer's own words, not paraphrased.
            (l.review_note ? '<p class="review-note">' + escapeHtml(l.review_note) + '</p>' : "") +
          '</div>' +
          statusPill(l.status) +
          '<div class="actions">' +
            (canWrite() && l.status !== "closed" ? '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-edit-listing="' + l.id + '">Edit</button>' : "") +
            (canWrite() && l.status !== "closed" ? '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" data-close-listing="' + l.id + '">Close</button>' : "") +
          '</div>' +
        '</div>';
      });
    }
    return body;
  }

  // ---------------- Applicants ----------------

  function applicantFormHtml(){

      '<p style="margin:0 0 14px;font-size:13.5px;color:var(--c-text-subtle)">Kazi doesn\'t collect applications — add people here yourself as they reach out, so you can track where each conversation stands.</p>' +
      '<form id="applicantForm">' +

          '<div class="field-block"><label class="pp-field-label">Email</label><div class="pp-field-input"><input id="aEmail" type="email"></div></div>' +
          '<div class="field-block"><label class="pp-field-label">Location</label><div class="pp-field-input"><input id="aLocation"></div></div>' +
        '</div>' +
        '<div class="field-block"><label class="pp-field-label">Portfolio link</label><div class="pp-field-input"><input id="aPortfolio" placeholder="https://"></div></div>' +
        '<div class="field-block"><label class="pp-field-label">Note</label><textarea id="aNote" class="pp-textarea" rows="2" placeholder="How you found them, what stood out."></textarea></div>' +

  function applicantCardHtml(a){
    var canMoveBack = a.stage > 0, canMoveNext = a.stage < STAGES.length - 1;
    return '<div class="applicant-card">' +
      '<p class="name">' + escapeHtml(a.full_name) + '</p>' +
      '<p class="sub">' + [a.location, a.email].filter(Boolean).map(escapeHtml).join(" · ") + '</p>' +
      (a.note ? '<p class="note">' + escapeHtml(a.note) + '</p>' : "") +
      (a.portfolio_url ? '<p class="note"><a href="' + escapeHtml(a.portfolio_url) + '" target="_blank" rel="noopener">Portfolio</a></p>' : "") +

        (canMoveBack ? '<button type="button" data-move="' + a.id + '" data-dir="-1">← Back</button>' : "") +
        (canMoveNext ? '<button type="button" data-move="' + a.id + '" data-dir="1">Next →</button>' : "") +
        '<button type="button" data-remove-applicant="' + a.id + '" data-applied-here="' + (a.designer_id ? "1" : "0") + '">Remove</button>' +
      '</div>' : "") +

  function renderApplicants(state){
    var listings = (state.listings || []).filter(function(l){ return l.status !== "rejected"; });
    var body = '<div class="section-head"><h2>Applicants</h2></div>';
    if (!listings.length) {
      return body + '<div class="pp-empty"><h3>Post a role first</h3><p>Applicants are tracked per listing — add one from the Listings tab.</p></div>';

    body += '<div class="applicant-picker pp-field"><label class="pp-field-label">Listing</label><div class="pp-field-input"><select id="applicantListingSelect">' +
      listings.map(function(l){ return '<option value="' + l.id + '"' + (l.id === applicantListingId ? " selected" : "") + '>' + escapeHtml(l.title) + '</option>'; }).join("") +
      '</select></div></div>';

    if (showNewApplicant) body += applicantFormHtml();
    var applicants = state.applicants || [];
    body += '<div class="board">' + STAGES.map(function(stageName, i){
      var col = applicants.filter(function(a){ return a.stage === i; });
      return '<div class="board-col"><div class="board-col-head"><span>' + stageName + '</span><span>' + col.length + '</span></div>' +
        (col.length ? col.map(applicantCardHtml).join("") : '<p style="font-size:12.5px;color:var(--c-text-faint);padding:4px 2px">Nobody here yet.</p>') +
      '</div>';
    }).join("") + '</div>';

  // ---------------- Messages ----------------

  function renderMessages(){
    var body = '<div class="section-head"><h2>Messages</h2></div>';
    if (!cache.conversations.length) {
      body += '<div class="pp-empty"><h3>No conversations yet</h3><p>When a designer messages your company, the thread shows up here.</p></div>';
      return body;
    }
    if (!activeThreadId) activeThreadId = cache.conversations[0].id;
    var active = cache.conversations.filter(function(c){ return c.id === activeThreadId; })[0] || cache.conversations[0];
    body += '<div class="thread-layout">' +
      '<div class="thread-list">' + cache.conversations.map(function(c){
        return '<button type="button" class="thread-item' + (c.id === active.id ? " -active" : "") + '" data-thread="' + c.id + '">' +
          '<span class="name">' + (c.unread_count ? '<span class="unread-dot"></span>' : "") + escapeHtml(c.designer_name) + '</span>' +
          '<span class="preview">' + escapeHtml(c.last_message ? c.last_message.body : "") + '</span>' +
        '</button>';
      }).join("") + '</div>' +
      '<div class="thread-body">' +
        employerThreadHeaderHtml(active) +
        '<div class="thread-messages" id="threadMessages"><p style="color:var(--c-text-faint);font-size:13.5px">Loading…</p></div>' +

  /* An open thread should say who it is with, and let you reach their profile.
     The API has returned designer_handle all along and nothing used it, so a
     conversation with a designer had no route to the work you are talking to
     them about. */
  function employerThreadHeaderHtml(c){
    if (!c || !c.designer_name) return "";
    var handle = c.designer_handle || "";
    return '<div class="thread-head">' +
      '<span class="pp-card-mark th-av">' + escapeHtml(c.designer_name.trim().charAt(0).toUpperCase()) + '</span>' +
      '<div><strong>' + escapeHtml(c.designer_name) + '</strong>' +
      (handle ? '<a href="/designers/' + encodeURIComponent(handle) + '">See their profile</a>' : "") +
      '</div></div>';
  }

  function renderThreadMessages(){
    var el = document.getElementById("threadMessages");
    if (!el) return;
    if (!cache.messages.length) { el.innerHTML = '<p style="color:var(--c-text-faint);font-size:13.5px">Say hello.</p>'; return; }
    el.innerHTML = cache.messages.map(function(m){
      var mine = m.sender_type === "employer";
      return '<div class="msg-row ' + (mine ? "-me" : "-them") + '">' +
        (m.removed
          ? '<div class="msg-bubble -removed">This message was removed.</div>'
          : '<div class="msg-bubble">' + escapeHtml(m.body) + '</div>') +
        (mine || m.removed ? "" : '<button type="button" class="msg-report-btn" data-report-msg="' + m.id + '">Report</button>' +
          '<div class="msg-report-box" data-report-box-msg="' + m.id + '" style="display:none"></div>') +
      '</div>';
    }).join("");
    el.scrollTop = el.scrollHeight;
    wireMessageReportButtons();
  }

  var MSG_REPORT_BOX_HTML =
    '<textarea rows="2" placeholder="Why report this? (optional)"></textarea>' +
    '<div class="row"><button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm report-cancel">Cancel</button>' +
    '<button type="button" class="pp-btn pp-btn-danger pp-btn-sm report-send">Send</button></div>';

  function wireMessageReportButtons(){
    document.querySelectorAll("[data-report-msg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-report-msg");
        var box = document.querySelector('[data-report-box-msg="' + id + '"]');
        if (box.style.display !== "none") { box.style.display = "none"; return; }
        box.innerHTML = MSG_REPORT_BOX_HTML;
        box.style.display = "flex";
        box.querySelector(".report-cancel").addEventListener("click", function(){ box.style.display = "none"; });
        box.querySelector(".report-send").addEventListener("click", async function(){
          var sendBtn = box.querySelector(".report-send");
          sendBtn.disabled = true;
          try {
            await api("/api/employers/me/conversations/" + activeThreadId + "/messages/" + id + "/report", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ summary: box.querySelector("textarea").value.trim() })
            });
            box.style.display = "none";
            toast("Report sent — a person will review it.");
          } catch (e) {}
          sendBtn.disabled = false;
        });
      });
    });
  }

  async function loadThread(id){
    activeThreadId = id;
    var data = await api("/api/employers/me/conversations/" + id + "/messages");
    cache.messages = data.messages;
    renderThreadMessages();
    var convData = await api("/api/employers/me/conversations");

  }

  // ---------------- Billing ----------------

  /* Employers had no account screen at all: four endpoints — update your own
     details, verify your email, resend that code, close your account — and
     nowhere to reach any of them. */
  function renderEmployerAccount(){
    var body = '<div class="section-head"><h2>Account</h2></div>';

    body += '<div class="form-panel"><h3>You</h3><form id="accountForm">' +
      '<div class="field-row2">' +
        '<div class="field-block"><label class="pp-field-label" for="aName">Your name</label>' +
          '<div class="pp-field-input"><input id="aName" maxlength="120" value="' + escapeHtml(me.full_name || "") + '"></div></div>' +
        '<div class="field-block"><label class="pp-field-label" for="aRole">Your role <span style="font-weight:400;color:var(--c-text-faint)">(optional)</span></label>' +
          '<div class="pp-field-input"><input id="aRole" maxlength="120" value="' + escapeHtml(me.role_title || "") + '" placeholder="Head of Design"></div></div>' +
      '</div>' +
      '<div class="fielderr" id="accountErr" hidden></div>' +
      '<button type="submit" class="pp-btn pp-btn-primary" id="accountSaveBtn">Save changes</button></form></div>';

    body += '<div class="form-panel"><h3>Sign-in email</h3>' +
      '<p style="margin:0 0 4px;font-size:14.5px">' + escapeHtml(me.email || "") + '</p>' +
      (me.email_verified
        ? '<p style="margin:0;font-size:13px;color:var(--c-good-text)">Verified.</p>'
        : '<p style="margin:0 0 12px;font-size:13px;color:var(--c-text-subtle)">Not verified yet. ' +
            'Verifying it is how we know a reset link is going to you.</p>' +
          '<div class="verify-row">' +
            '<span class="pp-field-input" style="max-width:190px">' +
              '<input id="empVerifyCode" type="text" inputmode="numeric" autocomplete="one-time-code" ' +
              'maxlength="6" placeholder="6-digit code" aria-label="Verification code">' +
            '</span>' +
            '<button type="button" class="pp-btn pp-btn-primary pp-btn-sm" id="empVerifyBtn">Verify</button>' +
            '<button type="button" class="pp-btn pp-btn-tertiary pp-btn-sm" id="empResendBtn">Send it again</button>' +
          '</div>' +
          '<p class="fielderr" id="empVerifyErr" role="alert" hidden></p>' +
          '<p id="empVerifyNote" role="status" style="margin:8px 0 0;font-size:13px;color:var(--c-text-subtle)" hidden></p>') +
    '</div>';

    body += '<div class="form-panel"><h3>Password</h3>' +
      '<a class="pp-btn pp-btn-secondary" href="/signin?role=employer&view=reset">Reset your password</a></div>';

    body += '<div class="danger-block"><h3>Close your account</h3>' +
      '<p>Removes you from ' + escapeHtml((me.company && me.company.name) || "this company") + '. ' +
      'The company page, its listings and its applicants stay — they belong to the company, not to you. ' +
      'This can\'t be undone.</p>' +
      '<button type="button" class="pp-btn pp-btn-danger" id="empDeleteBtn">Close account</button></div>';
