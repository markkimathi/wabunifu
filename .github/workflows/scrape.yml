name: Refresh job feed

on:
  schedule:
    # 05:00 UTC daily = 08:00 Nairobi
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run pipeline
        working-directory: scraper
        run: python run.py

      - name: Commit updated feed
        run: |
          git config user.name "kazi-bot"
          git config user.email "kazi-bot@users.noreply.github.com"
          git add web/jobs.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh job feed"
          git push
