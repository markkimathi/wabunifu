name: Refresh job feed

on:
  schedule:
    # 05:00 UTC daily = 08:00 Nairobi
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run pipeline
        working-directory: scraper
        run: python run.py

      - name: Commit updated feed
        id: commit
        run: |
          git config user.name "kazi-bot"
          git config user.email "kazi-bot@users.noreply.github.com"
          git add web/jobs.json
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh job feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # flyctl deploy always builds from this checkout's working directory,
      # never from git state, so the committed jobs.json above only reaches
      # the live site if something actually runs `flyctl deploy` after it —
      # that's this step. Needs a FLY_API_TOKEN repo secret (see README).
      - name: Deploy to Fly
        if: steps.commit.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run flyctl deploy
        if: steps.commit.outputs.changed == 'true'
        run: flyctl deploy --remote-only -a wabunifu
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
